name: Android app

# Builds the Android app (Capacitor) from the same index.html as the website.
#  - every push that touches the game: a debug APK you can install to try it (Actions › run › Artifacts)
#  - with the signing secrets set: a signed release AAB (for Google Play) and APK
#  - a pushed tag like v1.2.0: the signed APK is attached to a GitHub Release
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - index.html
      - fonts/**
      - android/**
      - capacitor.config.json
      - package.json
      - package-lock.json
      - scripts/build-web.mjs
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      # tag v1.2.0 → version 1.2.0; any other push → 1.0.<run number>
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.0.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4

      - name: Install and copy the game into the app
        run: npm ci && npm run sync

      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing secrets, so only the debug APK is built. See README (Android アプリ)."
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tasks="assembleDebug"
          [ "$SIGNED" = 1 ] && tasks="$tasks bundleRelease assembleRelease"
          ./gradlew $tasks -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/echorun-$VERSION_NAME-debug.apk"
          if [ "$SIGNED" = 1 ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/echorun-$VERSION_NAME.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../dist/echorun-$VERSION_NAME.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: echorun-android-${{ env.VERSION_NAME }}
          path: dist/

      - name: Attach to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
