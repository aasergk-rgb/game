<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="コインを取るたび時間が巻き戻り、過去の自分が残像として往復しつづける。過去の自分をかわしてループを重ねる、1画面のタイムループ・アクション。">
<meta name="theme-color" content="#0d2546">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="エコーラン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="エコーラン">
<meta property="og:description" content="コインを取るたび時間が巻き戻る。敵はぜんぶ、過去のあなた。">
<meta name="twitter:card" content="summary">
<title>エコーラン</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: a mobile game shell. Full-screen views (boot, home with bottom tabs, game) stacked in one
   app frame; pause / settings / results / how-to rise as bottom sheets (centered cards on wide screens).
   Visual world: night-blue blueprint paper, chunky pressable buttons, amber hero, coral danger. */
:root {
  --bg-0: #081a33;
  --bg-1: #0d2546;
  --bg-2: #17407a;
  --card: #143766;
  --card-hi: #1c4886;
  --card-deep: #0a1d38;
  --card-line: rgba(234, 241, 248, 0.12);
  --chalk: #eaf1f8;
  --chalk-dim: #9fb6d3;
  --line: rgba(234, 241, 248, 0.16);
  --scrim: rgba(5, 15, 32, 0.6);
  --amber: #ffb627;
  --amber-hi: #ffcb5c;
  --amber-deep: #c07a00;
  --coral: #ff6f59;
  --coral-deep: #b9412d;
  --ice: #8fe3ff;
  --mint: #4fd8a8;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-ui: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --safe-t: 0px;
  --safe-b: 0px;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg-1); color: var(--chalk);
  font-family: var(--font-ui); font-weight: 500;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }

.app {
  position: relative; height: 100%; overflow: hidden;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(32, 84, 155, 0.95), transparent 65%),
    linear-gradient(rgba(234, 241, 248, 0.035) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(234, 241, 248, 0.035) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--bg-1);
}
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.view.enter { animation: view-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes view-in { from { opacity: 0; transform: scale(0.985); } }

/* ---------- shared pieces ---------- */
.logo {
  margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1; letter-spacing: 0.02em;
  font-size: clamp(2.6rem, 13vw, 4.4rem);
  text-shadow: -0.07em 0 0 rgba(234, 241, 248, 0.2), -0.14em 0 0 rgba(234, 241, 248, 0.08), 0 6px 0 rgba(0, 0, 0, 0.25);
}
.logo em { font-style: normal; color: var(--amber); text-shadow: -0.07em 0 0 rgba(255, 182, 39, 0.3), -0.14em 0 0 rgba(255, 182, 39, 0.1), 0 6px 0 rgba(0, 0, 0, 0.25); }

.btn3d {
  --c: var(--amber); --c2: var(--amber-hi); --d: var(--amber-deep); --t: var(--bg-1);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 0; border-radius: 18px; padding: 14px 20px; cursor: pointer;
  background: linear-gradient(var(--c2), var(--c) 55%); color: var(--t);
  font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.05em;
  box-shadow: 0 6px 0 var(--d), 0 12px 22px rgba(0, 0, 0, 0.28);
  transition: transform 0.07s ease, box-shadow 0.07s ease;
  touch-action: manipulation;
}
.btn3d:active, .btn3d.press { transform: translateY(4px); box-shadow: 0 2px 0 var(--d), 0 5px 10px rgba(0, 0, 0, 0.28); }
.btn3d svg { width: 22px; height: 22px; }
.btn3d.dark { --c: var(--card-hi); --c2: #2a5a9e; --d: var(--card-deep); --t: var(--chalk); }
.btn3d.coral { --c: var(--coral); --c2: #ff8f7d; --d: var(--coral-deep); }
.btn3d.wide { width: 100%; }
.btn3d.big { padding: 18px 22px; font-size: 1.3rem; border-radius: 22px; }
.roundbtn {
  width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 4px 0 var(--card-deep);
  transition: transform 0.07s, box-shadow 0.07s;
}
.roundbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-deep); }
.roundbtn svg { width: 22px; height: 22px; }
.char {
  --sw: var(--amber);
  position: relative; display: block; width: 64px; height: 64px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.45), transparent 45%), var(--sw);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.12), 0 10px 22px rgba(0, 0, 0, 0.3);
}
.char::before, .char::after { content: ""; position: absolute; top: 34%; width: 15%; height: 17%; border-radius: 50%; background: var(--bg-1); }
.char::before { left: 28%; } .char::after { right: 28%; }
.xpbar { height: 7px; border-radius: 4px; background: rgba(234, 241, 248, 0.15); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: var(--p, 0%); border-radius: 4px; background: linear-gradient(90deg, var(--amber), var(--amber-hi)); transition: width 0.9s cubic-bezier(0.3, 0.8, 0.3, 1); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.66rem; font-weight: 800; }
.kbd { display: inline-block; min-width: 1.6em; text-align: center; font-family: var(--font-mono); font-size: 0.66rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

/* ---------- boot ---------- */
.boot { align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; cursor: pointer; }
.boot .tagline { margin: 0; font-weight: 800; color: var(--chalk-dim); letter-spacing: 0.08em; }
.tap {
  margin-top: 18px; border: 0; background: none; cursor: pointer;
  font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.24em; color: var(--chalk);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.35; } }
.boot-foot { position: absolute; bottom: calc(14px + var(--safe-b)); left: 0; right: 0; margin: 0; font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.2em; color: var(--chalk-dim); }

/* hero: the character runs a loop with its own echoes trailing behind */
.hero-stage {
  --rx: min(30vw, 120px); --ry: min(11vw, 44px);
  position: relative; width: calc(var(--rx) * 2 + 96px); height: calc(var(--ry) * 2 + 110px); margin: 0 auto;
}
.hero-stage .track { position: absolute; left: 48px; right: 48px; top: 55px; bottom: 55px; border: 2px dashed rgba(234, 241, 248, 0.12); border-radius: 50%; }
.hero-stage .char, .hero-stage .echo { position: absolute; left: 50%; top: 50%; margin: -32px 0 0 -32px; animation: roam 4.2s linear infinite; }
.hero-stage .char { z-index: 2; animation-delay: -1.2s; }
.echo { width: 64px; height: 64px; border-radius: 50%; border: 3px dashed rgba(234, 241, 248, 0.7); background: rgba(234, 241, 248, 0.08); }
.echo.e1 { animation-delay: -0.8s; opacity: 0.85; }
.echo.e2 { animation-delay: -0.4s; opacity: 0.55; }
.echo.e3 { animation-delay: 0s; opacity: 0.3; }
@keyframes roam {
  0%    { transform: translate(calc(var(--rx) * -1), 0); }
  12.5% { transform: translate(calc(var(--rx) * -0.7), calc(var(--ry) * -0.7)); }
  25%   { transform: translate(0, calc(var(--ry) * -1)); }
  37.5% { transform: translate(calc(var(--rx) * 0.7), calc(var(--ry) * -0.7)); }
  50%   { transform: translate(var(--rx), 0); }
  62.5% { transform: translate(calc(var(--rx) * 0.7), calc(var(--ry) * 0.7)); }
  75%   { transform: translate(0, var(--ry)); }
  87.5% { transform: translate(calc(var(--rx) * -0.7), calc(var(--ry) * 0.7)); }
  100%  { transform: translate(calc(var(--rx) * -1), 0); }
}

/* ---------- home ---------- */
.home > .topbar, .home > .pages > .page, .home > .tabbar > .tabs { width: 100%; max-width: 620px; margin-inline: auto; }
.topbar { display: flex; align-items: center; gap: 10px; padding: calc(12px + var(--safe-t)) 16px 6px; }
.profile {
  display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; cursor: pointer; text-align: left;
  padding: 5px 16px 5px 5px; border-radius: 999px; border: 1px solid var(--card-line); background: var(--card);
  box-shadow: 0 4px 0 var(--card-deep);
}
.profile .char { width: 42px; height: 42px; flex: none; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12); }
.pinfo { min-width: 0; display: grid; gap: 4px; }
.pinfo b { font-size: 0.84rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--chalk-dim); }
.lv em { font-style: normal; font-weight: 800; color: var(--amber); }
.lv .xpbar { width: 84px; height: 6px; }
.pages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.page.page-in { animation: page-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
.page { padding: 8px 16px 24px; }
.page-home { min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
.page-home .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; padding-top: 8px; min-height: 230px; }
.page-home .sub { margin: 4px 0 0; font-size: 0.86rem; font-weight: 800; color: var(--chalk-dim); letter-spacing: 0.06em; }
.daily-card {
  position: relative; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 14px 16px; border: 0; border-radius: 22px; cursor: pointer; text-align: left;
  background: linear-gradient(135deg, #22579a, #163d72);
  box-shadow: 0 6px 0 var(--card-deep), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  transition: transform 0.07s, box-shadow 0.07s;
}
.daily-card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--card-deep); }
.dc-icon { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--coral); color: var(--bg-1); box-shadow: 0 4px 0 var(--coral-deep); }
.dc-icon svg { width: 34px; height: 34px; }
.dc-text b { display: block; font-size: 1rem; font-weight: 800; }
.dc-text small { display: block; margin-top: 2px; font-size: 0.72rem; color: var(--chalk-dim); }
.dc-best { text-align: right; }
.dc-best small { display: block; font-size: 0.6rem; color: var(--chalk-dim); font-weight: 800; }
.dc-best b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.badge-new { position: absolute; top: -9px; left: 12px; padding: 3px 10px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 0.64rem; font-weight: 800; letter-spacing: 0.08em; box-shadow: 0 3px 0 var(--coral-deep); }
.play-btn { width: 100%; flex-direction: column; gap: 2px; padding: 16px 20px 14px; border-radius: 26px; }
.play-btn .pb-main { display: flex; align-items: center; gap: 12px; font-size: 1.9rem; letter-spacing: 0.1em; }
.play-btn .pb-main svg { width: 30px; height: 30px; }
.play-btn .pb-sub { font-family: var(--font-ui); font-weight: 800; font-size: 0.74rem; letter-spacing: 0.04em; opacity: 0.8; }

.page h2 { margin: 6px 0 14px; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; }
.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 20px; box-shadow: 0 5px 0 var(--card-deep); }
.section-label { margin: 18px 4px 8px; font-size: 0.72rem; font-weight: 800; color: var(--chalk-dim); letter-spacing: 0.08em; }

/* skills */
.sk-loadout { display: grid; gap: 12px; padding: 12px 14px 14px; }
.sk-row { display: grid; gap: 6px; }
.sk-lab { display: flex; align-items: baseline; gap: 8px; font-size: 0.78rem; font-weight: 800; }
.sk-lab small { font-size: 0.66rem; color: var(--chalk-dim); font-weight: 800; }
.sk-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sk-slots.one { grid-template-columns: minmax(0, 1fr); }
.sk-slot { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; min-width: 0; min-height: 62px; padding: 7px 4px; border-radius: 12px; border: 2px dashed rgba(234, 241, 248, 0.18); background: none; color: var(--chalk-dim); font-size: 0.66rem; font-weight: 800; line-height: 1.2; text-align: center; cursor: pointer; }
.sk-slots.one .sk-slot { flex-direction: row; min-height: 46px; gap: 8px; font-size: 0.78rem; }
.sk-slot span { max-width: 100%; overflow-wrap: anywhere; }
.sk-slot svg { width: 20px; height: 20px; flex: none; }
.sk-slot.filled { border: 2px solid transparent; background: rgba(234, 241, 248, 0.08); color: var(--chalk); }
.sk-slot.filled.active { background: rgba(143, 227, 255, 0.14); }
.sk-slot.filled.active svg { color: var(--ice); }
.sk-slot.filled.passive svg { color: var(--amber); }
.sk-slot.locked { border-style: solid; border-color: rgba(234, 241, 248, 0.08); cursor: default; }
.skill-list { display: grid; gap: 8px; }
.skill-card { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 2px solid transparent; border-radius: 16px; background: var(--card); box-shadow: 0 4px 0 var(--card-deep); color: var(--chalk); text-align: left; cursor: pointer; }
.skill-card .sk-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: rgba(255, 182, 39, 0.14); color: var(--amber); }
.skill-card .sk-ic.active { background: rgba(143, 227, 255, 0.14); color: var(--ice); }
.skill-card .sk-ic svg { width: 24px; height: 24px; }
.skill-card .sk-tx { display: grid; gap: 2px; min-width: 0; }
.skill-card .sk-tx b { font-size: 0.9rem; }
.skill-card .sk-tx small { font-size: 0.72rem; line-height: 1.4; color: var(--chalk-dim); }
.skill-card .sk-st { padding: 5px 10px; border-radius: 999px; background: rgba(234, 241, 248, 0.08); font-size: 0.68rem; font-weight: 800; white-space: nowrap; }
.skill-card.on { border-color: var(--amber); }
.skill-card.on .sk-st { background: var(--amber); color: var(--bg-1); }
.skill-card.locked { cursor: default; box-shadow: none; background: rgba(234, 241, 248, 0.04); }
.skill-card.locked .sk-ic { background: rgba(234, 241, 248, 0.06); color: var(--chalk-dim); }
.skill-card.locked .sk-tx b { color: var(--chalk-dim); }
.skill-card:active:not(.locked) { transform: translateY(2px); box-shadow: 0 2px 0 var(--card-deep); }
.rw-skill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 800; color: var(--ice); white-space: nowrap; }
.rw-skill svg { width: 15px; height: 15px; }

/* skins */
.pages.fixed { overflow: hidden; display: flex; flex-direction: column; }
.page.page-skins { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0; }
.page-skins > h2, .page-skins > .skin-show, .page-skins > .segbar { flex: none; }
.skin-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; margin-inline: -16px; padding: 0 16px 20px; }
.skin-scroll .section-label { margin-top: 8px; }
/* soft edge where the list slides under the filters */
.skin-scroll { -webkit-mask-image: linear-gradient(transparent, #000 10px); mask-image: linear-gradient(transparent, #000 10px); }
/* short phones: the tab bar already says スキン, so give the title's room to the list */
@media (max-height: 700px) { .page-skins > h2 { display: none; } .page.page-skins { padding-top: 12px; } }
.skin-show { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; padding: 12px 16px 14px 10px; margin-bottom: 12px; }
.ss-stage { width: 100px; display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
.skin-show .char { width: 78px; height: 78px; animation: bob 2s ease-in-out infinite; }
.pedestal { width: 96px; height: 14px; margin-top: -4px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.35), transparent 70%); }
.ss-info { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.skin-show b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; line-height: 1.15; }
.skin-show small { color: var(--chalk-dim); font-size: 0.78rem; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.skin-cell {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; cursor: pointer;
  background: var(--card); border: 2px solid transparent; border-radius: 18px; box-shadow: 0 5px 0 var(--card-deep);
  font-size: 0.78rem; font-weight: 800;
}
.skin-cell .char { width: 48px; height: 48px; }
.skin-cell small { font-size: 0.62rem; color: var(--chalk-dim); font-weight: 500; }
.skin-cell[aria-pressed="true"] { border-color: var(--amber); }
.skin-cell[aria-pressed="true"] small { color: var(--amber); font-weight: 800; }
.skin-cell:disabled { cursor: not-allowed; }
.skin-cell:disabled .char { background: transparent; box-shadow: none; border: 2px dashed var(--chalk-dim); }
.skin-cell:disabled .char::before, .skin-cell:disabled .char::after { display: none; }

/* achievements */
.ach-sum { display: flex; align-items: center; gap: 14px; padding: 16px; }
.ach-sum b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; }
.ach-sum .xpbar { flex: 1; height: 10px; }
.ach-list { display: grid; gap: 10px; }
.ach { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px 14px; }
.ach .medal { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(234, 241, 248, 0.08); color: var(--chalk-dim); }
.ach .medal svg { width: 24px; height: 24px; }
.ach.done .medal { background: linear-gradient(var(--amber-hi), var(--amber)); color: var(--bg-1); box-shadow: 0 3px 0 var(--amber-deep); }
.ach-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ach-head b { font-size: 0.9rem; font-weight: 800; }
.ach-head small { font-family: var(--font-mono); font-size: 0.66rem; color: var(--chalk-dim); white-space: nowrap; }
.ach.done .ach-head small { color: var(--amber); }
.ach-desc { font-size: 0.72rem; color: var(--chalk-dim); }
.ach .xpbar { grid-column: 2; height: 5px; }

/* records */
.best-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.best-card { padding: 14px 16px; }
.best-card small { display: block; font-size: 0.68rem; font-weight: 800; color: var(--chalk-dim); }
.best-card b { display: block; margin-top: 4px; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; color: var(--amber); }
.rank-list { padding: 4px 14px; }
.rank-row { display: grid; grid-template-columns: 32px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.84rem; }
.rank-row:last-child { border-bottom: 0; }
.rank-row .no { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; background: rgba(234, 241, 248, 0.08); }
.rank-row:first-child .no { background: var(--amber); color: var(--bg-1); }
.rank-row b { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.rank-row span { font-size: 0.72rem; color: var(--chalk-dim); }
.rank-empty { padding: 18px 0; text-align: center; font-size: 0.82rem; color: var(--chalk-dim); }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.totals div { padding: 12px; }
.totals small { display: block; font-size: 0.62rem; font-weight: 800; color: var(--chalk-dim); }
.totals b { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* tab bar */
.tabbar { flex: none; padding: 6px 8px calc(6px + var(--safe-b)); background: rgba(6, 19, 38, 0.88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; border: 0; background: none; cursor: pointer; color: var(--chalk-dim); font-size: 0.66rem; font-weight: 800; }
.tab .ic { width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background-color 0.2s; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--amber); }
.tab:active .ic { transform: scale(0.88); }
.tab .ic { transition: background-color 0.2s, transform 0.1s; }
.tab[aria-current="page"] .ic { background: rgba(255, 182, 39, 0.16); }
.tab .dot { position: absolute; }

/* ---------- game ---------- */
.game { touch-action: none; }
.ghud { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) 14px 6px; }
.ghud .roundbtn { justify-self: start; }
.gscore { text-align: center; }
.gscore small, .gloop small { display: block; font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.2em; color: var(--chalk-dim); }
.gscore b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 7vw, 2.1rem); line-height: 1.05; color: var(--amber); font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.gscore span { font-size: 0.64rem; font-weight: 800; color: var(--chalk-dim); }
.gloop { justify-self: end; min-width: 68px; padding: 6px 12px; text-align: center; border-radius: 16px; background: var(--card); border: 1px solid var(--card-line); box-shadow: 0 4px 0 var(--card-deep); }
.gloop b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; line-height: 1.1; }
.stage { position: relative; flex: 1; min-height: 0; }
.board { position: absolute; left: 0; top: 0; width: 200px; height: 200px; }
.board canvas { display: block; width: 100%; height: 100%; border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 20px 44px rgba(0, 0, 0, 0.4); }
body.mousectl .board canvas { cursor: crosshair; }
.stick { position: absolute; z-index: 3; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.stick-base { position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%; border: 2px solid rgba(234, 241, 248, 0.4); background: radial-gradient(circle, rgba(234, 241, 248, 0.14), rgba(234, 241, 248, 0.03) 70%); }
.stick-knob { position: absolute; left: -27px; top: -27px; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--chalk) 60%); box-shadow: 0 5px 14px rgba(0, 0, 0, 0.4); }
.stick-hint {
  position: absolute; z-index: 1; left: 26px; bottom: calc(30px + var(--safe-b)); width: 124px; height: 124px; border-radius: 50%;
  display: grid; place-items: center; text-align: center; pointer-events: none;
  border: 2px dashed rgba(234, 241, 248, 0.22); color: var(--chalk-dim); font-size: 0.66rem; font-weight: 800; line-height: 1.5;
  transition: opacity 0.2s;
}
.stick-hint.off { opacity: 0; }
.stick-hint.gone { display: none; }
.dash {
  --ready: 1;
  position: absolute; z-index: 3; right: 22px; bottom: calc(26px + var(--safe-b));
  width: 112px; height: 112px; padding: 7px; border: 0; border-radius: 50%; cursor: pointer; touch-action: none;
  background: conic-gradient(var(--coral) calc(var(--ready) * 1turn), rgba(255, 111, 89, 0.16) 0);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
}
.dash span {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.08em; color: var(--bg-1);
  background: radial-gradient(circle at 35% 28%, #ffa496, var(--coral) 60%);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.15);
  transition: transform 0.07s, background 0.12s;
}
.dash.cool span { background: var(--bg-1); color: var(--coral); box-shadow: none; }
.dash.hit span { transform: scale(0.9); }
body.lefty .stick-hint { left: auto; right: 26px; }
body.lefty .dash { right: auto; left: 22px; }
/* SKILL button: the equipped active skill, charged by coins (the ring fills), sits above DASH */
.skillbtn {
  --ready: 0;
  position: absolute; z-index: 3; right: 40px; bottom: calc(154px + var(--safe-b));
  width: 76px; height: 76px; padding: 5px; border: 0; border-radius: 50%; cursor: pointer; touch-action: none;
  background: conic-gradient(var(--ice) calc(var(--ready) * 1turn), rgba(143, 227, 255, 0.16) 0);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
}
.skillbtn > span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; color: var(--ice); background: var(--bg-1); transition: transform 0.07s, background 0.12s, color 0.12s; }
.skillbtn > span svg { width: 30px; height: 30px; }
.skillbtn b { position: absolute; left: 50%; bottom: -8px; translate: -50% 0; padding: 1px 8px; border-radius: 999px; background: var(--bg-1); border: 1px solid rgba(143, 227, 255, 0.4); color: var(--ice); font-family: var(--font-mono); font-size: 0.66rem; font-weight: 600; white-space: nowrap; }
.skillbtn.full > span { background: radial-gradient(circle at 35% 28%, #d4f6ff, var(--ice) 62%); color: var(--bg-1); }
.skillbtn.full b { background: var(--ice); color: var(--bg-1); }
.skillbtn.full::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--ice); animation: ring 1.1s ease-out infinite; pointer-events: none; }
.skillbtn.hit > span { transform: scale(0.9); }
body.lefty .skillbtn { right: auto; left: 40px; }
/* portrait: the arena reaches down to just above DASH, so SKILL sits beside DASH instead of above it */
@media (orientation: portrait) {
  .skillbtn { right: 148px; bottom: calc(44px + var(--safe-b)); }
  body.lefty .skillbtn { right: auto; left: 148px; }
}
body:not(.touch) .stick-hint, body:not(.touch) .dash, body:not(.touch) .skillbtn { display: none; }
.keyhint { position: absolute; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; font-size: 0.7rem; color: var(--chalk-dim); pointer-events: none; }
body.touch .keyhint { display: none; }
.peek-back { position: absolute; z-index: 9; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%); animation: fade 0.25s; }
.skin-show .char.pop { animation: skin-pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1), bob 2s ease-in-out 0.45s infinite; }
@keyframes skin-pop { from { transform: scale(0.6); } }

/* ---------- meta: shards, skins, missions, levels ---------- */
.char.cv { background: none; box-shadow: none; }
.char.cv::before, .char.cv::after { display: none; }
.char.cv canvas { position: absolute; left: -30%; top: -30%; width: 160%; height: 160%; pointer-events: none; filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.28)); }
.gem { display: inline-block; flex: none; width: 13px; height: 13px; border-radius: 3px; transform: rotate(45deg); background: linear-gradient(135deg, #e3fbff, var(--ice) 45%, #36a9dc); box-shadow: inset 0 0 0 1.5px rgba(8, 26, 51, 0.3); }
.wallet { display: inline-flex; align-items: center; gap: 9px; height: 42px; padding: 0 15px 0 13px; border-radius: 999px; cursor: pointer; border: 1px solid var(--card-line); background: var(--card); box-shadow: 0 4px 0 var(--card-deep); font-family: var(--font-display); font-size: 1rem; }
.wallet b { font-weight: 400; font-variant-numeric: tabular-nums; }
.wallet:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-deep); }
.wallet.bump { animation: bump 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes bump { 35% { transform: scale(1.16); } }
.rw { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 400; font-size: 0.92rem; white-space: nowrap; }
.rw .gem { width: 11px; height: 11px; }
.rw-skin { display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 800; color: var(--amber); white-space: nowrap; }
.rw-skin .char { width: 18px !important; height: 18px !important; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; background: var(--coral); color: #fff; font-size: 0.62rem; font-weight: 800; box-shadow: 0 2px 0 var(--coral-deep); }
.tab { position: relative; }
.tab .badge { position: absolute; top: 0; left: calc(50% + 10px); }
.btn3d.small { padding: 8px 14px; font-size: 0.82rem; border-radius: 12px; box-shadow: 0 4px 0 var(--d); }
.btn3d.small:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--d); }
.btn3d:disabled { filter: saturate(0.4) brightness(0.85); cursor: default; transform: none; }
.btn3d .gem { width: 15px; height: 15px; }
.segbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin: 0 0 12px; padding: 4px; border-radius: 14px; background: rgba(5, 16, 34, 0.45); }
.segbar button { position: relative; padding: 9px 4px; border: 0; border-radius: 10px; background: none; cursor: pointer; font-size: 0.8rem; font-weight: 800; color: var(--chalk-dim); }
.segbar button[aria-pressed="true"] { background: var(--card-hi); color: var(--chalk); box-shadow: 0 3px 0 var(--card-deep); }
.segbar .badge { position: absolute; top: -7px; right: 8px; }
.segbar.small button { padding: 7px 4px; font-size: 0.72rem; }
.eyebrow-s { margin: 0; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.24em; color: var(--ice); }
/* home: today's missions */
.mstrip { position: relative; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px; border: 0; border-radius: 18px; cursor: pointer; text-align: left; background: rgba(5, 16, 34, 0.42); box-shadow: inset 0 0 0 1px var(--card-line); }
.mstrip:active { transform: scale(0.99); }
.ms-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(79, 216, 168, 0.16); color: var(--mint); }
.ms-ic svg { width: 22px; height: 22px; }
.ms-text b { display: block; font-size: 0.86rem; font-weight: 800; }
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; }
.bars i { position: relative; height: 6px; border-radius: 3px; overflow: hidden; background: rgba(234, 241, 248, 0.15); }
.bars i::after { content: ""; position: absolute; inset: 0; width: var(--p); border-radius: 3px; background: var(--mint); }
.ms-go { font-size: 1.4rem; color: var(--chalk-dim); }
/* missions */
.mission-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; margin-bottom: 10px; font-size: 0.84rem; font-weight: 800; }
.mission-head small { font-family: var(--font-mono); font-size: 0.66rem; color: var(--chalk-dim); }
.mis, .bonus { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; padding: 12px 14px; }
.mi { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgba(234, 241, 248, 0.08); color: var(--chalk-dim); }
.mi svg { width: 24px; height: 24px; }
.mis.done .mi { background: rgba(79, 216, 168, 0.18); color: var(--mint); }
.mis b { font-size: 0.86rem; font-weight: 800; line-height: 1.4; }
.mis .act { grid-row: 1 / 3; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.mis .meta { grid-column: 2; display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.66rem; color: var(--chalk-dim); }
.mis .meta .xpbar { flex: 1; height: 6px; }
.mis.claimed, .bonus.claimed, .ach.claimed { opacity: 0.55; }
.bonus { margin-top: 10px; grid-template-columns: auto minmax(0, 1fr) auto; }
.bonus .mi { grid-row: auto; background: rgba(255, 182, 39, 0.16); color: var(--amber); }
.bonus b { display: block; font-size: 0.86rem; font-weight: 800; }
.bonus small { font-size: 0.7rem; color: var(--chalk-dim); }
.claimed-mark { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 800; color: var(--mint); white-space: nowrap; }
.claimed-mark svg { width: 15px; height: 15px; }
.login-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 10px; margin-bottom: 10px; }
.lg { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 2px 7px; border-radius: 12px; background: rgba(234, 241, 248, 0.07); color: var(--chalk-dim); }
.lg small { font-size: 0.56rem; font-weight: 800; white-space: nowrap; }
.lg b { font-family: var(--font-display); font-weight: 400; font-size: 0.8rem; color: var(--chalk); }
.lg .char { width: 22px !important; height: 22px !important; }
.lg.today { background: linear-gradient(var(--amber-hi), var(--amber)); color: var(--bg-1); box-shadow: 0 3px 0 var(--amber-deep); }
.lg.today b { color: var(--bg-1); }
.lg.got::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; border-radius: 12px; background: rgba(5, 16, 34, 0.6); color: var(--mint); font-size: 1.3rem; font-weight: 800; }
.login-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.login-grid .lg { padding: 12px 4px 10px; }
.login-grid .lg small { font-size: 0.64rem; }
.login-grid .lg b { font-size: 1rem; }
.login-grid .lg.big { grid-column: span 2; }
.login-grid .lg .char { width: 30px !important; height: 30px !important; }
/* achievements */
.ach { grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; align-items: start; }
.ach .medal { grid-row: 1 / 5; align-self: center; box-shadow: inset 0 0 0 2px var(--tc); color: var(--tc); background: rgba(5, 16, 34, 0.3); }
.ach.done .medal { background: var(--tc); color: var(--bg-1); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.tier { font-size: 0.7rem; letter-spacing: -1px; color: var(--tc); white-space: nowrap; }
.tier i { font-style: normal; color: rgba(234, 241, 248, 0.15); }
.ach-desc em { font-style: normal; font-weight: 800; color: var(--tc); }
.ach-foot { display: flex; align-items: center; gap: 8px; }
.ach-foot .xpbar { flex: 1; height: 5px; }
.ach-foot small { font-family: var(--font-mono); font-size: 0.62rem; color: var(--chalk-dim); white-space: nowrap; }
.ach-rw { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 2px; }
.ach-rw .btn3d, .ach-rw .claimed-mark { margin-left: auto; }
/* skins */
.skin-show .btn3d { margin-top: 4px; padding: 9px 14px; border-radius: 14px; font-size: 0.92rem; box-shadow: 0 4px 0 var(--d), 0 8px 16px rgba(0, 0, 0, 0.24); }
.skin-show .btn3d:active { box-shadow: 0 1px 0 var(--d); transform: translateY(3px); }
.skin-show .btn3d svg { width: 18px; height: 18px; }
/* two lines reserved so the preview keeps its height whichever skin is picked */
.skin-show .how { font-size: 0.74rem; line-height: 1.35; min-height: 2.7em; color: var(--chalk-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rar { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.06em; color: var(--bg-1); }
.rar.N { background: #9fb6d3; } .rar.R { background: #6cc6ff; } .rar.SR { background: #b79bff; }
.rar.UR { background: linear-gradient(90deg, #ffb627, #ff6f59, #b79bff); color: #fff; }
.rar-dot { position: absolute; top: 9px; left: 9px; width: 8px; height: 8px; border-radius: 50%; }
.rar-dot.N { background: #9fb6d3; } .rar-dot.R { background: #6cc6ff; } .rar-dot.SR { background: #b79bff; } .rar-dot.UR { background: linear-gradient(135deg, #ffb627, #ff6f59, #b79bff); }
.skin-cell { position: relative; }
.skin-cell[data-sel="true"] { border-color: var(--chalk); }
.skin-cell[aria-pressed="true"] { border-color: var(--amber); }
.skin-cell.locked .char { opacity: 0.6; }
.skin-cell small.on { color: var(--amber); font-weight: 800; }
.skin-cell .price { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-display); font-size: 0.74rem; color: var(--chalk); }
.skin-cell .price .gem { width: 10px; height: 10px; }
.lockb { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(5, 16, 34, 0.7); color: var(--chalk-dim); }
.lockb svg { width: 12px; height: 12px; }
/* level sheet */
.lv-head { display: flex; align-items: center; gap: 18px; padding: 16px 18px; }
.lv-head .char { width: 58px; height: 58px; flex: none; }
.lv-head > div { flex: 1; display: grid; gap: 5px; }
.lv-head b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1; }
.lv-head small { font-size: 0.72rem; color: var(--chalk-dim); font-weight: 800; }
.lv-head .xpbar { height: 9px; }
.lv-rows { display: grid; gap: 7px; }
.lv-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(234, 241, 248, 0.06); }
.lv-row .ln { font-family: var(--font-display); font-size: 1rem; }
.lv-rw { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.lv-st { font-size: 0.7rem; font-weight: 800; color: var(--amber); }
.lv-st svg { width: 16px; height: 16px; color: var(--mint); }
.lv-row.got { opacity: 0.5; }
.lv-row.next { box-shadow: inset 0 0 0 2px var(--amber); }
/* results */
.res-gain { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.rg { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 8px 12px; border-radius: 14px; background: rgba(234, 241, 248, 0.07); }
.rg .rw { font-size: 1.15rem; }
.rg .rw .gem { width: 13px; height: 13px; }
.rg small { font-size: 0.6rem; font-weight: 800; color: var(--chalk-dim); }

/* achievement detail */
.ach.tappable { cursor: pointer; transition: transform 0.08s; }
.ach.tappable:active { transform: scale(0.985); }
.ad-hero { display: flex; align-items: center; gap: 16px; margin: 2px 0 14px; }
.ad-medal { flex: none; width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; color: var(--tc); background: rgba(5, 16, 34, 0.35); box-shadow: inset 0 0 0 3px var(--tc); }
.ad-medal svg { width: 40px; height: 40px; }
.ad-medal.done { background: var(--tc); color: var(--bg-1); box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3); }
.ad-title { min-width: 0; display: grid; gap: 2px; }
.ad-title .tier { font-size: 0.9rem; }
.ad-title em { font-style: normal; font-size: 0.7rem; font-weight: 800; color: var(--tc); }
.ad-title b { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; line-height: 1.2; }
.ad-title p { margin: 0; font-size: 0.84rem; color: var(--chalk-dim); }
.ad-prog { display: grid; gap: 8px; padding: 14px 16px; }
.ad-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ad-row small { font-size: 0.72rem; font-weight: 800; color: var(--chalk-dim); }
.ad-row b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.ad-prog .xpbar { height: 10px; }
.ad-status { font-size: 0.74rem; font-weight: 800; color: var(--chalk-dim); }
.ad-status.ok { color: var(--mint); }
.ad-rewards { display: grid; grid-template-columns: 1fr; gap: 10px; }
.ad-rewards:has(.skinbox) { grid-template-columns: 1fr 1.3fr; }
.rwbox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px 10px; text-align: center; }
.rwbox b { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; }
.rwbox small { font-size: 0.68rem; font-weight: 800; color: var(--chalk-dim); }
.gem.big { width: 26px; height: 26px; border-radius: 6px; margin: 6px 0; }
.skinbox { cursor: pointer; }
.skinbox .char { width: 56px; height: 56px; margin-bottom: 4px; }
.skinbox:active { transform: scale(0.98); }
.ad-series { display: grid; gap: 6px; }
.ad-item { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 14px; cursor: pointer; text-align: left; background: rgba(234, 241, 248, 0.06); }
.ad-item .mini { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--tc); box-shadow: inset 0 0 0 2px var(--tc); }
.ad-item .mini svg { width: 16px; height: 16px; }
.ad-item.done .mini { background: var(--tc); color: var(--bg-1); box-shadow: none; }
.ad-item .nm { font-size: 0.82rem; font-weight: 800; }
.ad-item .nm small { display: block; font-size: 0.66rem; font-weight: 500; color: var(--chalk-dim); }
.ad-item .tier { color: var(--tc); }
.ad-item.cur { box-shadow: inset 0 0 0 2px var(--chalk); }
.ad-item .badge { position: absolute; top: -6px; right: -4px; }
.linkish { border: 0; background: none; padding: 0; cursor: pointer; }

/* ---------- tutorial ---------- */
.tut { position: absolute; z-index: 2; left: 10px; right: 10px; top: 16px; display: flex; justify-content: center; pointer-events: none; }
.tut-card {

}
.tut-step { display: block; font-family: var(--font-mono); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.2em; color: var(--coral); }

.tut-bar { display: block; height: 8px; margin-top: 8px; border-radius: 4px; background: rgba(13, 37, 70, 0.12); overflow: hidden; }
.tut-bar i { display: block; height: 100%; width: var(--p, 0%); border-radius: 4px; background: var(--mint); transition: width 0.15s; }
.tut-card.ok { background: var(--mint); box-shadow: 0 5px 0 #2a9c74, 0 12px 26px rgba(0, 0, 0, 0.35); }
.tut-card.ok p { color: var(--bg-1); }
.tut-card.ng { animation: tut-shake 0.42s; }
.tut-card.ng .tut-step { color: var(--coral); }
@keyframes tut-in { from { opacity: 0; transform: translateY(-14px) scale(0.94); } }
@keyframes tut-shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.skipbtn {
  justify-self: end; display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--card-line); border-radius: 999px; background: var(--card); box-shadow: 0 4px 0 var(--card-deep);
  font-size: 0.78rem; font-weight: 800; color: var(--chalk);
}
.skipbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-deep); }
.dash.pulse::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--coral); animation: ring 1.1s ease-out infinite; pointer-events: none; }
@keyframes ring { from { opacity: 0.9; transform: scale(0.9); } to { opacity: 0; transform: scale(1.25); } }
.learned { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.learned span { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(234, 241, 248, 0.07); font-size: 0.8rem; font-weight: 800; }

/* ---------- toasts ---------- */
.toasts { position: absolute; z-index: 20; top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); width: min(92%, 380px); pointer-events: none; }
.toast {

}
.toast .ti { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--amber); box-shadow: 0 3px 0 var(--amber-deep); }

/* ---------- modal sheets ---------- */

  padding: 10px 18px calc(22px + var(--safe-b));

}

@keyframes sheet-down { to { transform: translateY(105%); } }
@media (min-width: 700px) and (min-height: 560px) {

}
@keyframes pop-out { to { opacity: 0; transform: translate(-50%, -47%) scale(0.95); } }

/* drag handle: a taller invisible grab zone around the grey bar */

    tab() { tone(740, 0.04, 'triangle', 0.04); tone(990, 0.05, 'triangle', 0.035, 0, 0.03); },
    open() { tone(520, 0.12, 'triangle', 0.04, 880); },
    move() { tone(660, 0.025, 'triangle', 0.025); },
    start() { [0, 0.07, 0.14].forEach((d, i) => tone([660, 880, 1320][i], 0.12, 'square', 0.04, 0, d)); },
    coin() { tone(988, 0.08, 'square', 0.05); tone(1480, 0.16, 'square', 0.05, 0, 0.07); },
    chain(n) { const base = 660 * Math.pow(1.06, Math.min(n, 10)); [0, 0.06, 0.12].forEach((d, i) => tone(base * [1, 1.26, 1.5][i], 0.1, 'triangle', 0.05, 0, d)); },
    near() { tone(1760, 0.05, 'triangle', 0.05); },
    phase() { tone(620, 0.12, 'triangle', 0.05, 1240); },
    dash() { tone(260, 0.16, 'sawtooth', 0.03, 820); },
    ready() { tone(1320, 0.05, 'sine', 0.025); },
    rewind() { tone(1100, 0.42, 'sawtooth', 0.022, 110); },
    erase() { tone(420, 0.3, 'triangle', 0.07, 1600); },
    freeze() { [0, 0.05, 0.1, 0.15].forEach((d, i) => tone(2093 - i * 180, 0.25, 'sine', 0.04, 0, d)); },
    storm() { tone(110, 0.7, 'sawtooth', 0.05, 55); },
    tick() { tone(660, 0.04, 'sine', 0.05); },
    ach() { [0, 0.08, 0.16].forEach((d, i) => tone([1046, 1318, 1568][i], 0.22, 'triangle', 0.05, 0, d)); },
    count() { tone(1200, 0.02, 'square', 0.02); },
    die() { tone(330, 0.6, 'square', 0.06, 45); tone(160, 0.5, 'sawtooth', 0.04, 40, 0.05); },
  };

  // Music: a 4-bar loop in A minor whose layers and tempo rise with the loop count.
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BGM = { on: false, step: 0, next: 0, timer: 0, level: 0, tempo: 112 };
  function bgmStart() {
    if (!ac || BGM.on) return;
    BGM.on = true; BGM.step = 0; BGM.next = ac.currentTime + 0.08;
    BGM.timer = setInterval(bgmTick, 25);
  }
  function bgmStop() { BGM.on = false; clearInterval(BGM.timer); }
  function bgmSet(level, tempo) { BGM.level = level; BGM.tempo = tempo; }
  function bgmTick() {
    if (!ac || !BGM.on) return;
    const spb = 60 / BGM.tempo / 4;
    while (BGM.next < ac.currentTime + 0.12) { bgmStep(BGM.step, BGM.next, spb); BGM.next += spb; BGM.step = (BGM.step + 1) % 64; }
  }
  function bgmStep(s, t, spb) {
    const bar = s >> 4, i = s & 15, ch = CHORDS[bar], L = BGM.level;
    if (L >= 1 && i % 4 === 0) voice(t, 150, 0.16, 'sine', 0.55, 42, bgmBus);
    if (L >= 2 && i % 4 === 2) hiss(t, 0.05, 0.12, 7000, bgmBus);
    if (L >= 3 && i % 2 === 1) hiss(t, 0.03, 0.05, 9000, bgmBus);
    if (L >= 4 && (i === 7 || i === 15)) hiss(t, 0.12, 0.12, 2500, bgmBus);
    if ([0, 3, 6, 8, 11, 14].includes(i)) voice(t, mtof(ch[0] - 24), spb * 1.7, 'triangle', L === 0 ? 0.16 : 0.22, 0, bgmBus);
    const arpOn = L === 0 ? i % 4 === 0 : L >= 3 || i % 2 === 0;
    if (arpOn) {
      const n = ch[(i >> (L >= 3 ? 0 : 1)) % 3] + 12 + (bar % 2 && L >= 3 ? 12 : 0);
      voice(t, mtof(n), spb * 0.9, 'square', L === 0 ? 0.03 : 0.035, 0, bgmBus);
    }
  }
  function duck() {
    if (!ac) return;
    const g = bgmBus.gain, v = save.settings.bgm * 0.5;
    g.cancelScheduledValues(ac.currentTime);
    g.setValueAtTime(v * 0.25, ac.currentTime);
    g.linearRampToValueAtTime(v, ac.currentTime + 0.6);
  }
  function playTempo() { return 120 + Math.min(loopN, 25) * 1.4 + (storm ? 14 : 0); }
  function playLevel() { return storm ? 4 : loopN < 3 ? 1 : loopN < 6 ? 2 : 3; }
  function menuMusic() { bgmStop(); if (ac) { bgmSet(0, 104); bgmStart(); } }

  addEventListener('pointerdown', e => { if (e.pointerType === 'touch') setTouch(true); }, { capture: true });

  // ================= game state =================
  let view = 'boot', tab = 'home';
  let state = 'menu';      // menu | play | rewind | paused | dying | result
  let mode = 'endless', pausedFrom = 'play';
  let ghosts = [], rec = [];
  let frame = 0, gtime = 0, loopN = 0, score = 0, shownScore = 0, chain = 0;
  let graceLeft = 0, timeLeft = 0, freezeLeft = 0, storm = false;
  let coin = null, eraser = null, hourglass = null, nextStart = null;
  let rewindT = 0, rewindFrom = 0, dyingT = 0, revealT = 0, killer = null;
  let banner = null, hint = null, tut = null, run = null, unlockedThisRun = [];
  let particles = [], popups = [];
  let shake = 0, flash = 0, slow = 0, hitstop = 0, tick = 0, readyPulse = 0, retryHold = 0;
  const P = { x: W / 2, y: W / 2, vx: 0, vy: 0, dash: 0, cd: 0, inv: 0, dx: 0, dy: 1, trail: [] };
  // skill effects in a run (none in the tutorial)
  const has = id => !tut && !!run && !!run.sk && run.sk.has(id);
  const dashCd = () => has('quick') ? 60 : DASH_CD;
  const grabR = () => R + (has('magnet') ? 46 : 22);
  const limit = () => has('timeplus') ? 600 : LIMIT;
  const fastClear = () => has('chainkeep') ? 270 : FAST_CLEAR;
  const grace = () => has('safestart') ? 108 : GRACE;

  function ghostAt(g, f) {
    const L = g.len;
    let i = 0;
    if (L > 1) { const per = 2 * (L - 1), m = f % per; i = m < L ? m : per - m; }
    return [g.path[i * 3], g.path[i * 3 + 1], g.path[i * 3 + 2]];
  }
  function makeGhost(data, n) {
    const path = Float32Array.from(data), len = path.length / 3;
    const lane = new Path2D();
    lane.moveTo(path[0], path[1]);
    for (let i = 2; i < len; i += 2) lane.lineTo(path[i * 3], path[i * 3 + 1]);
    lane.lineTo(path[(len - 1) * 3], path[(len - 1) * 3 + 1]);
    return { path, len, n, near: 0, phased: false, lane };
  }
  function pickSpot(rng, from, minD, avoid) {
    let bp = null, bs = -1;
    for (let i = 0; i < 80; i++) {
      const p = { x: 90 + rng() * (W - 180), y: 90 + rng() * (W - 180) };
      const d = dist(p, from);
      let a = 999;
      for (const q of avoid) a = Math.min(a, dist(p, q));
      if (d >= minD && a >= 170) return p;
      const s = Math.min(d / minD, a / 170);
      if (s > bs) { bs = s; bp = p; }
    }
    return bp;
  }

  function startRun(m) {
    initAudio();
    if (m === 'tutorial') { startTutorial(tut ? tut.then : null); return; }
    if (!save.tutorialDone) { startTutorial(m); return; }
    mode = m; tut = null; tutUI(false);
    ensureDaily();
    seed = m === 'daily' ? 'daily-' + today() : 'e' + Math.random().toString(36).slice(2);
    ghosts = []; loopN = 1; score = 0; shownScore = 0; chain = 0; killer = null;
    particles = []; popups = []; unlockedThisRun = []; retryHold = 0; dashBuf = 0; dashQueued = false; skillQueued = false;
    run = { nears: 0, phases: 0, erases: 0, freezes: 0, maxChain: 0, dashes: 0, frames: 0, storms: 0, maxGhosts: 0, firstDaily: false, startLv: save.level, startXp: save.xp };
    const lo = loadout();
    run.sk = new Set(lo.passive.map(k => k.id)); run.act = lo.active; run.charge = 0; run.lastChance = run.sk.has('lastchance');
    skillBtnSetup();
    closeModal(); peekBack.hidden = true;
    stickHint.classList.toggle('gone', save.stats.plays >= 3);
    save.stats.plays++;
    if (m === 'daily') {
      save.stats.dailyPlays++;
      if (save.stats.lastDailyDay !== today()) { save.stats.lastDailyDay = today(); save.stats.dailyDays++; run.firstDaily = true; }
    }
    persist();
    showView('game');
    checkAch();
    beginLoop({ x: W / 2, y: W / 2 });
    sfx.start();
    bgmStop(); bgmSet(playLevel(), playTempo()); bgmStart();
  }

  function beginLoop(s) {
    rec = []; frame = 0; gtime = 0; freezeLeft = 0;
    P.x = s.x; P.y = s.y; P.vx = P.vy = 0; P.dash = 0; P.inv = 0; P.trail = [];
    storm = loopN >= 10 && loopN % 5 === 0;
    coin = pickSpot(rngFor(loopN, 'coin'), s, 360, []);
    eraser = (loopN % 4 === 0 && ghosts.length >= 3) ? pickSpot(rngFor(loopN, 'erase'), s, 220, [coin]) : null;
    hourglass = (loopN >= 6 && loopN % 6 === 0 && ghosts.length >= 3) ? pickSpot(rngFor(loopN, 'freeze'), s, 200, eraser ? [coin, eraser] : [coin]) : null;
    graceLeft = grace(); timeLeft = limit();
    for (const g of ghosts) { g.near = 0; g.phased = false; }
    const subs = [];
    if (storm) subs.push('残像が1.5倍速');
    if (eraser) subs.push('消しゴム出現');
    if (hourglass) subs.push('砂時計出現');
    if (!subs.length) subs.push(ghosts.length ? '残像 ×' + ghosts.length : 'コインを取ろう');
    banner = { text: storm ? 'ECHO STORM' : 'LOOP ' + loopN, sub: subs.join(' · '), t: 80, storm };
    // one-time tips the first time each item or twist shows up
    hint = null;
    const tip = (key, text) => { if (!save.tips[key]) { save.tips[key] = 1; persist(); hint = { text, t: 300 }; } };
    if (eraser) tip('eraser', '赤い消しゴムで、いちばん長い残像を消せる');
    if (hourglass) tip('freeze', '砂時計を取ると、残像が2.5秒止まる');
    if (storm) tip('storm', 'ECHO STORM：残像が1.5倍速！');
    if (storm) { sfx.storm(); shakeBy(10); }
    state = 'play';
    if (BGM.on) bgmSet(playLevel(), playTempo());
  }

  function collect() {
    const clearF = frame;
    chain = clearF <= fastClear() ? chain + 1 : 0;
    if (run.act && run.charge < run.act.charge && ++run.charge === run.act.charge) { popup(coin.x, coin.y - 108, 'SKILL READY', C.ice, 0.95); sfx.ready(); }
    run.maxChain = Math.max(run.maxChain, chain);
    const mult = 1 + Math.min(chain, 8) * 0.25;
    const gain = Math.round((100 + Math.ceil(timeLeft / 60) * 10) * mult);
    score += gain;
    popup(coin.x, coin.y - 38, '+' + fmt(gain), C.amber, 1.35);
    if (chain > 0) { popup(coin.x, coin.y - 74, 'CHAIN ' + chain + ' ×' + mult.toFixed(2), C.chalk, 0.95); sfx.chain(chain); }
    else sfx.coin();
    burst(coin.x, coin.y, 28, C.amber, 6);
    sfx.rewind(); duck(); buzz(15);
    doFlash(0.45);
    save.stats.coins++;
    if (clearF <= 60) save.flags.fast = 1;
    if (timeLeft <= 30) save.flags.clutch = 1;
    if (storm) { save.flags.storm = 1; run.storms++; }
    ghosts.push(makeGhost(rec, loopN));
    run.maxGhosts = Math.max(run.maxGhosts, ghosts.length);
    nextStart = { x: coin.x, y: coin.y };
    rewindFrom = Math.max(frame, Math.floor(gtime)); rewindT = 0;
    loopN++;
    checkAch();
    state = 'rewind';
  }

  function doErase() {
    let idx = 0;
    ghosts.forEach((g, i) => { if (g.len > ghosts[idx].len) idx = i; });
    const g = ghosts[idx], p = ghostAt(g, Math.floor(gtime));
    burst(p[0], p[1], 34, C.coral, 7);
    burst(eraser.x, eraser.y, 14, C.coral, 4);
    popup(p[0], p[1] - 34, '#' + g.n + ' 消去 +50', C.coral, 1.15);
    ghosts.splice(idx, 1);
    score += 50; eraser = null; run.erases++; save.flags.erase = 1;
    shakeBy(9); sfx.erase(); buzz(20);
    checkAch();
  }

  function doFreeze() {
    burst(hourglass.x, hourglass.y, 26, C.ice, 6);
    popup(hourglass.x, hourglass.y - 34, 'フリーズ +30', C.ice, 1.1);
    hourglass = null; freezeLeft = FREEZE_FRAMES; score += 30; run.freezes++;
    sfx.freeze(); doFlash(0.25); buzz(20);
    save.flags.freeze = 1;
    checkAch();
  }

  function useSkill() {
    const k = run && run.act;
    if (tut || !k) return;
    if (run.charge < k.charge) { popup(P.x, P.y - 34, `チャージ ${run.charge}/${k.charge}`, C.dim, 0.85); sfx.tick(); return; }
    if (k.id === 'erase' && !ghosts.length) { popup(P.x, P.y - 34, '消せる残像がいない', C.dim, 0.85); return; }
    run.charge = 0; run.skillUses = (run.skillUses || 0) + 1; save.flags.skillUse = 1;
    const col = C.ice;
    if (k.id === 'timestop') {
      freezeLeft = Math.max(freezeLeft, 120);
      burst(P.x, P.y, 24, col, 6); popup(P.x, P.y - 34, 'タイムストップ', col, 1.1); sfx.freeze();
    } else if (k.id === 'blink') {
      const fx = P.x, fy = P.y;
      P.x = clamp(P.x + P.dx * 230, R, W - R); P.y = clamp(P.y + P.dy * 230, R, W - R);
      P.inv = Math.max(P.inv, 20); P.trail = [];
      burst(fx, fy, 16, C.chalk, 4); burst(P.x, P.y, 24, col, 6);
      popup(P.x, P.y - 34, 'ブリンク', col, 1); sfx.dash();
    } else if (k.id === 'shield') {
      P.inv = Math.max(P.inv, 180);
      burst(P.x, P.y, 24, col, 5); popup(P.x, P.y - 34, 'シールド 3秒', col, 1.1); sfx.phase();
    } else if (k.id === 'erase') {
      const gi = Math.floor(gtime);
      let idx = 0, best = Infinity;
      ghosts.forEach((g, i) => { const p = ghostAt(g, gi), d = Math.hypot(p[0] - P.x, p[1] - P.y); if (d < best) { best = d; idx = i; } });
      const g = ghosts[idx], p = ghostAt(g, gi);
      burst(p[0], p[1], 34, C.coral, 7); popup(p[0], p[1] - 34, '#' + g.n + ' 消去', C.coral, 1.1);
      ghosts.splice(idx, 1); shakeBy(8); sfx.erase();
    }
    doFlash(0.2); buzz(15);
    checkAch();
  }
  function lastChance() {
    run.lastChance = false; P.inv = 75; save.flags.lastChance = 1;
    shakeBy(16); doFlash(0.45); hitstop = 6;
    burst(P.x, P.y, 30, C.coral, 6); popup(P.x, P.y - 40, 'ラストチャンス！', C.coral, 1.2);
    sfx.erase(); buzz([40, 30, 40]);
    checkAch();
  }

  function die(g) {
    state = 'dying'; dyingT = 0; killer = g; hitstop = 10; endStick();
    shakeBy(24); doFlash(0.6);
    burst(P.x, P.y, 46, skinOf(save.skin).color, 8);
    sfx.die(); bgmStop(); buzz([60, 40, 90]);
  }

  function finishRun() {
    const loops = loopN - 1;
    let isBest = false;
    if (mode === 'endless') { if (score > save.best.endless) { save.best.endless = score; isBest = true; } }
    else { ensureDaily(); save.daily.plays++; if (score > save.daily.best) { save.daily.best = score; isBest = true; } }
    const list = save.top[mode];
    list.push({ score, loops, date: today() });
    list.sort((a, b) => b.score - a.score);
    list.length = Math.min(list.length, 5);
    const st = save.stats, br = save.bestRun, lr = liveRun();
    st.loops += loops; st.nears += run.nears; st.phases += run.phases; st.ms += Math.round(run.frames * STEP);
    for (const k in lr) br[k] = Math.max(br[k] || 0, lr[k]);
    // rewards: shards for every run, XP towards the next level
    const shardGain = Math.floor(loops / 2) + Math.floor(score / 1000) + (run.firstDaily ? 5 : 0);
    addShards(shardGain);
    const xpGain = loops * 10 + Math.floor(score / 100) + 5;
    const ups = addXp(xpGain);
    const missionsDone = missionProgress({ loops, coins: loops, nears: run.nears, phases: run.phases, chain: run.maxChain, score, plays: 1, daily: mode === 'daily' ? 1 : 0, erases: run.erases });
    save.tutorial = true;
    persist();
    run.done = true;
    checkAch();
    state = 'result'; revealT = 0; shownScore = score;
    lastResult = { isBest, xpGain, ups: ups.length, shardGain, missionsDone };
    openModal('result', lastResult);
    menuMusic();
  }

  // ================= tutorial =================
  // Four guided steps in the real arena. Hitting a ghost restarts the step instead of ending the run.
  const tutEl = { box: $('tut'), card: $('tutCard'), step: $('tutStep'), title: $('tutTitle'), text: $('tutText'), barWrap: $('tutBarWrap'), bar: $('tutBar') };
  const TUT_STEPS = 4;
  function tutUI(on) {
    tutEl.box.hidden = !on;
    $('skipBtn').hidden = !on;
    $('gLoopBox').hidden = on;
    dashBtn.classList.toggle('pulse', false);
  }
  function tutCard(title, text, kind) {
    tutEl.step.textContent = kind === 'ok' ? 'CLEAR!' : kind === 'ng' ? 'もう一度' : 'STEP ' + Math.min(tut.step, TUT_STEPS) + ' / ' + TUT_STEPS;
    tutEl.title.textContent = title;
    tutEl.text.textContent = text;
    tutEl.card.className = 'tut-card' + (kind ? ' ' + kind : '');
    void tutEl.card.offsetWidth;
    tutEl.card.style.animation = 'none'; void tutEl.card.offsetWidth; tutEl.card.style.animation = '';
  }
  function tutCopy(step) {
    const t = isTouch();
    return [
      null,
      ['キャラクターを動かそう', t ? '画面のどこでも指を置いて、そのままドラッグ' : 'WASD か 矢印キーで動かす'],
      ['ダイヤ形のコインを取ろう', 'コインを取るとループクリア。時間が巻き戻る'],
      ['残像をよけてコインを取ろう', 'さっきの自分が「残像」になって同じ道を往復している。触れたらアウト'],
      ['ダッシュで壁をすり抜けよう', t ? 'DASHボタンを押すと一瞬だけ加速。その間は残像に当たらない' : 'Space でダッシュ。その間は残像に当たらない'],
    ][step];
  }
  function startTutorial(then) {
    initAudio();
    mode = 'tutorial'; seed = 'tutorial';
    tut = { step: 0, then: then || null, delay: 0, moved: 0, last: null, start: null };
    ghosts = []; loopN = 1; score = 0; shownScore = 0; chain = 0; killer = null;
    particles = []; popups = []; unlockedThisRun = []; retryHold = 0; dashBuf = 0; dashQueued = false; skillQueued = false;
    run = { nears: 0, phases: 0, erases: 0, freezes: 0, maxChain: 0, dashes: 0, frames: 0, startLv: save.level, startXp: save.xp };
    skillBtnSetup();
    closeModal(); peekBack.hidden = true;
    stickHint.classList.remove('gone');
    showView('game');
    tutUI(true);
    tutSetup(1);
    sfx.start();
    bgmStop(); bgmSet(1, 116); bgmStart();
  }
  function tutSetup(step) {
    tut.step = step; tut.delay = 0;
    if (step > TUT_STEPS) { tutFinish(); return; }
    state = 'play'; frame = 0; gtime = 0; rec = []; freezeLeft = 0; storm = false;
    eraser = null; hourglass = null; banner = null; hint = null; coin = null;
    timeLeft = LIMIT; graceLeft = 0;
    P.vx = P.vy = 0; P.dash = 0; P.cd = 0; P.inv = 0; P.trail = [];
    if (step === 1) { P.x = 500; P.y = 620; tut.moved = 0; }
    if (step === 2) { coin = { x: P.x < 500 ? 780 : 220, y: P.y < 600 ? 800 : 420 }; }
    if (step === 3) {
      P.x = nextStart.x; P.y = nextStart.y; graceLeft = 40;
      coin = tutCoinAwayFromLane();
    }
    if (step === 4) {
      // a solid wall of ghosts: the only way across is a dash
      ghosts = [];
      for (let y = 25; y <= 975; y += 50) {
        const pts = [], ph = y / 90;
        for (let i = 0; i < 120; i++) pts.push(520 + Math.sin(i / 120 * Math.PI * 2 + ph) * 8, y, 0);
        const g = makeGhost(pts, 0); g.wall = true; ghosts.push(g);
      }
      P.x = 230; P.y = 600; coin = { x: 810, y: 600 };
    }
    tut.start = { x: P.x, y: P.y };
    tut.last = { x: P.x, y: P.y };
    const [title, text] = tutCopy(step);
    tutCard(title, text);
    tutEl.barWrap.hidden = step !== 1;
    tutEl.bar.style.setProperty('--p', '0%');
    dashBtn.classList.toggle('pulse', step === 4);
  }
  function tutCoinAwayFromLane() {
    const g = ghosts[ghosts.length - 1], rng = mulberry(hashStr('tut' + Math.round(P.x) + ',' + Math.round(P.y)));
    let best = null, bestScore = -1;
    for (let i = 0; i < 120; i++) {
      const p = { x: 100 + rng() * 800, y: 360 + rng() * 560 };
      let lane = 1e9;
      for (let k = 0; k < g.len; k += 4) lane = Math.min(lane, Math.hypot(g.path[k * 3] - p.x, g.path[k * 3 + 1] - p.y));
      const d = dist(p, P), sc = Math.min(lane / 120, d / 320);
      if (sc >= 1) return p;
      if (sc > bestScore) { bestScore = sc; best = p; }
    }
    return best;
  }
  function tutClear(title, text) {
    tutCard(title, text, 'ok');
    sfx.ach(); buzz(15);
    popup(P.x, P.y - 40, 'OK!', C.amber, 1.4);
  }
  function tutFail() {
    shakeBy(12); doFlash(0.3); buzz([40, 30, 40]);
    burst(P.x, P.y, 24, C.coral, 5);
    sfx.die();
    P.x = tut.start.x; P.y = tut.start.y; P.vx = P.vy = 0; P.dash = 0; P.cd = 0; P.trail = [];
    frame = 0; gtime = 0; rec = []; graceLeft = 40;
    tutCard(tut.step === 4 ? '通れるのはダッシュ中だけ' : '残像に触れたらアウト', tut.step === 4 ? '壁の手前でダッシュしてみよう' : 'コースを変えてもう一度', 'ng');
    setTimeout(() => { if (tut && state === 'play') { const [t, x] = tutCopy(tut.step); tutCard(t, x); } }, 1600);
  }
  function tutCollect() {
    burst(coin.x, coin.y, 28, C.amber, 6);
    sfx.coin(); doFlash(0.35);
    if (tut.step === 2 || tut.step === 3) {
      ghosts.push(makeGhost(rec, loopN));
      nextStart = { x: coin.x, y: coin.y };
      rewindFrom = Math.max(frame, Math.floor(gtime)); rewindT = 0;
      loopN++;
      sfx.rewind();
      state = 'rewind';
      tutClear(tut.step === 2 ? 'ループクリア！' : 'ナイス回避！', tut.step === 2 ? '時間が巻き戻る。さっきの自分はどうなる？' : '残像の動きは、自分が走った道そのもの');
    } else {
      coin = null;
      tutClear('すり抜け成功！', 'これで準備OK');
      tut.delay = 70;
    }
  }
  function tutFinish() {
    state = 'tutdone'; dashBtn.classList.remove('pulse'); endStick();
    const first = !save.tutorialDone;
    save.tutorialDone = true; save.howtoSeen = true;
    let ups = 0, xpGain = 0;
    if (first) { xpGain = 30; ups = addXp(xpGain).length; }
    save.flags.tutorial = 1;
    persist();
    checkAch();
    openModal('tutdone', { then: tut.then, xpGain, ups });
    menuMusic();
  }
  function tutSkip() {
    const then = tut ? tut.then : null;
    save.tutorialDone = true; save.howtoSeen = true; persist();
    tut = null; tutUI(false);
    if (then) startRun(then); else goHome();
  }

  function triggerDash() {
    if (save.settings.control === 'mouse' && mouse) {
      const dx = mouse.x - P.x, dy = mouse.y - P.y, d = Math.hypot(dx, dy);
      if (d > 4) { P.dx = dx / d; P.dy = dy / d; }
    }
    P.dash = has('longdash') ? 13 : DASH_FRAMES; P.cd = dashCd(); run.dashes++;
    sfx.dash(); burst(P.x, P.y, 10, C.chalk, 3); buzz(8);
  }

  function stepPlay() {
    run.frames++;
    const inp = inputVec(), il = Math.hypot(inp.x, inp.y);
    if (il > 0.1) { P.dx = inp.x / il; P.dy = inp.y / il; }
    // a dash pressed slightly before the cooldown ends still fires when it does
    if (dashQueued) { dashBuf = DASH_BUFFER; dashQueued = false; }
    if (tut && tut.step === 1) dashBuf = 0;
    if (dashBuf > 0) { if (P.cd <= 0) { triggerDash(); dashBuf = 0; } else dashBuf--; }
    if (skillQueued) { skillQueued = false; useSkill(); }
    if (P.inv > 0) P.inv--;

    if (P.dash > 0) {
      P.vx = P.dx * SPEED * DASH_MUL; P.vy = P.dy * SPEED * DASH_MUL; P.dash--;
    } else {
      P.vx += (inp.x * SPEED - P.vx) * 0.38;
      P.vy += (inp.y * SPEED - P.vy) * 0.38;
    }
    P.x = clamp(P.x + P.vx, R, W - R);
    P.y = clamp(P.y + P.vy, R, W - R);
    if (P.cd > 0 && --P.cd === 0) { readyPulse = 16; sfx.ready(); }
    const phasing = P.dash > 0;

    rec.push(P.x, P.y, phasing ? 1 : 0);
    P.trail.push(P.x, P.y);
    if (P.trail.length > 30) P.trail.splice(0, 2);
    if (skinOf(save.skin).sparkle && tick % 5 === 0) particles.push({ x: P.x + (Math.random() - 0.5) * 30, y: P.y + (Math.random() - 0.5) * 30, vx: 0, vy: -0.6, life: 1, decay: 0.04, col: '#fff3c4', size: 3 });

    if (graceLeft <= 0) {
      const gi = Math.floor(gtime);
      for (const g of ghosts) {
        if (g.near > 0) g.near--;
        if (P.inv > 0) continue;   // shield, blink or last chance: ghosts pass through harmlessly
        const gp = ghostAt(g, gi), d = Math.hypot(gp[0] - P.x, gp[1] - P.y);
        if (d < HIT) {
          if (!phasing) {
            if (tut) { tutFail(); return; }
            if (run.lastChance) { lastChance(); continue; }
            die(g); return;
          }
          if (!g.phased) {
            g.phased = true; score += 15; run.phases++;
            popup(P.x, P.y - 34, 'すり抜け +15', C.chalk, 1);
            sfx.phase();
            checkAch();
          }
        } else {
          if (g.phased && d > R * 2.2) g.phased = false;
          if (!tut && !phasing && d >= R * 2 && d < (has('nearpro') ? NEAR + 16 : NEAR) && g.near <= 0) {
            const pts = has('nearpro') ? 50 : 25;
            g.near = 70; score += pts; slow = 8; run.nears++;
            popup(P.x, P.y - 34, 'ニアミス +' + pts, C.chalk, 1);
            sfx.near(); buzz(6);
            checkAch();
          }
        }
      }
    }

    frame++; graceLeft--;
    if (freezeLeft > 0) freezeLeft--; else gtime += storm ? STORM_SPEED : 1;
    if (tut) {
      if (tut.step === 1 && !tut.delay) {
        tut.moved += Math.hypot(P.x - tut.last.x, P.y - tut.last.y);
        tutEl.bar.style.setProperty('--p', Math.min(100, tut.moved / 3.2) + '%');
        if (tut.moved >= 320) { tutClear('いい感じ！', '移動はこれでばっちり'); tut.delay = 60; }
      }
      tut.last = { x: P.x, y: P.y };
      if (tut.delay > 0 && --tut.delay === 0) { tutSetup(tut.step + 1); return; }
      if (coin && dist(P, coin) < R + 22) tutCollect();
      return;
    }
    timeLeft--;
    if (timeLeft > 0 && timeLeft <= 180 && timeLeft % 60 === 0) sfx.tick();
    if (timeLeft <= 0) { die(null); return; }
    if (eraser && dist(P, eraser) < grabR()) doErase();
    if (hourglass && dist(P, hourglass) < grabR()) doFreeze();
    if (dist(P, coin) < grabR()) collect();
  }

  function step() {
    tick++;
    pollPad();
    if (state === 'paused') return;
    if (state === 'resuming') {
      resumeT--;
      if (resumeT > 0 && resumeT % 30 === 0) sfx.tick();
      if (resumeT <= 0) { state = pausedFrom; bgmStart(); sfx.start(); }
      return;
    }
    if (hitstop > 0) { hitstop--; return; }
    shake *= 0.86; if (flash > 0) flash -= 0.035;
    if (readyPulse > 0) readyPulse--;
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= p.decay; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.t++; p.y -= 0.7; }
    popups = popups.filter(p => p.t < 64);
    if (banner && --banner.t <= 0) banner = null;
    if (hint && hint.t > 0) hint.t--;

    // hold R (or the pad's SELECT) to restart the run
    if (active() && (keys.has('r') || pad.select)) { if (++retryHold >= RETRY_HOLD) { startRun(mode); return; } }
    else retryHold = 0;

    if (state === 'play') stepPlay();
    else if (state === 'rewind') { if (++rewindT >= REWIND) { if (tut) tutSetup(tut.step + 1); else beginLoop(nextStart); } }
    else if (state === 'dying') { if (++dyingT >= DYING) finishRun(); }
    else if (state === 'result') { gtime++; revealT++; }
    syncDashBtn();
    updateHud();
  }

  // ================= fx helpers =================
  function burst(x, y, n, col, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.25 + Math.random());
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.018 + Math.random() * 0.03, col, size: 2 + Math.random() * 4.5 });
    }
  }
  function popup(x, y, text, col, size) { popups.push({ x, y, text, col, size: size || 1, t: 0 }); }
  function shakeBy(v) { if (save.settings.shake) shake = Math.max(shake, v); }
  function doFlash(v) { if (save.settings.flash) flash = Math.max(flash, v); }
  const toastQ = [];
  let toastBusy = false;
  function toast(icon, label, text) { toastQ.push([icon, label, text]); if (!toastBusy) nextToast(); }
  function nextToast() {
    const item = toastQ.shift();
    if (!item) { toastBusy = false; return; }
    toastBusy = true;
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<span class="ti">${item[0]}</span><span><small>${item[1]}</small><b>${item[2]}</b></span>`;
    toastsEl.appendChild(t);
    paintChars(t);
    setTimeout(() => t.classList.add('out'), 2100);
    setTimeout(() => { t.remove(); nextToast(); }, 2450);
  }

  // ================= achievements, shards, missions, login =================

  function liveRun() {
    if (!run || run.done || tut) return {};
    const loops = loopN - 1;
    return { loops, score, nears: run.nears, phases: run.phases, chain: run.maxChain, erases: run.erases, storms: run.storms, nodash: run.dashes === 0 ? loops : 0, ghosts: run.maxGhosts };
  }
  const achDone = a => !!save.ach[a.id];
  const achClaimable = a => achDone(a) && !save.achClaimed[a.id];
  function checkAch(quiet) {
    let changed = false;
    for (const a of ACH) {
      if (save.ach[a.id]) continue;
      const [v, t] = a.prog();
      if (v < t) continue;
      save.ach[a.id] = Date.now(); changed = true;
      if (!quiet) {
        unlockedThisRun.push(a.name);

  }
  function addShards(n) {
    if (!n) return;
    save.shards += n; save.stats.shardsEarned += n;
    const w = $('wallet'), el = $('pShards');
    if (el) el.textContent = fmt(save.shards);

  function grantSkin(id) {
    if (!id || owns(id)) return false;
    save.owned[id] = 1;
    toast(skinIcon(id), '新しいスキン！', skinOf(id).name);
    return true;
  }
  function addXp(n) {
    const ups = [];
    let lv = save.level, xp = save.xp + n;
    while (xp >= needXp(lv)) { xp -= needXp(lv); lv++; ups.push(lv); }
    save.level = lv; save.xp = xp;
    for (const L of ups) {
      const r = levelReward(L);
      addShards(r.shards);
      toast(I.up, 'レベルアップ！ Lv.' + L, '報酬 ◆' + r.shards + (r.skin ? ' ＋スキン「' + skinOf(r.skin).name + '」' : ''));
      grantSkin(r.skin);
      for (const k of skillsAt(L)) toast(k.ic, '新しいスキル！', `「${k.name}」${k.desc}`);
      if (PASSIVE_SLOT_LV.includes(L) && L > PASSIVE_SLOT_LV[0]) toast(I.bolt, 'スキル枠が増えた', `パッシブスキルを${passiveSlots()}つ装備できる`);
    }
    if (ups.length) { autoEquip(); updateBadges(); }
    return ups;
  }
  function toggleSkill(id) {
    const k = skillOf(id), eq = save.skills;
    if (!k) return;
    if (!skillOpen(k)) { toast(I.lock, k.name, `Lv.${k.lv} で使えるようになる`); sfx.ui(); return; }
    // drop anything stale before counting slots
    const lo = loadout();
    eq.passive = lo.passive.map(x => x.id); eq.active = lo.active ? lo.active.id : '';
    if (k.kind === 'active') eq.active = eq.active === id ? '' : id;
    else if (eq.passive.includes(id)) eq.passive = eq.passive.filter(x => x !== id);
    else {
      if (eq.passive.length >= passiveSlots()) {
        const out = skillOf(eq.passive.shift());
        toast(k.ic, '入れ替えました', `${out.name} → ${k.name}`);
      }
      eq.passive.push(id);
    }
    persist(); sfx.ui(); buzz(8);
    setTab('skill', 'keep');
  }
  function claimAch(id) {
    const a = ACH.find(x => x.id === id);
    if (!a || !achClaimable(a)) return;
    save.achClaimed[id] = Date.now();
    addShards(a.shards);
    grantSkin(a.skin);
    sfx.coin(); buzz(12);
    persist(); checkAch(); updateBadges();
  }

  // daily missions: three drawn from the pool, the same for everyone on a given date
  function ensureMissions() {
    if (save.missions.date === today()) return;
    const rng = mulberry(hashStr('missions-' + today()));
    const pool = MISSION_POOL.slice(), list = [];
    while (list.length < 3) {
      const m = pool.splice(Math.floor(rng() * pool.length), 1)[0];
      const k = Math.floor(rng() * m.ns.length);
      list.push({ pid: m.id, n: m.ns[k], reward: m.rw[k], prog: 0, claimed: false });
    }
    save.missions = { date: today(), list, bonus: false };
    persist();
  }
  const missionDef = m => MISSION_POOL.find(p => p.id === m.pid);
  const missionDone = m => m.prog >= m.n;
  function missionProgress(r) {
    ensureMissions();
    let newly = 0;
    for (const m of save.missions.list) {
      const d = missionDef(m), before = missionDone(m), v = r[d.key] || 0;
      m.prog = d.kind === 'sum' ? m.prog + v : Math.max(m.prog, v);
      if (!before && missionDone(m)) { newly++; toast(I.target, 'ミッション達成！', d.text(m.n)); }
    }
    updateBadges();
    return newly;
  }
  function claimMission(i) {
    const m = save.missions.list[i];
    if (!m || m.claimed || !missionDone(m)) return;
    m.claimed = true;
    save.stats.missions++;
    addShards(m.reward); addXp(10);
    sfx.coin(); buzz(12);
    persist(); checkAch(); updateBadges();
  }
  function claimMissionBonus() {
    const ms = save.missions;
    if (ms.bonus || !ms.list.every(m => m.claimed)) return;
    ms.bonus = true;
    addShards(MISSION_BONUS);
    sfx.ach(); buzz(15);
    persist(); updateBadges();
  }

  // login bonus: one claim per calendar day; the 7-day calendar keeps cycling, the streak resets on a missed day
  const dayStr = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  function checkLogin() {
    const L = save.login, t = today();
    if (L.last === t) return;
    const y = new Date(); y.setDate(y.getDate() - 1);
    L.streak = L.last === dayStr(y) ? L.streak + 1 : 1;
    L.best = Math.max(L.best, L.streak);
    L.total++; L.last = t;
    persist(); checkAch(true); updateBadges();
  }
  const loginPending = () => save.login.last === today() && save.login.claimed !== today();
  const loginDay = () => (save.login.total - 1) % 7;
  function claimLogin() {
    if (!loginPending()) return;
    const d = loginDay();
    save.login.claimed = today();
    addShards(LOGIN[d]);
    if (d === 6) grantSkin('sunrise');
    sfx.ach(); buzz(15);
    persist(); checkAch(); updateBadges();
  }

  function claimableCount() {
    ensureMissions();
    const ms = save.missions;
    return ACH.filter(achClaimable).length
      + ms.list.filter(m => missionDone(m) && !m.claimed).length
      + (!ms.bonus && ms.list.every(m => m.claimed) ? 1 : 0)
      + (loginPending() ? 1 : 0);
  }
  function updateBadges() {
    for (const b of tabsEl.children) {
      const n = b.dataset.tab === 'missions' ? claimableCount() : b.dataset.tab === 'skill' ? newSkills() : 0;

      if (badge) { if (n) badge.textContent = n; else badge.remove(); }
    }
  }

        <div class="card skin-show">

    },
    skill() {
      if (save.skills.seen < save.level) { save.skills.seen = save.level; persist(); }
      const lo = loadout(), slots = passiveSlots();
      const slot = (k, kind) => k

      const card = k => {

      };
      return `<h2>スキル</h2>
        <div class="card sk-loadout">
          <div class="sk-row"><span class="sk-lab">アクティブ<small>${isTouch() ? 'SKILL ボタンで発動' : 'E キーで発動'}</small></span><div class="sk-slots one">${act}</div></div>
