<style>
/* Layout: one-screen arcade cabinet. HUD strip, square cyanotype (blueprint) arena, control strip.
   Menus slide over the arena; the arena keeps running an attract loop behind them. */
:root {
  --deep: #0d2546;
  --cyan: #17407a;
  --chalk: #eaf1f8;
  --chalk-dim: #9fb6d3;
  --line: rgba(234, 241, 248, 0.22);
  --veil: rgba(13, 37, 70, 0.84);
  --amber: #ffb627;
  --coral: #ff6f59;
  --ice: #8fe3ff;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--deep); color: var(--chalk);
  font-family: var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; }
.app {
  height: 100%; max-width: 840px; margin: 0 auto;
  padding-inline: 16px; padding-block: 12px;
  display: flex; flex-direction: column; gap: 10px;
}

/* HUD */
.hud { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 1.45rem; line-height: 1; letter-spacing: 0.04em; }
.brand small {
  display: block; margin-top: 5px;
  font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.2em; color: var(--chalk-dim);
}
.stats { display: flex; gap: 16px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat span { font-size: 0.58rem; letter-spacing: 0.18em; color: var(--chalk-dim); }
.stat b { font-size: 1.15rem; font-weight: 600; line-height: 1; }
.stat.score b { color: var(--amber); }
.stat.chain b { color: var(--chalk-dim); }
.stat.chain.on b { color: var(--amber); }

/* stage */
.stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; touch-action: none; }
.board { position: relative; width: 300px; height: 300px; }
.board canvas {
  display: block; width: 100%; height: 100%;
  border-radius: 4px; outline: 1px solid var(--line); outline-offset: 5px;
}
.toasts {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3;
  display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  width: min(92%, 22rem);
}
.toast {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 14px; border-radius: 10px;
  background: var(--chalk); color: var(--deep);
  font-size: 0.82rem; line-height: 1.35;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  animation: toast-in 0.28s ease-out;
  transition: opacity 0.4s, transform 0.4s;
}
.toast b { font-weight: 700; }
.toast .tag { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.14em; color: var(--cyan); }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } }

/* overlay screens */
.overlay {
  position: absolute; inset: 0; z-index: 2; overflow-y: auto;
  display: flex; padding: 16px;
  background: var(--veil);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.overlay.peek { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; pointer-events: none; }
.overlay.peek .card { display: none; }
.peek-back { display: none; }
.overlay.peek .peek-back {
  display: block; pointer-events: auto;
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
}
.card {
  margin: auto; width: 100%; max-width: 34rem;
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
}
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.28em; color: var(--chalk-dim); }
.card h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.8rem, 12vw, 4.8rem); line-height: 1; letter-spacing: 0.02em;
}
.card h1 em { font-style: normal; color: var(--amber); }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.3rem, 5vw, 1.9rem); line-height: 1.25; text-wrap: balance; }
.card h3 { margin: 6px 0 0; font-family: var(--font-mono); font-weight: 600; font-size: 0.7rem; letter-spacing: 0.22em; color: var(--chalk-dim); align-self: flex-start; }
.card p { margin: 0; line-height: 1.75; font-size: 0.95rem; }
.lede { max-width: 25em; }
.lede b { color: var(--amber); font-weight: 700; }
.screen-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.screen-head h2 { text-align: left; }

.menu { display: grid; gap: 10px; width: min(100%, 22rem); }
.mode {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px; border-radius: 14px; cursor: pointer; text-align: left;
  font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 0.04em;
  transition: transform 0.12s ease;
}
.mode small { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; line-height: 1.4; text-align: right; opacity: 0.85; }
.mode.primary { background: var(--amber); color: var(--deep); border: 0; }
.mode.alt { background: transparent; color: var(--chalk); border: 1.5px solid var(--amber); }
.mode:hover { transform: translateY(-1px); }
.mode:active { transform: scale(0.98); }
.subnav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

.btn {
  font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.08em;
  color: var(--deep); background: var(--amber);
  border: 0; border-radius: 999px; padding: 13px 34px; cursor: pointer;
  transition: transform 0.12s ease;
}
.btn:hover { transform: translateY(-1px) scale(1.03); }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: transparent; color: var(--chalk); border: 1.5px solid var(--line); }
.chip {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em;
  color: var(--chalk); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer;
}
.chip:hover { border-color: var(--chalk-dim); }
.chip .count { color: var(--amber); }
.btn:focus-visible, .chip:focus-visible, .dash:focus-visible, .mode:focus-visible, .skin:focus-visible,
input:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
.small { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.12em; color: var(--chalk-dim); }

/* how to play */
.rules {
  list-style: none; margin: 0; padding: 0; width: 100%;
  display: grid; gap: 10px; text-align: left;
}
.rules li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: 0.86rem; line-height: 1.6; color: var(--chalk-dim); }
.rules b { color: var(--chalk); }
.rules svg { width: 34px; height: 34px; }
.keys { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
.keys th, .keys td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.keys th { font-weight: 700; white-space: nowrap; color: var(--chalk); }
.keys td { color: var(--chalk-dim); }
kbd { font-family: var(--font-mono); font-size: 0.72rem; color: var(--chalk); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

/* collection */
.ach-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; text-align: left; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.ach .medal { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: var(--deep); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; }
.ach.locked .medal { background: transparent; border: 1.5px dashed var(--chalk-dim); color: var(--chalk-dim); }
.ach b { display: block; font-size: 0.86rem; }
.ach span { display: block; font-size: 0.74rem; color: var(--chalk-dim); line-height: 1.45; }
.ach.locked b { color: var(--chalk-dim); }
.skins { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.skin {
  --sw: var(--amber);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 5.8rem; padding: 10px 6px; border-radius: 10px; cursor: pointer;
  background: transparent; color: var(--chalk); border: 1px solid var(--line);
  font-size: 0.74rem; line-height: 1.35;
}
.skin i { width: 30px; height: 30px; border-radius: 50%; background: var(--sw); position: relative; }
.skin i::before, .skin i::after { content: ""; position: absolute; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--deep); }
.skin i::before { left: 8px; } .skin i::after { right: 8px; }
.skin small { color: var(--chalk-dim); font-size: 0.64rem; }
.skin[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.skin:disabled { cursor: not-allowed; }
.skin:disabled i { background: transparent; border: 1.5px dashed var(--chalk-dim); }
.skin:disabled i::before, .skin:disabled i::after { display: none; }

/* records + settings */
.records { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
.records th { font-weight: 500; font-size: 0.62rem; letter-spacing: 0.16em; color: var(--chalk-dim); text-align: right; padding: 6px; }
.records td { text-align: right; padding: 7px 6px; border-top: 1px solid var(--line); }
.records th:first-child, .records td:first-child { text-align: left; }
.records .empty { text-align: center; color: var(--chalk-dim); font-family: var(--font-body); }
.totals { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.totals div { display: flex; flex-direction: column; gap: 3px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
.totals span { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.14em; color: var(--chalk-dim); }
.totals b { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.settings { width: 100%; display: grid; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.9rem; }
.set span small { display: block; font-size: 0.72rem; color: var(--chalk-dim); }
.set input[type="range"] { width: 9rem; accent-color: var(--amber); }
.set input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--amber); }
.danger { color: var(--coral); border-color: var(--coral); }

/* result */
.result {
  display: grid; grid-template-columns: repeat(3, auto); gap: 6px 28px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.result span { font-size: 0.6rem; letter-spacing: 0.18em; color: var(--chalk-dim); }
.result b { font-size: 1.7rem; font-weight: 600; line-height: 1.1; }
.result .hi { color: var(--amber); }
.rank { font-size: 0.9rem; color: var(--chalk-dim); }
.rank b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--chalk); margin-left: 6px; }
.detail { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin: 0; font-family: var(--font-mono); font-size: 0.74rem; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.detail b { color: var(--chalk); font-weight: 600; }
.quip { color: var(--chalk-dim); font-size: 0.9rem; max-width: 24em; }
.badge { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.2em; color: var(--deep); background: var(--amber); padding: 3px 10px; border-radius: 3px; }
.unlocked { font-size: 0.8rem; color: var(--chalk-dim); }
.unlocked b { color: var(--amber); }
.sharebox { width: 100%; min-height: 4.5rem; resize: none; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--chalk); font-family: var(--font-mono); font-size: 0.78rem; -webkit-user-select: text; user-select: text; }

/* footer controls */
.controls { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
.hint { flex: 1 1 14rem; min-width: 0; margin: 0; font-size: 0.76rem; line-height: 1.5; color: var(--chalk-dim); }
.tools { display: flex; align-items: center; gap: 8px; }
.dash {
  --cd: 0;
  font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.1em;
  color: var(--deep);
  background: linear-gradient(to top, var(--veil) calc(var(--cd) * 100%), transparent 0), var(--coral);
  border: 0; border-radius: 999px; padding: 13px 26px; cursor: pointer;
  touch-action: manipulation;
}
@media (max-width: 480px) {
  .stats { gap: 11px; }
  .stat b { font-size: 1rem; }
  .totals { grid-template-columns: repeat(2, 1fr); }
  .hint { display: none; }
  .tools { width: 100%; }
  .dash { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .mode, .toast { transition: none; animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">エコーラン<small id="hudMode">TIME-LOOP ARCADE</small></div>
    <div class="stats">
      <div class="stat"><span>LOOP</span><b id="sLoop">-</b></div>
      <div class="stat chain" id="statChain"><span>CHAIN</span><b id="sChain">×1.0</b></div>
      <div class="stat score"><span>SCORE</span><b id="sScore">0</b></div>
      <div class="stat"><span>BEST</span><b id="sBest">0</b></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board"><canvas id="cv" aria-label="ゲーム画面"></canvas></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="overlay" id="ov"></div>
  </main>

  <footer class="controls">
    <p class="hint">移動 <kbd>WASD</kbd> <kbd>矢印</kbd> / ドラッグ / ゲームパッド。ダッシュ <kbd>Space</kbd>。一時停止 <kbd>P</kbd></p>
    <div class="tools">
      <button class="chip" id="muteBtn" type="button">音 ON</button>
      <button class="chip" id="pauseBtn" type="button">一時停止</button>
      <button class="dash" id="dashBtn" type="button">DASH</button>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  // ================= tuning =================
  // Arena is 1000 x 1000 units; the simulation runs at a fixed 60 steps per second.
  const W = 1000, R = 19;
  const HIT = R * 2 * 0.9;          // centre distance that counts as a collision
  const NEAR = R * 2 + 18;          // near-miss band: from touching distance up to this
  const SPEED = 6.2, DASH_MUL = 3.1, DASH_FRAMES = 9, DASH_CD = 84;
  const GRACE = 54, LIMIT = 8 * 60, REWIND = 34, DYING = 54;
  const FAST_CLEAR = 3 * 60;        // clear a loop within this to grow the chain
  const FREEZE_FRAMES = 150, STORM_SPEED = 1.5;
  const STEP = 1000 / 60;

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const stage = $('stage'), board = $('board'), ov = $('ov'), toastsEl = $('toasts');
  const el = { mode: $('hudMode'), loop: $('sLoop'), chain: $('sChain'), chainBox: $('statChain'), score: $('sScore'), best: $('sBest') };
  const dashBtn = $('dashBtn'), muteBtn = $('muteBtn'), pauseBtn = $('pauseBtn');

  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const C = { deep: tok('--deep'), cyan: tok('--cyan'), chalk: tok('--chalk'), dim: tok('--chalk-dim'), amber: tok('--amber'), coral: tok('--coral'), ice: tok('--ice') };
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const DISPLAY = '"Dela Gothic One", "Hiragino Sans", sans-serif';

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const fmt = n => n.toLocaleString('ja-JP');
  const pad2 = n => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ================= content =================
  const ACH = [
    { id: 'first',   name: 'はじめの一歩',   desc: 'はじめてコインを取る' },
    { id: 'loop5',   name: 'ループ入門',     desc: '1回のプレイで5ループ' },
    { id: 'loop10',  name: '残像使い',       desc: '1回のプレイで10ループ' },
    { id: 'loop20',  name: '因果の外側',     desc: '1回のプレイで20ループ' },
    { id: 'loop30',  name: 'エコーマスター', desc: '1回のプレイで30ループ' },
    { id: 'near10',  name: 'かすり職人',     desc: '1回のプレイでニアミス10回' },
    { id: 'phase5',  name: 'すり抜け名人',   desc: '1回のプレイでダッシュすり抜け5回' },
    { id: 'chain5',  name: '最短の美学',     desc: 'CHAIN 5 を達成' },
    { id: 'erase3',  name: '消しゴム愛好家', desc: '1回のプレイで残像を3体消す' },
    { id: 'freeze',  name: '時よ止まれ',     desc: '砂時計で残像を止める' },
    { id: 'storm',   name: '嵐を越えて',     desc: 'ECHO STORM のループをクリア' },
    { id: 'nodash',  name: 'ダッシュ封印',   desc: 'ダッシュを使わずに10ループ' },
    { id: 'score5k', name: '5000点',         desc: '1回のプレイで5,000点' },
    { id: 'daily',   name: '日課',           desc: 'デイリーチャレンジを遊ぶ' },
    { id: 'plays10', name: '常連',           desc: '通算10回プレイ' },
  ];
  const SKINS = [
    { id: 'amber',  name: 'アンバー',     color: '#ffb627', need: null,     hint: 'はじめから' },
    { id: 'mint',   name: 'ミント',       color: '#5fe3b8', need: 'loop10', hint: '10ループ到達' },
    { id: 'sakura', name: 'サクラ',       color: '#ff9ec7', need: 'near10', hint: 'ニアミス10回' },
    { id: 'violet', name: 'バイオレット', color: '#b79bff', need: 'chain5', hint: 'CHAIN 5' },
    { id: 'lime',   name: 'ライム',       color: '#c6f25e', need: 'loop20', hint: '20ループ到達' },
    { id: 'gold',   name: 'ゴールド',     color: '#ffd75e', need: 'loop30', hint: '30ループ到達', sparkle: true },
  ];
  const RANKS = [[0, '迷子'], [3, '見習いランナー'], [6, 'ループ慣れ'], [10, '残像使い'], [15, '時間の曲芸師'], [20, '因果の外側'], [30, 'エコーマスター']];
  const rankFor = loops => { let r = RANKS[0][1]; for (const [n, name] of RANKS) if (loops >= n) r = name; return r; };
  const TUTORIAL = {
    1: 'ダイヤ形のコインを取ろう',
    2: 'さっきの自分が「残像」に。触れたらアウト！',
    3: 'ダッシュ中は残像をすり抜けられる',
    4: '赤い消しゴムで、いちばん長い残像を消せる',
  };

  // ================= save data (per browser) =================
  const SAVE_KEY = 'echorun-save-v1';
  const defaults = () => ({
    best: { endless: 0 },
    daily: { date: '', best: 0, plays: 0 },
    stats: { plays: 0, loops: 0, coins: 0, nears: 0, phases: 0, ms: 0 },
    top: { endless: [], daily: [] },
    ach: {},

  function merge(a, b) {

  let save = loadSave();

  function ensureDaily() {

  }
  ensureDaily();
  const skinOf = id => SKINS.find(s => s.id === id) || SKINS[0];
  const skinUnlocked = s => !s.need || !!save.ach[s.need];

  // ================= seeded randomness (daily runs share coin positions) =================
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  }
  let seed = 'demo';
  const rngFor = (n, salt) => mulberry(hashStr(seed + '|' + n + '|' + salt));

  // ================= sizing =================
  let px = 0.3, dpr = 1;
  function resize() {
    const s = Math.max(220, Math.floor(Math.min(stage.clientWidth, stage.clientHeight) - 12));
    board.style.width = board.style.height = s + 'px';
    dpr = Math.min(window.devicePixelRatio || 1, 2);

  new ResizeObserver(resize).observe(stage);
  resize();
  // canvas text size in arena units, kept readable when the board is small
  const fs = base => Math.round(Math.max(base, base * 0.55 / px));

  const grain = document.createElement('canvas');
  grain.width = grain.height = 160;
  {
    const g = grain.getContext('2d'), im = g.createImageData(160, 160);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = Math.random() * 255;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
      im.data[i + 3] = Math.random() * 16;
    }
    g.putImageData(im, 0, 0);
  }
  const grainPat = ctx.createPattern(grain, 'repeat');

  // ================= audio: sound effects + generated music =================
  let ac = null, master = null, bgmBus = null, sfxBus = null, noiseBuf = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.connect(ac.destination);
    bgmBus = ac.createGain(); bgmBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.4), ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
  }
  function applyVolumes() {
    muteBtn.textContent = save.settings.muted ? '音 OFF' : '音 ON';
    if (!ac) return;
    master.gain.value = save.settings.muted ? 0 : 1;
    bgmBus.gain.value = save.settings.bgm * 0.5;
    sfxBus.gain.value = save.settings.sfx;
  }
  function tone(freq, dur, type, vol, slide, delay) {
    if (ac) voice(ac.currentTime + (delay || 0), freq, dur, type, vol, slide, sfxBus);
  }
  function voice(t, freq, dur, type, vol, slide, bus) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function hiss(t, dur, vol, hp, bus) {
    if (!ac) return;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  const sfx = {
    ui() { tone(880, 0.04, 'triangle', 0.04); },
    coin() { tone(988, 0.08, 'square', 0.05); tone(1480, 0.16, 'square', 0.05, 0, 0.07); },
    chain(n) { const base = 660 * Math.pow(1.06, Math.min(n, 10)); [0, 0.06, 0.12].forEach((d, i) => tone(base * [1, 1.26, 1.5][i], 0.1, 'triangle', 0.05, 0, d)); },
    near() { tone(1760, 0.05, 'triangle', 0.05); },
    phase() { tone(620, 0.12, 'triangle', 0.05, 1240); },
    dash() { tone(260, 0.16, 'sawtooth', 0.03, 820); },
    rewind() { tone(1100, 0.42, 'sawtooth', 0.022, 110); },
    erase() { tone(420, 0.3, 'triangle', 0.07, 1600); },
    freeze() { [0, 0.05, 0.1, 0.15].forEach((d, i) => tone(2093 - i * 180, 0.25, 'sine', 0.04, 0, d)); },
    storm() { tone(110, 0.7, 'sawtooth', 0.05, 55); },
    tick() { tone(660, 0.04, 'sine', 0.05); },
    ach() { [0, 0.08, 0.16].forEach((d, i) => tone([1046, 1318, 1568][i], 0.22, 'triangle', 0.05, 0, d)); },
    die() { tone(330, 0.6, 'square', 0.06, 45); tone(160, 0.5, 'sawtooth', 0.04, 40, 0.05); },
  };

  // Music: a 4-bar loop in A minor whose layers and tempo rise with the loop count.
  const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BGM = { on: false, step: 0, next: 0, timer: 0, level: 0, tempo: 112 };
  function bgmStart() {
    if (!ac || BGM.on) return;
    BGM.on = true; BGM.step = 0; BGM.next = ac.currentTime + 0.08;
    BGM.timer = setInterval(bgmTick, 25);
  }
  function bgmStop() { BGM.on = false; clearInterval(BGM.timer); }
  function bgmSet(level, tempo) { BGM.level = level; BGM.tempo = tempo; }
  function bgmTick() {
    if (!ac || !BGM.on) return;
    const spb = 60 / BGM.tempo / 4;
    while (BGM.next < ac.currentTime + 0.12) { bgmStep(BGM.step, BGM.next, spb); BGM.next += spb; BGM.step = (BGM.step + 1) % 64; }
  }
  function bgmStep(s, t, spb) {
    const bar = s >> 4, i = s & 15, ch = PROG[bar], L = BGM.level;
    if (L >= 1 && i % 4 === 0) voice(t, 150, 0.16, 'sine', 0.55, 42, bgmBus);
    if (L >= 2 && i % 4 === 2) hiss(t, 0.05, 0.12, 7000, bgmBus);
    if (L >= 3 && i % 2 === 1) hiss(t, 0.03, 0.05, 9000, bgmBus);
    if (L >= 4 && (i === 7 || i === 15)) hiss(t, 0.12, 0.12, 2500, bgmBus);
    if ([0, 3, 6, 8, 11, 14].includes(i)) voice(t, mtof(ch[0] - 24), spb * 1.7, 'triangle', L === 0 ? 0.16 : 0.22, 0, bgmBus);
    const arpOn = L === 0 ? i % 4 === 0 : L >= 3 || i % 2 === 0;
    if (arpOn) {
      const n = ch[(i >> (L >= 3 ? 0 : 1)) % 3] + 12 + (bar % 2 && L >= 3 ? 12 : 0);
      voice(t, mtof(n), spb * 0.9, 'square', L === 0 ? 0.03 : 0.035, 0, bgmBus);
    }
  }
  function duck() {
    if (!ac) return;
    const g = bgmBus.gain, v = save.settings.bgm * 0.5;
    g.cancelScheduledValues(ac.currentTime);
    g.setValueAtTime(v * 0.25, ac.currentTime);
    g.linearRampToValueAtTime(v, ac.currentTime + 0.6);
  }
  function playTempo() { return 120 + Math.min(loopN, 25) * 1.4 + (storm ? 14 : 0); }
  function playLevel() { return storm ? 4 : loopN < 3 ? 1 : loopN < 6 ? 2 : 3; }

  // first interaction anywhere unlocks audio and starts the menu music
  function wakeAudio() {
    initAudio();
    if (ac && !BGM.on && (state === 'title' || state === 'result')) { bgmSet(0, 104); bgmStart(); }
  }
  addEventListener('pointerdown', wakeAudio, { capture: true });
  addEventListener('keydown', wakeAudio, { capture: true });

  // ================= game state =================

  let rewindT = 0, rewindFrom = 0, dyingT = 0, revealT = 0, killer = null;
  let banner = null, hint = null, tutorial = false, run = null, unlockedThisRun = [];
  let particles = [], popups = [];
  let shake = 0, flash = 0, slow = 0, hitstop = 0, tick = 0, attractT = 0;
  const P = { x: W / 2, y: W / 2, vx: 0, vy: 0, dash: 0, cd: 0, dx: 0, dy: 1, trail: [] };

  function ghostAt(g, f) {
    const L = g.len;
    let i = 0;
    if (L > 1) { const per = 2 * (L - 1), m = f % per; i = m < L ? m : per - m; }
    return [g.path[i * 3], g.path[i * 3 + 1], g.path[i * 3 + 2]];
  }
  function makeGhost(data, n) {
    const path = Float32Array.from(data), len = path.length / 3;
    const lane = new Path2D();
    lane.moveTo(path[0], path[1]);
    for (let i = 2; i < len; i += 2) lane.lineTo(path[i * 3], path[i * 3 + 1]);
    lane.lineTo(path[(len - 1) * 3], path[(len - 1) * 3 + 1]);
    return { path, len, n, near: 0, phased: false, lane };
  }
  // the menu's background: a few lissajous "ghosts" drifting on their own lanes
  const demo = (() => {
    const out = [];
    for (let k = 0; k < 5; k++) {
      const pts = [], N = 520, a = 1 + (k % 3), b = 2 + ((k * 2) % 3), ph = k * 1.3;
      for (let i = 0; i < N; i++) {
        const t = i / N * Math.PI * 2;

      }

    }
    return out;
  })();

  function pickSpot(rng, from, minD, avoid) {
    let bp = null, bs = -1;
    for (let i = 0; i < 80; i++) {
      const p = { x: 90 + rng() * (W - 180), y: 90 + rng() * (W - 180) };
      const d = dist(p, from);
      let a = 999;
      for (const q of avoid) a = Math.min(a, dist(p, q));
      if (d >= minD && a >= 170) return p;
      const s = Math.min(d / minD, a / 170);
      if (s > bs) { bs = s; bp = p; }

  }

  function startRun(m) {
    initAudio();
    mode = m;

    ghosts = []; loopN = 1; score = 0; chain = 0; killer = null;
    particles = []; popups = []; unlockedThisRun = [];

  function beginLoop(s) {

    hourglass = (loopN >= 6 && loopN % 6 === 0 && ghosts.length >= 3) ? pickSpot(rngFor(loopN, 'freeze'), s, 200, eraser ? [coin, eraser] : [coin]) : null;

  function collect() {
    const clearF = frame;

    const mult = 1 + Math.min(chain, 8) * 0.25;
    const gain = Math.round((100 + Math.ceil(timeLeft / 60) * 10) * mult);
    score += gain;
    popup(coin.x, coin.y - 38, '+' + fmt(gain), C.amber, 1.35);
    if (chain > 0) { popup(coin.x, coin.y - 74, 'CHAIN ' + chain + ' ×' + mult.toFixed(2), C.chalk, 0.95); sfx.chain(chain); }

  function doErase() {
    let idx = 0;
    ghosts.forEach((g, i) => { if (g.len > ghosts[idx].len) idx = i; });
    const g = ghosts[idx], p = ghostAt(g, Math.floor(gtime));
    burst(p[0], p[1], 34, C.coral, 7);

    updateHud();

  function doFreeze() {

  function die(g) {

  function finishRun() {

    const list = save.top[mode];

  function stepPlay() {
    run.frames++;
    const inp = inputVec(), il = Math.hypot(inp.x, inp.y);
    if (il > 0.1) { P.dx = inp.x / il; P.dy = inp.y / il; }
    if (dashQueued && P.cd <= 0) {
      P.dash = DASH_FRAMES; P.cd = DASH_CD; run.dashes++;
      sfx.dash(); burst(P.x, P.y, 10, C.chalk, 3);
    }
    dashQueued = false;

    if (P.dash > 0) {
      P.vx = P.dx * SPEED * DASH_MUL; P.vy = P.dy * SPEED * DASH_MUL; P.dash--;
    } else {
      P.vx += (inp.x * SPEED - P.vx) * 0.38;
      P.vy += (inp.y * SPEED - P.vy) * 0.38;
    }
    P.x = clamp(P.x + P.vx, R, W - R);
    P.y = clamp(P.y + P.vy, R, W - R);

    rec.push(P.x, P.y, phasing ? 1 : 0);
    P.trail.push(P.x, P.y);
    if (P.trail.length > 30) P.trail.splice(0, 2);

            sfx.phase();
            checkRunAch();
          }
        } else {
          if (g.phased && d > R * 2.2) g.phased = false;
          if (!phasing && d >= R * 2 && d < NEAR && g.near <= 0) {
            g.near = 70; score += 25; slow = 8; run.nears++;
            popup(P.x, P.y - 34, 'ニアミス +25', C.chalk, 1);
            sfx.near();
            checkRunAch();
          }
        }
      }
    }

    frame++; graceLeft--; timeLeft--;
    if (freezeLeft > 0) freezeLeft--; else gtime += storm ? STORM_SPEED : 1;
    if (timeLeft > 0 && timeLeft <= 180 && timeLeft % 60 === 0) sfx.tick();
    if (timeLeft <= 0) { die(null); return; }

  function step() {

    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.t++; p.y -= 0.7; }
    popups = popups.filter(p => p.t < 64);
    if (banner && --banner.t <= 0) banner = null;
    if (hint && hint.t > 0) hint.t--;

    if (state === 'play') stepPlay();
    else if (state === 'rewind') { if (++rewindT >= REWIND) beginLoop(nextStart); }
    else if (state === 'dying') { if (++dyingT >= DYING) finishRun(); }
    else if (state === 'result') { gtime++; revealT++; }
    else attractT++;

  }

  // ================= fx helpers =================
  function burst(x, y, n, col, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.25 + Math.random());
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.018 + Math.random() * 0.03, col, size: 2 + Math.random() * 4.5 });
    }
  }
  function popup(x, y, text, col, size) { popups.push({ x, y, text, col, size: size || 1, t: 0 }); }
  function shakeBy(v) { if (save.settings.shake) shake = Math.max(shake, v); }
  function doFlash(v) { if (save.settings.flash) flash = Math.max(flash, v); }
  function toast(html) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = html;
    toastsEl.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
  }

  // ================= achievements =================
  function unlock(id) {
    if (save.ach[id]) return;

    save.ach[id] = Date.now();
    persist();
    unlockedThisRun.push(a.name);
    sfx.ach();
    toast(`<span class="tag">実績解除</span><span><b>${a.name}</b> · ${a.desc}</span>`);
    const sk = SKINS.find(s => s.need === id);
    if (sk) setTimeout(() => toast(`<span class="tag">スキン解放</span><span><b>${sk.name}</b> が使えるようになった</span>`), 500);
  }
  function checkRunAch() {
    if (!run) return;
    const loops = loopN - 1;
    if (loops >= 5) unlock('loop5');
    if (loops >= 10) unlock('loop10');
    if (loops >= 20) unlock('loop20');
    if (loops >= 30) unlock('loop30');
    if (run.nears >= 10) unlock('near10');
    if (run.phases >= 5) unlock('phase5');
    if (run.maxChain >= 5) unlock('chain5');
    if (run.erases >= 3) unlock('erase3');
    if (loops >= 10 && run.dashes === 0) unlock('nodash');
    if (score >= 5000) unlock('score5k');
  }

  // ================= input =================
  const keys = new Set();
  let dashQueued = false, joy = null, pad = { x: 0, y: 0, dash: false, start: false };
  const DASH_KEYS = [' ', 'shift', 'j', 'k', 'x'];
  const active = () => state === 'play' || state === 'rewind';

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const onButton = tag === 'BUTTON';
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k) && (active() || !onButton)) e.preventDefault();
    keys.add(k);
    if (e.repeat) return;
    if (active()) {
      if (DASH_KEYS.includes(k)) dashQueued = true;
      if (k === 'p' || k === 'escape') togglePause();
    } else if (state === 'paused') {
      if (k === 'p' || k === 'escape') togglePause();
    } else if (state === 'result') {
      if (!onButton && (k === ' ' || k === 'enter' || k === 'r')) startRun(mode);
      if (k === 'escape') toTitle();
    } else if (state === 'title' && k === 'escape' && screen !== 'title') {
      showScreen('title');
    }
  });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => { keys.clear(); joy = null; if (active()) togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && active()) togglePause(); });

  stage.addEventListener('pointerdown', e => {
    if (!active()) return;
    if (joy) { dashQueued = true; return; }          // a second finger dashes
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
  });
  stage.addEventListener('pointermove', e => {
    if (!joy || e.pointerId !== joy.id) return;
    joy.x = e.clientX; joy.y = e.clientY;
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), full = 46;
    if (d > full) { joy.ox = joy.x - dx / d * full; joy.oy = joy.y - dy / d * full; } // floating stick
  });
  const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
  stage.addEventListener('pointerup', endJoy);
  stage.addEventListener('pointercancel', endJoy);

  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; break; }
    if (!gp) { pad.x = pad.y = 0; return; }
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
    if (Math.hypot(x, y) < 0.2) x = y = 0;
    if (b(14)) x = -1; if (b(15)) x = 1; if (b(12)) y = -1; if (b(13)) y = 1;
    pad.x = x; pad.y = y;
    const dash = b(0) || b(1) || b(2) || b(5) || b(7);
    if (dash && !pad.dash) {
      if (active()) dashQueued = true;
      else if (state === 'result') startRun(mode);
      else if (state === 'title' && screen === 'title') startRun('endless');
    }
    pad.dash = dash;
    const start = b(9);
    if (start && !pad.start && (active() || state === 'paused')) togglePause();
    pad.start = start;
  }

  function inputVec() {
    let x = pad.x, y = pad.y;
    if (keys.has('arrowleft') || keys.has('a')) x -= 1;
    if (keys.has('arrowright') || keys.has('d')) x += 1;
    if (keys.has('arrowup') || keys.has('w')) y -= 1;
    if (keys.has('arrowdown') || keys.has('s')) y += 1;
    if (joy) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), dead = 6, full = 46;
      if (d > dead) { const m = Math.min(1, (d - dead) / (full - dead)); x += dx / d * m; y += dy / d * m; }
    }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  }

  // ================= drawing =================
  function drawArena() {
    const g = ctx.createRadialGradient(500, 430, 80, 500, 520, 780);
    g.addColorStop(0, C.cyan); g.addColorStop(1, C.deep);
    ctx.fillStyle = g;
    ctx.fillRect(-60, -60, W + 120, W + 120);

      ctx.fillStyle = `rgba(255,111,89,${0.05 + Math.sin(tick / 9) * 0.03})`;
      ctx.fillRect(0, 0, W, W);
    }
    if (freezeLeft > 0) { ctx.fillStyle = 'rgba(143,227,255,0.07)'; ctx.fillRect(0, 0, W, W); }
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, W);

    ctx.lineWidth = 1 / px;
    for (let i = 50; i < W; i += 50) {
      ctx.strokeStyle = i % 250 === 0 ? 'rgba(234,241,248,0.13)' : 'rgba(234,241,248,0.05)';
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, W); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(234,241,248,0.35)';
    ctx.strokeRect(0, 0, W, W);
    ctx.fillStyle = 'rgba(234,241,248,0.28)';
    ctx.font = `500 ${11 / px}px ${MONO}`;
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    for (let i = 250; i < W; i += 250) ctx.fillText(String(i), i + 4 / px, 4 / px);
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    const tag = state === 'title' ? 'ARENA 1000×1000 · 60 STEPS/s' : (mode === 'daily' ? 'DAILY ' + today() : 'ENDLESS') + ' · SEED ' + (hashStr(seed) % 100000);
    ctx.fillText(tag, W - 6 / px, W - 5 / px);
  }

  function drawEyes(x, y, dx, dy, col, r) {
    const l = Math.hypot(dx, dy);
    let ex = 0, ey = 0.35;
    if (l > 0.01) { ex = dx / l; ey = dy / l; }
    const off = r * 0.36, sp = r * 0.34, er = r * 0.17;
    ctx.fillStyle = col;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(x + ex * off - ey * sp * s, y + ey * off + ex * sp * s, er, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGhost(g, gi, opts) {
    const p = ghostAt(g, gi), q = ghostAt(g, gi + 3);
    const isKiller = killer === g && (state === 'dying' || state === 'result');
    const frozen = opts.live && freezeLeft > 0;
    const age = loopN - g.n;
    ctx.globalAlpha = (opts.intangible ? 0.4 : 0.95 - Math.min(age, 10) * 0.035) * (opts.alpha || 1);
    if (p[2]) {
      ctx.strokeStyle = 'rgba(234,241,248,0.35)'; ctx.lineWidth = R * 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] - (q[0] - p[0]) * 1.5, p[1] - (q[1] - p[1]) * 1.5); ctx.stroke();
    }
    const stroke = isKiller ? C.coral : frozen ? C.ice : storm && opts.live ? '#ffd2c9' : C.chalk;
    ctx.fillStyle = isKiller ? C.coral : frozen ? 'rgba(143,227,255,0.3)' : 'rgba(234,241,248,0.2)';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2.6;
    if (opts.intangible) ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    drawEyes(p[0], p[1], q[0] - p[0], q[1] - p[1], isKiller ? C.deep : stroke, R);
    if (save.settings.hitbox && opts.live) {
      ctx.strokeStyle = C.coral; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], HIT / 2, 0, Math.PI * 2); ctx.stroke();
    }
    if (opts.label !== false) {
      ctx.fillStyle = isKiller ? C.coral : C.dim;
      ctx.font = `600 ${fs(20)}px ${MONO}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('#' + g.n, p[0], p[1] - R - 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPreview(g, gi) {
    const sp = storm ? STORM_SPEED : 1;
    ctx.fillStyle = C.chalk;
    for (let k = 1; k <= 12; k++) {
      const p = ghostAt(g, Math.floor(gi + k * 3 * sp));
      ctx.globalAlpha = 0.4 * (1 - k / 13);
      ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPickupLabel(x, y, text, col) {
    ctx.fillStyle = col; ctx.font = `600 ${fs(18)}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(text, x, y + 24);
  }

  function draw() {
    const s = px * dpr;
    let sx = 0, sy = 0;
    if (shake > 0.4) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    ctx.setTransform(s, 0, 0, s, sx * s, sy * s);
    drawArena();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (state === 'title') {
      for (const g of demo) { ctx.strokeStyle = 'rgba(234,241,248,0.08)'; ctx.lineWidth = 1.2 / px; ctx.stroke(g.lane); }
      for (const g of demo) drawGhost(g, attractT, { alpha: 0.5, label: false });
      drawFx();
      return;
    }

    const live = state === 'play' || (state === 'paused' && pausedFrom === 'play');
    const rewinding = state === 'rewind' || (state === 'paused' && pausedFrom === 'rewind');
    let gi = Math.floor(gtime);
    if (rewinding) {
      const p = Math.min(1, rewindT / REWIND), e = p * p * (3 - 2 * p);
      gi = Math.round(rewindFrom * (1 - e));
    }

    // lanes: each ghost's full route, so the danger zones can be read at a glance
    if (state === 'result') {
      ghosts.forEach((g, i) => {
        const a = clamp((revealT - i * 5) / 30, 0, 1);
        if (a <= 0) return;
        const t = ghosts.length > 1 ? i / (ghosts.length - 1) : 1;
        ctx.globalAlpha = a;
        ctx.strokeStyle = t > 0.66 ? skinOf(save.skin).color : t > 0.33 ? C.chalk : C.dim;
        ctx.lineWidth = 3; ctx.stroke(g.lane);
        ctx.globalAlpha = 1;
      });
    } else {
      for (const g of ghosts) {
        ctx.strokeStyle = 'rgba(234,241,248,0.045)'; ctx.lineWidth = R * 2; ctx.stroke(g.lane);
        ctx.strokeStyle = 'rgba(234,241,248,0.14)'; ctx.lineWidth = 1.2 / px; ctx.stroke(g.lane);
      }
    }

    // coin with its countdown ring; the tick marks the 3-second chain window
    if (coin && (live || state === 'paused' || state === 'dying')) {
      const t = tick / 60, pulse = 1 + Math.sin(t * 6) * 0.08;
      const frac = clamp(timeLeft / LIMIT, 0, 1);
      const urgent = frac < 3 / 8 && live;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(234,241,248,0.15)';
      ctx.beginPath(); ctx.arc(coin.x, coin.y, 36, 0, Math.PI * 2); ctx.stroke();
      if (!(urgent && Math.floor(tick / 8) % 2)) {
        ctx.strokeStyle = urgent ? C.coral : C.amber;
        ctx.beginPath(); ctx.arc(coin.x, coin.y, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
      }
      const ca = -Math.PI / 2 + Math.PI * 2 * (1 - FAST_CLEAR / LIMIT);
      ctx.strokeStyle = frame <= FAST_CLEAR ? C.chalk : 'rgba(234,241,248,0.25)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(coin.x + Math.cos(ca) * 30, coin.y + Math.sin(ca) * 30); ctx.lineTo(coin.x + Math.cos(ca) * 43, coin.y + Math.sin(ca) * 43); ctx.stroke();
      ctx.save();
      ctx.translate(coin.x, coin.y); ctx.rotate(t * 1.6); ctx.scale(pulse, pulse);
      ctx.fillStyle = C.amber;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(14, 0); ctx.lineTo(0, 18); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(5, -4); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    if (eraser && (live || state === 'paused')) {
      const b = 1 + Math.sin(tick / 7) * 0.1;
      ctx.save(); ctx.translate(eraser.x, eraser.y); ctx.scale(b, b);
      ctx.fillStyle = C.coral;
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.deep; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.moveTo(6, -6); ctx.lineTo(-6, 6); ctx.stroke();
      ctx.restore();
      drawPickupLabel(eraser.x, eraser.y, 'ERASE', C.coral);
    }
    if (hourglass && (live || state === 'paused')) {
      ctx.save(); ctx.translate(hourglass.x, hourglass.y); ctx.rotate(Math.sin(tick / 20) * 0.25);
      ctx.fillStyle = C.ice;
      ctx.beginPath(); ctx.moveTo(-13, -18); ctx.lineTo(13, -18); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-13, 18); ctx.lineTo(13, 18); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
      drawPickupLabel(hourglass.x, hourglass.y, 'FREEZE', C.ice);
    }

    // ghosts
    if (live && save.settings.preview && freezeLeft <= 0) for (const g of ghosts) drawPreview(g, gi);
    for (const g of ghosts) drawGhost(g, gi, { live, intangible: live && graceLeft > 0 });

    // player
    const skin = skinOf(save.skin);
    if (state !== 'dying' && state !== 'result') {
      const at = rewinding ? nextStart : P;
      if (!rewinding) {
        for (let i = 0; i < P.trail.length; i += 2) {
          const a = i / P.trail.length;
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = skin.color;
          ctx.beginPath(); ctx.arc(P.trail[i], P.trail[i + 1], R * (0.35 + a * 0.5), 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (graceLeft > 0 && live) {
        ctx.strokeStyle = skin.color; ctx.lineWidth = 2; ctx.globalAlpha = graceLeft / GRACE;
        ctx.beginPath(); ctx.arc(P.x, P.y, R + 10 + (GRACE - graceLeft) * 0.6, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = skin.color;
      ctx.beginPath(); ctx.arc(at.x, at.y, R, 0, Math.PI * 2); ctx.fill();
      if (P.dash > 0) {
        ctx.strokeStyle = C.chalk; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(at.x, at.y, R + 3, 0, Math.PI * 2); ctx.stroke();
      }
      drawEyes(at.x, at.y, P.vx, P.vy, C.deep, R);
      if (save.settings.hitbox && live) {
        ctx.strokeStyle = C.deep; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(P.x, P.y, HIT / 2, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (state === 'dying') {
      const k = dyingT / DYING;
      ctx.strokeStyle = C.coral; ctx.lineWidth = 4; ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + k * 140, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // freeze timer
    if (freezeLeft > 0 && live) {
      ctx.fillStyle = C.ice; ctx.font = `600 ${fs(22)}px ${MONO}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText('FREEZE ' + (freezeLeft / 60).toFixed(1) + 's', W - 24, 26);
    }

    drawFx();

    // rewind overlay: tape-style scanlines
    if (rewinding) {
      ctx.fillStyle = 'rgba(234,241,248,0.05)';
      const off = (tick * 9) % 24;
      for (let y = -24 + off; y < W; y += 24) ctx.fillRect(0, y, W, 6);
      ctx.fillStyle = C.chalk; ctx.font = `400 ${fs(34)}px ${DISPLAY}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('◀◀ 巻き戻し', 34, 30);
    }

    // banner
    if (banner && (live || rewinding)) {
      const a = Math.min(1, banner.t / 18);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `400 ${banner.storm ? 58 : 64}px ${DISPLAY}`;
      ctx.lineWidth = 10; ctx.strokeStyle = C.deep; ctx.strokeText(banner.text, W / 2, 140);
      ctx.fillStyle = banner.storm ? C.coral : C.chalk; ctx.fillText(banner.text, W / 2, 140);
      ctx.font = `600 ${fs(24)}px ${MONO}`;
      ctx.lineWidth = 6; ctx.strokeText(banner.sub, W / 2, 200);
      ctx.fillStyle = C.amber; ctx.fillText(banner.sub, W / 2, 200);
      ctx.globalAlpha = 1;
    }
    // tutorial hint
    if (hint && hint.t > 0 && live) {
      ctx.globalAlpha = Math.min(1, hint.t / 30);
      ctx.font = `700 ${fs(26)}px ${DISPLAY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(hint.text).width + 40;
      ctx.fillStyle = C.chalk;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W / 2 - w / 2, W - 112, w, fs(26) + 26, 12) : ctx.rect(W / 2 - w / 2, W - 112, w, fs(26) + 26); ctx.fill();
      ctx.fillStyle = C.deep; ctx.fillText(hint.text, W / 2, W - 112 + (fs(26) + 26) / 2);
      ctx.globalAlpha = 1;
    }

    if (flash > 0) { ctx.fillStyle = `rgba(255,248,230,${flash * 0.35})`; ctx.fillRect(-60, -60, W + 120, W + 120); }

    // floating joystick
    if (joy) {
      const r = board.getBoundingClientRect();
      const ox = (joy.ox - r.left) / px, oy = (joy.oy - r.top) / px;
      const kx = (joy.x - r.left) / px, ky = (joy.y - r.top) / px;
      ctx.strokeStyle = 'rgba(234,241,248,0.35)'; ctx.lineWidth = 2 / px;
      ctx.beginPath(); ctx.arc(ox, oy, 46 / px, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(234,241,248,0.3)';
      ctx.beginPath(); ctx.arc(kx, ky, 18 / px, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFx() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, (64 - p.t) / 20);
      ctx.font = `600 ${Math.round(fs(22) * p.size)}px ${MONO}`;
      ctx.lineWidth = 5; ctx.strokeStyle = C.deep; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  // ================= main loop =================
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(100, now - last); last = now;
    acc += dt * (slow > 0 ? 0.45 : 1);
    let n = 0;
    while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; if (slow > 0) slow--; }
    if (n === 6) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  applyVolumes();
  updateHud();
  showScreen('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
