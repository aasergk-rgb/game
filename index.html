<style>
/* Layout: a drafting-table cabinet. HUD strip on top, the square cyanotype arena in the middle,
   and below it either a key legend (desktop) or a thumb deck with stick + dash (touch).
   Menus are drawing sheets with crop marks laid over the running arena. */
:root {
  --deep: #0d2546;
  --cyan: #17407a;
  --panel: rgba(19, 50, 94, 0.72);
  --panel-solid: #12305a;
  --chalk: #eaf1f8;
  --chalk-dim: #9fb6d3;
  --line: rgba(234, 241, 248, 0.2);
  --line-strong: rgba(234, 241, 248, 0.45);
  --veil: rgba(10, 30, 58, 0.72);
  --amber: #ffb627;
  --coral: #ff6f59;
  --ice: #8fe3ff;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--deep); color: var(--chalk);
  font-family: var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }

.app {
  position: relative;
  height: 100%; max-width: 860px; margin: 0 auto;
  padding-inline: 16px; padding-block: 10px 12px;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) 120px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "hud hud" "stage stage" "legend legend";
}

/* ---------- HUD ---------- */
.hud { grid-area: hud; display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand .mark { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; line-height: 1; letter-spacing: 0.04em; white-space: nowrap; }
.brand small { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.2em; color: var(--chalk-dim); white-space: nowrap; }
.meters { display: flex; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.meter { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; padding: 6px 11px; min-width: 4.4rem; }
.meter + .meter { border-left: 1px solid var(--line); }
.meter span { font-family: var(--font-mono); font-size: 0.52rem; letter-spacing: 0.18em; color: var(--chalk-dim); }
.meter b { font-family: var(--font-mono); font-size: 1.08rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.meter.score b { color: var(--amber); }
.iconbtn {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}
.iconbtn:hover { border-color: var(--line-strong); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn.dim { opacity: 0.4; }

/* ---------- stage ---------- */
.stage { grid-area: stage; position: relative; min-height: 0; display: grid; place-items: center; touch-action: none; }
.board { position: relative; width: 300px; height: 300px; }
.board canvas { display: block; width: 100%; height: 100%; border-radius: 3px; outline: 1px solid var(--line); outline-offset: 5px; }
body.mousectl .board canvas { cursor: crosshair; }
.toasts {
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 4;
  display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  width: min(92%, 22rem);
}
.toast {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 8px 14px 8px 8px; border-radius: 10px;
  background: var(--chalk); color: var(--deep);
  font-size: 0.82rem; line-height: 1.35;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
  animation: toast-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  transition: opacity 0.4s, transform 0.4s;
}
.toast .tag {
  flex: none; padding: 4px 7px; border: 1.5px solid var(--coral); border-radius: 5px; transform: rotate(-4deg);
  font-family: var(--font-mono); font-size: 0.58rem; font-weight: 600; letter-spacing: 0.1em; color: var(--coral);
}
.toast b { font-weight: 700; }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-12px) scale(0.97); } }

/* ---------- legend (keyboard / mouse) ---------- */
.legend { grid-area: legend; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 0.74rem; color: var(--chalk-dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
kbd {
  display: inline-block; min-width: 1.6em; text-align: center;
  font-family: var(--font-mono); font-size: 0.68rem; color: var(--chalk);
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px;
}

/* ---------- touch deck ---------- */
.padzone {
  grid-area: pad; display: none; position: relative; height: 148px; min-width: 0;
  border: 1px dashed var(--line); border-radius: 18px; touch-action: none;
  background: radial-gradient(ellipse at center, rgba(234, 241, 248, 0.04), transparent 70%);
}
.pad-base {
  position: absolute; left: 50%; top: 50%; width: 108px; height: 108px; margin: -54px 0 0 -54px;
  border-radius: 50%; border: 1.5px solid var(--line-strong);
  background: radial-gradient(circle, rgba(234, 241, 248, 0.1), rgba(234, 241, 248, 0.02) 70%);
  pointer-events: none;
}
.pad-base::before, .pad-base::after { content: ""; position: absolute; background: var(--line); }
.pad-base::before { left: 50%; top: 10px; bottom: 10px; width: 1px; }
.pad-base::after { top: 50%; left: 10px; right: 10px; height: 1px; }
.pad-knob {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; z-index: 1;
  border-radius: 50%; background: var(--chalk); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
.padzone.held .pad-base { border-color: var(--chalk); }
.pad-label { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.16em; color: var(--chalk-dim); pointer-events: none; }
.dashzone { grid-area: dash; display: none; place-items: center; }
.dash {
  --ready: 1;
  width: 104px; height: 104px; padding: 6px; border: 0; border-radius: 50%; cursor: pointer; touch-action: none;
  background: conic-gradient(var(--coral) calc(var(--ready) * 1turn), rgba(255, 111, 89, 0.16) 0);
}
.dash span {
  width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.08em;
  background: var(--coral); color: var(--deep);
  transition: background-color 0.12s, transform 0.08s;
}
.dash.cool span { background: var(--deep); color: var(--coral); }
.dash.hit span { transform: scale(0.92); }

body.touch .legend { display: none; }
body.touch .padzone { display: block; }
body.touch .dashzone { display: grid; }
body.touch .app { grid-template-areas: "hud hud" "stage stage" "pad dash"; }
body.touch.lefty .app { grid-template-columns: 120px minmax(0, 1fr); grid-template-areas: "hud hud" "stage stage" "dash pad"; }
@media (orientation: portrait) {
  body.touch .app { grid-template-rows: auto auto minmax(0, 1fr); }
  body.touch .stage { aspect-ratio: 1 / 1; max-height: 64vh; }
  body.touch .padzone { height: auto; min-height: 120px; align-self: stretch; }
  body.touch .dashzone { align-self: center; }
}
@media (orientation: landscape) and (max-height: 560px) {
  body.touch .app {
    max-width: none;
    grid-template-columns: minmax(150px, 1fr) minmax(0, 2.2fr) minmax(120px, 0.8fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "hud hud hud" "pad stage dash";
  }
  body.touch.lefty .app { grid-template-columns: minmax(120px, 0.8fr) minmax(0, 2.2fr) minmax(150px, 1fr); grid-template-areas: "hud hud hud" "dash stage pad"; }
  body.touch .padzone { height: auto; align-self: stretch; }
}

/* ---------- overlay sheets ---------- */
.overlay {
  grid-column: 1 / -1; grid-row: 2 / -1; position: relative; z-index: 2; min-height: 0; overflow-y: auto;
  display: flex; padding: 12px; border-radius: 6px;
  background: var(--veil);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
.overlay.peek { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; pointer-events: none; }
.overlay.peek .sheet { display: none; }
.overlay .peek-back { display: none; }
.overlay.peek .peek-back { display: block; pointer-events: auto; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); }
.sheet {
  --mark: var(--chalk);
  margin: auto; width: 100%; max-width: 36rem; position: relative;
  padding: 26px 22px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
  background:
    linear-gradient(var(--mark), var(--mark)) left top / 16px 2px no-repeat,
    linear-gradient(var(--mark), var(--mark)) left top / 2px 16px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right top / 16px 2px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right top / 2px 16px no-repeat,
    linear-gradient(var(--mark), var(--mark)) left bottom / 16px 2px no-repeat,
    linear-gradient(var(--mark), var(--mark)) left bottom / 2px 16px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right bottom / 16px 2px no-repeat,
    linear-gradient(var(--mark), var(--mark)) right bottom / 2px 16px no-repeat,
    var(--panel);
  outline: 1px solid var(--line); outline-offset: -7px;
  animation: sheet-in 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes sheet-in { from { opacity: 0; transform: translateY(10px); } }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.26em; color: var(--chalk-dim); }
.sheet h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(2.8rem, 12vw, 4.8rem); line-height: 1; letter-spacing: 0.02em;
  text-shadow: -0.07em 0 0 rgba(234, 241, 248, 0.2), -0.14em 0 0 rgba(234, 241, 248, 0.08);
}
.sheet h1 em { font-style: normal; color: var(--amber); text-shadow: -0.07em 0 0 rgba(255, 182, 39, 0.28), -0.14em 0 0 rgba(255, 182, 39, 0.1); }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.3rem, 5vw, 1.85rem); line-height: 1.25; text-wrap: balance; }
.sheet h3 {
  margin: 4px 0 -4px; width: 100%; display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-weight: 600; font-size: 0.66rem; letter-spacing: 0.22em; color: var(--chalk-dim);
}
.sheet h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sheet p { margin: 0; line-height: 1.75; font-size: 0.94rem; }
.lede { max-width: 25em; color: var(--chalk-dim); }
.lede b { color: var(--chalk); font-weight: 700; }

.screen-head { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; }
.screen-head h2 { font-size: clamp(1.25rem, 5vw, 1.6rem); }

/* title */
.modes { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card {
  display: grid; justify-items: start; align-content: start; gap: 6px; text-align: left;
  padding: 16px 16px 14px; border-radius: 14px; cursor: pointer;
  border: 1.5px solid var(--amber); background: transparent;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.mode-card.primary { background: var(--amber); color: var(--deep); }
.mode-card svg { width: 42px; height: 42px; margin-bottom: 4px; }
.mc-name { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; letter-spacing: 0.04em; }
.mc-desc { font-size: 0.78rem; line-height: 1.5; opacity: 0.82; }
.mc-stat {
  width: 100%; margin-top: 6px; padding-top: 8px; border-top: 1px solid currentColor;
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.mc-stat small { font-size: 0.6rem; letter-spacing: 0.16em; opacity: 0.75; }
.mc-stat b { font-size: 1rem; font-weight: 600; }
.mode-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0, 0, 0, 0.28); }
.mode-card:active { transform: scale(0.98); }
.navrow { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.navbtn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 11px 4px 10px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer;
  font-size: 0.76rem; line-height: 1.2;
  transition: border-color 0.15s, background-color 0.15s;
}
.navbtn:hover { border-color: var(--line-strong); background: rgba(234, 241, 248, 0.04); }
.navbtn svg { width: 22px; height: 22px; color: var(--chalk-dim); }
.navbtn .count { font-family: var(--font-mono); font-size: 0.6rem; color: var(--amber); }
.titleblock { width: 100%; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.titleblock div { background: var(--panel-solid); padding: 6px 9px; text-align: left; min-width: 0; }
.titleblock dt { font-family: var(--font-mono); font-size: 0.52rem; letter-spacing: 0.16em; color: var(--chalk-dim); }
.titleblock dd { margin: 2px 0 0; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.08em;
  color: var(--deep); background: var(--amber);
  border: 0; border-radius: 999px; padding: 13px 34px; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
  transition: transform 0.12s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25); }
.btn svg { width: 20px; height: 20px; }
.btn kbd { color: var(--deep); border-color: rgba(13, 37, 70, 0.4); font-size: 0.62rem; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em;
  background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer;
}
.chip:hover { border-color: var(--line-strong); }
.chip svg { width: 15px; height: 15px; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.small { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.1em; color: var(--chalk-dim); }

/* how to play */
.rules { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 12px; text-align: left; }
.rules li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; font-size: 0.86rem; line-height: 1.6; color: var(--chalk-dim); }
.rules b { color: var(--chalk); }
.rules svg { width: 36px; height: 36px; }
.keys { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
.keys th, .keys td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.8; }
.keys th { font-weight: 700; white-space: nowrap; }
.keys td { color: var(--chalk-dim); }

/* collection */
.ach-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 8px; }
.ach { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; text-align: left; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.ach .medal { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: var(--deep); font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; }
.ach.locked .medal { background: transparent; border: 1.5px dashed var(--chalk-dim); color: var(--chalk-dim); }
.ach b { display: block; font-size: 0.86rem; }
.ach span { display: block; font-size: 0.74rem; color: var(--chalk-dim); line-height: 1.45; }
.ach.locked b { color: var(--chalk-dim); }
.skins { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(5.4rem, 1fr)); gap: 8px; }
.skin {
  --sw: var(--amber);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 4px 10px; border-radius: 10px; cursor: pointer;
  background: transparent; border: 1px solid var(--line);
  font-size: 0.74rem; line-height: 1.35;
}
.skin i { width: 32px; height: 32px; border-radius: 50%; background: var(--sw); position: relative; }
.skin i::before, .skin i::after { content: ""; position: absolute; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--deep); }
.skin i::before { left: 9px; } .skin i::after { right: 9px; }
.skin small { color: var(--chalk-dim); font-size: 0.62rem; }
.skin[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.skin[aria-pressed="true"] small { color: var(--amber); }
.skin:disabled { cursor: not-allowed; }
.skin:disabled i { background: transparent; border: 1.5px dashed var(--chalk-dim); }
.skin:disabled i::before, .skin:disabled i::after { display: none; }

/* records */
.records { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
.records th { font-weight: 500; font-size: 0.58rem; letter-spacing: 0.16em; color: var(--chalk-dim); text-align: right; padding: 6px; }
.records td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); }
.records th:first-child, .records td:first-child { text-align: left; }
.records tr:nth-child(2) td { color: var(--amber); }
.records .empty { text-align: center !important; color: var(--chalk-dim) !important; font-family: var(--font-body); }
.cells { width: 100%; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cells div { background: var(--panel-solid); padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.cells dt { font-family: var(--font-mono); font-size: 0.54rem; letter-spacing: 0.14em; color: var(--chalk-dim); }
.cells dd { margin: 0; font-family: var(--font-mono); font-size: 1.02rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* settings */
.settings { width: 100%; display: grid; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.9rem; }
.set > span { min-width: 0; }
.set span small { display: block; font-size: 0.72rem; color: var(--chalk-dim); line-height: 1.5; }
.set input[type="range"] { width: 8.5rem; flex: none; accent-color: var(--amber); }
.set input[type="checkbox"] { width: 22px; height: 22px; flex: none; accent-color: var(--amber); }
.seg { display: inline-flex; flex: none; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 10px; font-size: 0.76rem; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--deep); font-weight: 700; }
.danger { color: var(--coral); border-color: var(--coral); }

/* result */
.score-big { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.score-big span { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.24em; color: var(--chalk-dim); }

@media (max-width: 520px) {
  .modes { grid-template-columns: 1fr; }

  .mc-stat { margin-top: 4px; padding-top: 6px; }

}

  .sheet, .toast { animation: none; }
  .btn, .mode-card, .toast, .dash span { transition: none; }
}

<body>
<div class="app">
  <header class="hud">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#17407a"/><circle cx="24" cy="34" r="14" fill="none" stroke="#eaf1f8" stroke-width="3" stroke-dasharray="5 4"/><circle cx="38" cy="30" r="15" fill="#ffb627"/><circle cx="34" cy="28" r="2.6" fill="#0d2546"/><circle cx="43" cy="28" r="2.6" fill="#0d2546"/></svg>
      <div><b>エコーラン</b><small id="hudMode">TIME-LOOP ARCADE</small></div>

  </header>

  <main class="stage" id="stage">

  </main>
  <div class="overlay" id="ov"></div>

  <div class="dashzone"><button class="dash" id="dashBtn" type="button" aria-label="ダッシュ"><span>DASH</span></button></div>
</div>

<script>
(() => {
  'use strict';

  // ================= tuning =================
  // Arena is 1000 x 1000 units; the simulation runs at a fixed 60 steps per second.
  const W = 1000, R = 19;
  const HIT = R * 2 * 0.9;          // centre distance that counts as a collision
  const NEAR = R * 2 + 18;          // near-miss band: from touching distance up to this
  const SPEED = 6.2, DASH_MUL = 3.1, DASH_FRAMES = 9, DASH_CD = 84, DASH_BUFFER = 10;
  const GRACE = 54, LIMIT = 8 * 60, REWIND = 34, DYING = 54, RETRY_HOLD = 36;
  const FAST_CLEAR = 3 * 60;        // clear a loop within this to grow the chain
  const FREEZE_FRAMES = 150, STORM_SPEED = 1.5;
  const STEP = 1000 / 60;

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const stage = $('stage'), board = $('board'), ov = $('ov'), toastsEl = $('toasts');
  const el = { mode: $('hudMode'), loop: $('sLoop'), score: $('sScore'), best: $('sBest') };
  const dashBtn = $('dashBtn'), muteBtn = $('muteBtn'), pauseBtn = $('pauseBtn');
  const padzone = $('padzone'), padBase = $('padBase'), padKnob = $('padKnob'), legend = $('legend');

  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const C = { deep: tok('--deep'), cyan: tok('--cyan'), chalk: tok('--chalk'), dim: tok('--chalk-dim'), amber: tok('--amber'), coral: tok('--coral'), ice: tok('--ice') };
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const DISPLAY = '"Dela Gothic One", "Hiragino Sans", sans-serif';

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const fmt = n => n.toLocaleString('ja-JP');
  const pad2 = n => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
  const shortDate = () => today().slice(5).replace('-', '/');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ================= icons =================
  const svg = (inner, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="${fill ? 'none' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const I = {
    sound: svg('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'),
    muted: svg('<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>'),
    pause: svg('<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>', true),
    play: svg('<path d="M7 5l12 7-12 7z"/>', true),
    back: svg('<path d="M15 5l-7 7 7 7"/>'),
    help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17.2v.1"/>'),
    medal: svg('<circle cx="12" cy="14.5" r="5.5"/><path d="M8.5 3.5h7l-2 5.5h-3z"/><path d="M12 12.5v4"/>'),
    chart: svg('<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>'),
    sliders: svg('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'),
    copy: svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
    eye: svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
    home: svg('<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>'),
    retry: svg('<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/>'),
    endless: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M24 24c-4-6-8-9-12-9a9 9 0 0 0 0 18c4 0 8-3 12-9s8-9 12-9a9 9 0 0 1 0 18c-4 0-8-3-12-9z"/></svg>',
    daily: d => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="7" y="10" width="34" height="31" rx="4"/><path d="M7 19h34M16 6v8M32 6v8"/><text x="24" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" stroke="none" font-family="monospace">${d}</text></svg>`,
  };
  const RULE_ICON = {
    coin: '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#ffb627" stroke-width="2.5"/><path d="M17 7l7 10-7 10-7-10z" fill="#ffb627"/></svg>',
    ghost: '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="12" fill="rgba(234,241,248,.2)" stroke="#eaf1f8" stroke-width="2.5"/><circle cx="13" cy="15" r="2" fill="#eaf1f8"/><circle cx="21" cy="15" r="2" fill="#eaf1f8"/></svg>',
    dash: '<svg viewBox="0 0 34 34"><circle cx="22" cy="17" r="9" fill="#ffb627"/><path d="M3 12h9M1 17h9M3 22h9" stroke="#eaf1f8" stroke-width="2.5" stroke-linecap="round"/></svg>',
    near: '<svg viewBox="0 0 34 34"><circle cx="11" cy="17" r="8" fill="#ffb627"/><circle cx="25" cy="17" r="8" fill="none" stroke="#eaf1f8" stroke-width="2.5" stroke-dasharray="3 3"/></svg>',
    chain: '<svg viewBox="0 0 34 34"><text x="17" y="22" text-anchor="middle" font-family="monospace" font-weight="700" font-size="13" fill="#ffb627">×2</text><circle cx="17" cy="17" r="15" fill="none" stroke="#ffb627" stroke-width="2" stroke-dasharray="70 30"/></svg>',
    eraser: '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="13" fill="#ff6f59"/><path d="M12 12l10 10M22 12L12 22" stroke="#0d2546" stroke-width="3" stroke-linecap="round"/></svg>',
    freeze: '<svg viewBox="0 0 34 34"><path d="M9 5h16L17 17zM9 29h16L17 17z" fill="#8fe3ff"/></svg>',
    storm: '<svg viewBox="0 0 34 34"><path d="M19 3L8 19h8l-3 12 13-17h-8z" fill="#ff6f59"/></svg>',
  };

  // ================= content =================
  const ACH = [
    { id: 'first',   name: 'はじめの一歩',   desc: 'はじめてコインを取る' },
    { id: 'loop5',   name: 'ループ入門',     desc: '1回のプレイで5ループ' },
    { id: 'loop10',  name: '残像使い',       desc: '1回のプレイで10ループ' },
    { id: 'loop20',  name: '因果の外側',     desc: '1回のプレイで20ループ' },
    { id: 'loop30',  name: 'エコーマスター', desc: '1回のプレイで30ループ' },
    { id: 'near10',  name: 'かすり職人',     desc: '1回のプレイでニアミス10回' },
    { id: 'phase5',  name: 'すり抜け名人',   desc: '1回のプレイでダッシュすり抜け5回' },
    { id: 'chain5',  name: '最短の美学',     desc: 'CHAIN 5 を達成' },
    { id: 'erase3',  name: '消しゴム愛好家', desc: '1回のプレイで残像を3体消す' },
    { id: 'freeze',  name: '時よ止まれ',     desc: '砂時計で残像を止める' },
    { id: 'storm',   name: '嵐を越えて',     desc: 'ECHO STORM のループをクリア' },
    { id: 'nodash',  name: 'ダッシュ封印',   desc: 'ダッシュを使わずに10ループ' },
    { id: 'score5k', name: '5000点',         desc: '1回のプレイで5,000点' },
    { id: 'daily',   name: '日課',           desc: 'デイリーチャレンジを遊ぶ' },
    { id: 'plays10', name: '常連',           desc: '通算10回プレイ' },
  ];
  const SKINS = [
    { id: 'amber',  name: 'アンバー',     color: '#ffb627', need: null,     hint: 'はじめから' },
    { id: 'mint',   name: 'ミント',       color: '#5fe3b8', need: 'loop10', hint: '10ループ到達' },
    { id: 'sakura', name: 'サクラ',       color: '#ff9ec7', need: 'near10', hint: 'ニアミス10回' },
    { id: 'violet', name: 'バイオレット', color: '#b79bff', need: 'chain5', hint: 'CHAIN 5' },
    { id: 'lime',   name: 'ライム',       color: '#c6f25e', need: 'loop20', hint: '20ループ到達' },
    { id: 'gold',   name: 'ゴールド',     color: '#ffd75e', need: 'loop30', hint: '30ループ到達', sparkle: true },
  ];
  const RANKS = [[0, '迷子'], [3, '見習いランナー'], [6, 'ループ慣れ'], [10, '残像使い'], [15, '時間の曲芸師'], [20, '因果の外側'], [30, 'エコーマスター']];
  const rankFor = loops => { let r = RANKS[0][1]; for (const [n, name] of RANKS) if (loops >= n) r = name; return r; };
  const TUTORIAL = {
    1: 'ダイヤ形のコインを取ろう',
    2: 'さっきの自分が「残像」に。触れたらアウト！',
    3: 'ダッシュ中は残像をすり抜けられる',
    4: '赤い消しゴムで、いちばん長い残像を消せる',
  };

  // ================= save data (per browser) =================
  const SAVE_KEY = 'echorun-save-v1';
  const defaults = () => ({
    best: { endless: 0 },
    daily: { date: '', best: 0, plays: 0 },
    stats: { plays: 0, loops: 0, coins: 0, nears: 0, phases: 0, ms: 0 },
    top: { endless: [], daily: [] },
    ach: {},
    skin: 'amber',
    tutorial: false,
    settings: {
      bgm: 0.5, sfx: 0.8, muted: false,
      shake: !reduceMotion, flash: !reduceMotion, preview: true, hitbox: false,
      control: 'keys', stick: 0.5, lefty: false, haptics: true,
    },
  });
  function merge(a, b) {
    for (const k in b) {
      const av = a[k], bv = b[k];
      if (av && bv && typeof av === 'object' && typeof bv === 'object' && !Array.isArray(av) && !Array.isArray(bv)) merge(av, bv);
      else if (k in a) a[k] = bv;
    }
    return a;
  }
  function loadSave() {
    const s = defaults();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) { const d = JSON.parse(raw); merge(s, d); if (d.ach && typeof d.ach === 'object') s.ach = d.ach; }
      else s.best.endless = Number(localStorage.getItem('echorun-best')) || 0; // from the first version
    } catch (e) {}
    return s;
  }
  let save = loadSave();
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
  function ensureDaily() {
    if (save.daily.date !== today()) { save.daily = { date: today(), best: 0, plays: 0 }; save.top.daily = []; }
  }
  ensureDaily();
  const skinOf = id => SKINS.find(s => s.id === id) || SKINS[0];
  const skinUnlocked = s => !s.need || !!save.ach[s.need];

  // ================= seeded randomness (daily runs share coin positions) =================
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  let seed = 'demo';
  const rngFor = (n, salt) => mulberry(hashStr(seed + '|' + n + '|' + salt));

  // ================= layout / device =================
  let px = 0.3, dpr = 1;
  function resize() {
    const s = Math.max(200, Math.floor(Math.min(stage.clientWidth, stage.clientHeight) - 12));
    board.style.width = board.style.height = s + 'px';
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cv.height = Math.round(s * dpr);
    px = s / W;
  }
  new ResizeObserver(resize).observe(stage);
  // canvas text size in arena units, kept readable when the board is small
  const fs = base => Math.round(Math.max(base, base * 0.55 / px));

  function setTouch(on) {
    if (document.body.classList.contains('touch') === on) return;
    document.body.classList.toggle('touch', on);
    resize();
  }
  function applyBodyFlags() {
    document.body.classList.toggle('lefty', !!save.settings.lefty);
    document.body.classList.toggle('mousectl', save.settings.control === 'mouse');
    legend.innerHTML = save.settings.control === 'mouse'
      ? '<span>移動 マウスの方向へ</span><span>ダッシュ <kbd>クリック</kbd> <kbd>Space</kbd></span><span>一時停止 <kbd>P</kbd></span><span>リトライ <kbd>R</kbd> 長押し</span>'
      : '<span>移動 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>ダッシュ <kbd>Space</kbd></span><span>一時停止 <kbd>P</kbd></span><span>リトライ <kbd>R</kbd> 長押し</span>';
  }
  if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
  applyBodyFlags();
  resize();

  const grain = document.createElement('canvas');
  grain.width = grain.height = 160;
  {
    const g = grain.getContext('2d'), im = g.createImageData(160, 160);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = Math.random() * 255;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
      im.data[i + 3] = Math.random() * 16;
    }
    g.putImageData(im, 0, 0);
  }
  const grainPat = ctx.createPattern(grain, 'repeat');

  function buzz(ms) {
    if (!save.settings.haptics || !navigator.vibrate) return;
    try { navigator.vibrate(ms); } catch (e) {}
  }

  // ================= audio: sound effects + generated music =================
  let ac = null, master = null, bgmBus = null, sfxBus = null, noiseBuf = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    master = ac.createGain(); master.connect(ac.destination);
    bgmBus = ac.createGain(); bgmBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.4), ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
  }
  function applyVolumes() {
    const m = save.settings.muted;
    muteBtn.innerHTML = m ? I.muted : I.sound;
    muteBtn.setAttribute('aria-label', m ? '音を出す' : '音を消す');
    if (!ac) return;
    master.gain.value = m ? 0 : 1;
    bgmBus.gain.value = save.settings.bgm * 0.5;
    sfxBus.gain.value = save.settings.sfx;
  }
  function tone(freq, dur, type, vol, slide, delay) {
    if (ac) voice(ac.currentTime + (delay || 0), freq, dur, type, vol, slide, sfxBus);
  }
  function voice(t, freq, dur, type, vol, slide, bus) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(bus);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function hiss(t, dur, vol, hp, bus) {
    if (!ac) return;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(bus || sfxBus);
    s.start(t); s.stop(t + dur + 0.02);
  }
  const sfx = {
    ui() { tone(880, 0.04, 'triangle', 0.04); },
    move() { tone(660, 0.025, 'triangle', 0.025); },
    coin() { tone(988, 0.08, 'square', 0.05); tone(1480, 0.16, 'square', 0.05, 0, 0.07); },
    chain(n) { const base = 660 * Math.pow(1.06, Math.min(n, 10)); [0, 0.06, 0.12].forEach((d, i) => tone(base * [1, 1.26, 1.5][i], 0.1, 'triangle', 0.05, 0, d)); },
    near() { tone(1760, 0.05, 'triangle', 0.05); },
    phase() { tone(620, 0.12, 'triangle', 0.05, 1240); },
    dash() { tone(260, 0.16, 'sawtooth', 0.03, 820); },
    ready() { tone(1320, 0.05, 'sine', 0.025); },
    rewind() { tone(1100, 0.42, 'sawtooth', 0.022, 110); },
    erase() { tone(420, 0.3, 'triangle', 0.07, 1600); },
    freeze() { [0, 0.05, 0.1, 0.15].forEach((d, i) => tone(2093 - i * 180, 0.25, 'sine', 0.04, 0, d)); },
    storm() { tone(110, 0.7, 'sawtooth', 0.05, 55); },
    tick() { tone(660, 0.04, 'sine', 0.05); },
    ach() { [0, 0.08, 0.16].forEach((d, i) => tone([1046, 1318, 1568][i], 0.22, 'triangle', 0.05, 0, d)); },
    die() { tone(330, 0.6, 'square', 0.06, 45); tone(160, 0.5, 'sawtooth', 0.04, 40, 0.05); },
  };

  // Music: a 4-bar loop in A minor whose layers and tempo rise with the loop count.
  const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const BGM = { on: false, step: 0, next: 0, timer: 0, level: 0, tempo: 112 };
  function bgmStart() {
    if (!ac || BGM.on) return;
    BGM.on = true; BGM.step = 0; BGM.next = ac.currentTime + 0.08;
    BGM.timer = setInterval(bgmTick, 25);
  }
  function bgmStop() { BGM.on = false; clearInterval(BGM.timer); }
  function bgmSet(level, tempo) { BGM.level = level; BGM.tempo = tempo; }
  function bgmTick() {
    if (!ac || !BGM.on) return;
    const spb = 60 / BGM.tempo / 4;
    while (BGM.next < ac.currentTime + 0.12) { bgmStep(BGM.step, BGM.next, spb); BGM.next += spb; BGM.step = (BGM.step + 1) % 64; }
  }
  function bgmStep(s, t, spb) {
    const bar = s >> 4, i = s & 15, ch = PROG[bar], L = BGM.level;
    if (L >= 1 && i % 4 === 0) voice(t, 150, 0.16, 'sine', 0.55, 42, bgmBus);
    if (L >= 2 && i % 4 === 2) hiss(t, 0.05, 0.12, 7000, bgmBus);
    if (L >= 3 && i % 2 === 1) hiss(t, 0.03, 0.05, 9000, bgmBus);
    if (L >= 4 && (i === 7 || i === 15)) hiss(t, 0.12, 0.12, 2500, bgmBus);
    if ([0, 3, 6, 8, 11, 14].includes(i)) voice(t, mtof(ch[0] - 24), spb * 1.7, 'triangle', L === 0 ? 0.16 : 0.22, 0, bgmBus);
    const arpOn = L === 0 ? i % 4 === 0 : L >= 3 || i % 2 === 0;
    if (arpOn) {
      const n = ch[(i >> (L >= 3 ? 0 : 1)) % 3] + 12 + (bar % 2 && L >= 3 ? 12 : 0);
      voice(t, mtof(n), spb * 0.9, 'square', L === 0 ? 0.03 : 0.035, 0, bgmBus);
    }
  }
  function duck() {
    if (!ac) return;
    const g = bgmBus.gain, v = save.settings.bgm * 0.5;
    g.cancelScheduledValues(ac.currentTime);
    g.setValueAtTime(v * 0.25, ac.currentTime);
    g.linearRampToValueAtTime(v, ac.currentTime + 0.6);
  }
  function playTempo() { return 120 + Math.min(loopN, 25) * 1.4 + (storm ? 14 : 0); }
  function playLevel() { return storm ? 4 : loopN < 3 ? 1 : loopN < 6 ? 2 : 3; }

  // first interaction anywhere unlocks audio and starts the menu music
  function wakeAudio(e) {
    if (e && e.pointerType === 'touch') setTouch(true);
    initAudio();
    if (ac && !BGM.on && (state === 'title' || state === 'result')) { bgmSet(0, 104); bgmStart(); }
  }
  addEventListener('pointerdown', wakeAudio, { capture: true });
  addEventListener('keydown', wakeAudio, { capture: true });

  // ================= game state =================
  let state = 'title';     // title | play | rewind | paused | dying | result
  let mode = 'endless', screen = 'title', pausedFrom = 'play';
  let ghosts = [], rec = [];
  let frame = 0, gtime = 0, loopN = 0, score = 0, shownScore = 0, chain = 0;
  let graceLeft = 0, timeLeft = 0, freezeLeft = 0, storm = false;
  let coin = null, eraser = null, hourglass = null, nextStart = null;
  let rewindT = 0, rewindFrom = 0, dyingT = 0, revealT = 0, killer = null;
  let banner = null, hint = null, tutorial = false, run = null, unlockedThisRun = [];
  let particles = [], popups = [];
  let shake = 0, flash = 0, slow = 0, hitstop = 0, tick = 0, attractT = 0, readyPulse = 0, retryHold = 0;
  const P = { x: W / 2, y: W / 2, vx: 0, vy: 0, dash: 0, cd: 0, dx: 0, dy: 1, trail: [] };

  function ghostAt(g, f) {
    const L = g.len;
    let i = 0;
    if (L > 1) { const per = 2 * (L - 1), m = f % per; i = m < L ? m : per - m; }
    return [g.path[i * 3], g.path[i * 3 + 1], g.path[i * 3 + 2]];
  }
  function makeGhost(data, n) {
    const path = Float32Array.from(data), len = path.length / 3;
    const lane = new Path2D();
    lane.moveTo(path[0], path[1]);
    for (let i = 2; i < len; i += 2) lane.lineTo(path[i * 3], path[i * 3 + 1]);
    lane.lineTo(path[(len - 1) * 3], path[(len - 1) * 3 + 1]);
    return { path, len, n, near: 0, phased: false, lane };
  }
  // the menu's background: a few lissajous "ghosts" drifting on their own lanes
  const demo = (() => {
    const out = [];
    for (let k = 0; k < 5; k++) {
      const pts = [], N = 520, a = 1 + (k % 3), b = 2 + ((k * 2) % 3), ph = k * 1.3;
      for (let i = 0; i < N; i++) {
        const t = i / N * Math.PI * 2;
        pts.push(500 + Math.sin(a * t + ph) * (330 - k * 22), 520 + Math.sin(b * t) * (300 - k * 18), 0);
      }
      out.push(makeGhost(pts, k + 1));
    }
    return out;
  })();

  function pickSpot(rng, from, minD, avoid) {
    let bp = null, bs = -1;
    for (let i = 0; i < 80; i++) {
      const p = { x: 90 + rng() * (W - 180), y: 90 + rng() * (W - 180) };
      const d = dist(p, from);
      let a = 999;
      for (const q of avoid) a = Math.min(a, dist(p, q));
      if (d >= minD && a >= 170) return p;
      const s = Math.min(d / minD, a / 170);
      if (s > bs) { bs = s; bp = p; }
    }
    return bp;
  }

  function startRun(m) {
    initAudio();
    mode = m;
    ensureDaily();
    seed = m === 'daily' ? 'daily-' + today() : 'e' + Math.random().toString(36).slice(2);
    ghosts = []; loopN = 1; score = 0; shownScore = 0; chain = 0; killer = null;
    particles = []; popups = []; unlockedThisRun = []; retryHold = 0; dashBuf = 0; dashQueued = false;
    run = { nears: 0, phases: 0, erases: 0, freezes: 0, maxChain: 0, dashes: 0, frames: 0 };
    tutorial = m === 'endless' && !save.tutorial;
    ov.hidden = true; ov.classList.remove('peek');
    save.stats.plays++;
    persist();
    if (m === 'daily') unlock('daily');
    if (save.stats.plays >= 10) unlock('plays10');
    el.mode.textContent = m === 'daily' ? 'DAILY ' + shortDate() : 'ENDLESS';
    beginLoop({ x: W / 2, y: W / 2 });
    setPauseIcon();
    bgmStop(); bgmSet(playLevel(), playTempo()); bgmStart();
  }

  function beginLoop(s) {
    rec = []; frame = 0; gtime = 0; freezeLeft = 0;
    P.x = s.x; P.y = s.y; P.vx = P.vy = 0; P.dash = 0; P.trail = [];
    storm = loopN >= 10 && loopN % 5 === 0;
    coin = pickSpot(rngFor(loopN, 'coin'), s, 360, []);
    eraser = (loopN % 4 === 0 && ghosts.length >= 3) ? pickSpot(rngFor(loopN, 'erase'), s, 220, [coin]) : null;
    hourglass = (loopN >= 6 && loopN % 6 === 0 && ghosts.length >= 3) ? pickSpot(rngFor(loopN, 'freeze'), s, 200, eraser ? [coin, eraser] : [coin]) : null;
    graceLeft = GRACE; timeLeft = LIMIT;
    for (const g of ghosts) { g.near = 0; g.phased = false; }
    const subs = [];
    if (storm) subs.push('残像が1.5倍速');
    if (eraser) subs.push('消しゴム出現');
    if (hourglass) subs.push('砂時計出現');
    if (!subs.length) subs.push(ghosts.length ? '残像 ×' + ghosts.length : 'コインを取ろう');
    banner = { text: storm ? 'ECHO STORM' : 'LOOP ' + loopN, sub: subs.join(' · '), t: 80, storm };
    hint = tutorial && TUTORIAL[loopN] ? { text: TUTORIAL[loopN], t: 300 } : null;
    if (storm) { sfx.storm(); shakeBy(10); }
    state = 'play';
    if (BGM.on) bgmSet(playLevel(), playTempo());
    updateHud();
  }

  function collect() {
    const clearF = frame;
    chain = clearF <= FAST_CLEAR ? chain + 1 : 0;
    run.maxChain = Math.max(run.maxChain, chain);
    const mult = 1 + Math.min(chain, 8) * 0.25;
    const gain = Math.round((100 + Math.ceil(timeLeft / 60) * 10) * mult);
    score += gain;
    popup(coin.x, coin.y - 38, '+' + fmt(gain), C.amber, 1.35);
    if (chain > 0) { popup(coin.x, coin.y - 74, 'CHAIN ' + chain + ' ×' + mult.toFixed(2), C.chalk, 0.95); sfx.chain(chain); }
    else sfx.coin();
    burst(coin.x, coin.y, 28, C.amber, 6);
    sfx.rewind(); duck(); buzz(15);
    doFlash(0.45);
    save.stats.coins++;
    unlock('first');
    if (storm) unlock('storm');
    ghosts.push(makeGhost(rec, loopN));
    nextStart = { x: coin.x, y: coin.y };
    rewindFrom = Math.max(frame, Math.floor(gtime)); rewindT = 0;
    loopN++;
    checkRunAch();
    state = 'rewind';
    updateHud();
  }

  function doErase() {
    let idx = 0;
    ghosts.forEach((g, i) => { if (g.len > ghosts[idx].len) idx = i; });
    const g = ghosts[idx], p = ghostAt(g, Math.floor(gtime));
    burst(p[0], p[1], 34, C.coral, 7);
    burst(eraser.x, eraser.y, 14, C.coral, 4);
    popup(p[0], p[1] - 34, '#' + g.n + ' 消去 +50', C.coral, 1.15);
    ghosts.splice(idx, 1);
    score += 50; eraser = null; run.erases++;
    shakeBy(9); sfx.erase(); buzz(20);
    checkRunAch();
    updateHud();
  }

  function doFreeze() {
    burst(hourglass.x, hourglass.y, 26, C.ice, 6);
    popup(hourglass.x, hourglass.y - 34, 'フリーズ +30', C.ice, 1.1);
    hourglass = null; freezeLeft = FREEZE_FRAMES; score += 30; run.freezes++;
    sfx.freeze(); doFlash(0.25); buzz(20);
    unlock('freeze');
  }

  function die(g) {
    state = 'dying'; dyingT = 0; killer = g; hitstop = 10; joy = null; resetPad();
    shakeBy(24); doFlash(0.6);
    burst(P.x, P.y, 46, skinOf(save.skin).color, 8);
    sfx.die(); bgmStop(); buzz([60, 40, 90]);
  }

  function finishRun() {
    const loops = loopN - 1;
    let isBest = false;
    if (mode === 'endless') { if (score > save.best.endless) { save.best.endless = score; isBest = true; } }
    else { ensureDaily(); save.daily.plays++; if (score > save.daily.best) { save.daily.best = score; isBest = true; } }
    const list = save.top[mode];
    list.push({ score, loops, date: today() });
    list.sort((a, b) => b.score - a.score);
    list.length = Math.min(list.length, 5);
    save.stats.loops += loops; save.stats.nears += run.nears; save.stats.phases += run.phases;
    save.stats.ms += Math.round(run.frames * STEP);
    save.tutorial = true;
    persist();
    checkRunAch();
    state = 'result'; revealT = 0; shownScore = score;
    setPauseIcon();
    showResult(isBest);
    bgmSet(0, 104); bgmStart();
    updateHud();
  }

  function triggerDash() {
    if (save.settings.control === 'mouse' && mouse) {
      const dx = mouse.x - P.x, dy = mouse.y - P.y, d = Math.hypot(dx, dy);
      if (d > 4) { P.dx = dx / d; P.dy = dy / d; }
    }
    P.dash = DASH_FRAMES; P.cd = DASH_CD; run.dashes++;
    sfx.dash(); burst(P.x, P.y, 10, C.chalk, 3); buzz(8);
  }

  function stepPlay() {
    run.frames++;
    const inp = inputVec(), il = Math.hypot(inp.x, inp.y);
    if (il > 0.1) { P.dx = inp.x / il; P.dy = inp.y / il; }
    // a dash pressed slightly before the cooldown ends still fires when it does
    if (dashQueued) { dashBuf = DASH_BUFFER; dashQueued = false; }
    if (dashBuf > 0) { if (P.cd <= 0) { triggerDash(); dashBuf = 0; } else dashBuf--; }

    if (P.dash > 0) {
      P.vx = P.dx * SPEED * DASH_MUL; P.vy = P.dy * SPEED * DASH_MUL; P.dash--;
    } else {
      P.vx += (inp.x * SPEED - P.vx) * 0.38;
      P.vy += (inp.y * SPEED - P.vy) * 0.38;
    }
    P.x = clamp(P.x + P.vx, R, W - R);
    P.y = clamp(P.y + P.vy, R, W - R);
    if (P.cd > 0 && --P.cd === 0) { readyPulse = 16; sfx.ready(); }
    const phasing = P.dash > 0;

    rec.push(P.x, P.y, phasing ? 1 : 0);
    P.trail.push(P.x, P.y);
    if (P.trail.length > 30) P.trail.splice(0, 2);
    if (skinOf(save.skin).sparkle && tick % 5 === 0) particles.push({ x: P.x + (Math.random() - 0.5) * 30, y: P.y + (Math.random() - 0.5) * 30, vx: 0, vy: -0.6, life: 1, decay: 0.04, col: '#fff3c4', size: 3 });

    if (graceLeft <= 0) {
      const gi = Math.floor(gtime);
      for (const g of ghosts) {
        if (g.near > 0) g.near--;
        const gp = ghostAt(g, gi), d = Math.hypot(gp[0] - P.x, gp[1] - P.y);
        if (d < HIT) {
          if (!phasing) { die(g); return; }
          if (!g.phased) {
            g.phased = true; score += 15; run.phases++;
            popup(P.x, P.y - 34, 'すり抜け +15', C.chalk, 1);
            sfx.phase();
            checkRunAch();
          }
        } else {
          if (g.phased && d > R * 2.2) g.phased = false;
          if (!phasing && d >= R * 2 && d < NEAR && g.near <= 0) {
            g.near = 70; score += 25; slow = 8; run.nears++;
            popup(P.x, P.y - 34, 'ニアミス +25', C.chalk, 1);
            sfx.near(); buzz(6);
            checkRunAch();
          }
        }
      }
    }

    frame++; graceLeft--; timeLeft--;
    if (freezeLeft > 0) freezeLeft--; else gtime += storm ? STORM_SPEED : 1;
    if (timeLeft > 0 && timeLeft <= 180 && timeLeft % 60 === 0) sfx.tick();
    if (timeLeft <= 0) { die(null); return; }
    if (eraser && dist(P, eraser) < R + 22) doErase();
    if (hourglass && dist(P, hourglass) < R + 22) doFreeze();
    if (dist(P, coin) < R + 22) collect();
  }

  function step() {
    tick++;
    pollPad();
    if (state === 'paused') return;
    if (hitstop > 0) { hitstop--; return; }
    shake *= 0.86; if (flash > 0) flash -= 0.035;
    if (readyPulse > 0) readyPulse--;
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life -= p.decay; }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.t++; p.y -= 0.7; }
    popups = popups.filter(p => p.t < 64);
    if (banner && --banner.t <= 0) banner = null;
    if (hint && hint.t > 0) hint.t--;

    // hold R (or the pad's SELECT) to restart the run
    if (active() && (keys.has('r') || pad.select)) { if (++retryHold >= RETRY_HOLD) { startRun(mode); return; } }
    else retryHold = 0;

    if (state === 'play') stepPlay();
    else if (state === 'rewind') { if (++rewindT >= REWIND) beginLoop(nextStart); }
    else if (state === 'dying') { if (++dyingT >= DYING) finishRun(); }
    else if (state === 'result') { gtime++; revealT++; }
    else attractT++;
    syncDashBtn();
    updateHud();
  }

  // ================= fx helpers =================
  function burst(x, y, n, col, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.25 + Math.random());
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.018 + Math.random() * 0.03, col, size: 2 + Math.random() * 4.5 });
    }
  }
  function popup(x, y, text, col, size) { popups.push({ x, y, text, col, size: size || 1, t: 0 }); }
  function shakeBy(v) { if (save.settings.shake) shake = Math.max(shake, v); }
  function doFlash(v) { if (save.settings.flash) flash = Math.max(flash, v); }
  const toastQ = [];
  let toastBusy = false;
  function toast(tag, html) { toastQ.push([tag, html]); if (!toastBusy) nextToast(); }
  function nextToast() {
    const item = toastQ.shift();
    if (!item) { toastBusy = false; return; }
    toastBusy = true;
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = `<span class="tag">${item[0]}</span><span>${item[1]}</span>`;
    toastsEl.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2000);
    setTimeout(() => { t.remove(); nextToast(); }, 2400);
  }

  // ================= achievements =================
  function unlock(id) {
    if (save.ach[id]) return;
    const a = ACH.find(x => x.id === id);
    if (!a) return;
    save.ach[id] = Date.now();
    persist();
    unlockedThisRun.push(a.name);
    sfx.ach();
    toast('実績解除', `<b>${a.name}</b> · ${a.desc}`);
    const sk = SKINS.find(s => s.need === id);
    if (sk) toast('スキン解放', `<b>${sk.name}</b> が使えるようになった`);
  }
  function checkRunAch() {
    if (!run) return;
    const loops = loopN - 1;
    if (loops >= 5) unlock('loop5');
    if (loops >= 10) unlock('loop10');
    if (loops >= 20) unlock('loop20');
    if (loops >= 30) unlock('loop30');
    if (run.nears >= 10) unlock('near10');
    if (run.phases >= 5) unlock('phase5');
    if (run.maxChain >= 5) unlock('chain5');
    if (run.erases >= 3) unlock('erase3');
    if (loops >= 10 && run.dashes === 0) unlock('nodash');
    if (score >= 5000) unlock('score5k');
  }

  // ================= input =================
  const keys = new Set();
  let dashQueued = false, dashBuf = 0, joy = null, mouse = null;
  const pad = { x: 0, y: 0, dash: false, start: false, back: false, select: false, nav: 0, navHold: 0 };
  const DASH_KEYS = [' ', 'shift', 'j', 'k', 'x'];
  const active = () => state === 'play' || state === 'rewind';
  const menuOpen = () => !ov.hidden && !ov.classList.contains('peek');
  const stickFull = () => 60 - save.settings.stick * 28;   // px of travel for full speed

  function focusables() {
    return [...ov.querySelectorAll('button:not([disabled]), input, textarea')].filter(n => n.offsetParent !== null);
  }
  function moveFocus(d) {
    const f = focusables();
    if (!f.length) return;
    let i = f.indexOf(document.activeElement);
    i = i < 0 ? 0 : (i + d + f.length) % f.length;
    f[i].focus();
    sfx.move();
  }
  function goBack() {
    if (state === 'paused') togglePause();
    else if (state === 'result') { if (ov.classList.contains('peek')) ov.classList.remove('peek'); else toTitle(); }
    else if (state === 'title' && screen !== 'title') { const from = screen; showScreen('title', from); }
  }

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') { if (k === 'escape') goBack(); return; }
    const onButton = tag === 'BUTTON';
    const arrow = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k);
    if ((arrow || k === ' ') && (active() || !onButton)) e.preventDefault();
    keys.add(k);
    if (e.repeat && !(arrow && menuOpen())) return;
    if (active()) {
      if (DASH_KEYS.includes(k)) dashQueued = true;
      if (k === 'p' || k === 'escape') togglePause();
      return;
    }
    if (arrow && menuOpen()) { e.preventDefault(); moveFocus(k === 'arrowup' || k === 'arrowleft' ? -1 : 1); return; }
    if (k === 'escape' || k === 'backspace') { goBack(); return; }
    if (state === 'paused' && k === 'p') { togglePause(); return; }
    if (state === 'result' && !onButton && (k === ' ' || k === 'enter' || k === 'r')) startRun(mode);
  });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => { keys.clear(); joy = null; resetPad(); if (active()) togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && active()) togglePause(); });

  // drag on the arena: a floating stick (or a click-to-dash in mouse mode)
  stage.addEventListener('pointerdown', e => {
    if (!active()) return;
    if (e.pointerType === 'mouse' && save.settings.control === 'mouse') { dashQueued = true; return; }
    if (joy) { dashQueued = true; return; }          // a second finger dashes
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    joy = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, src: 'board' };
  });
  stage.addEventListener('contextmenu', e => { if (active()) e.preventDefault(); });
  function moveJoy(e) {
    if (!joy || e.pointerId !== joy.id) return false;
    joy.x = e.clientX; joy.y = e.clientY;
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), full = stickFull();
    if (d > full) { joy.ox = joy.x - dx / d * full; joy.oy = joy.y - dy / d * full; } // floating stick
    return true;
  }
  stage.addEventListener('pointermove', moveJoy);
  const endJoy = e => { if (joy && e.pointerId === joy.id) { joy = null; resetPad(); } };
  stage.addEventListener('pointerup', endJoy);
  stage.addEventListener('pointercancel', endJoy);

  // mouse-follow control
  cv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const r = cv.getBoundingClientRect();
    mouse = { x: (e.clientX - r.left) / px, y: (e.clientY - r.top) / px };
  });
  cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') mouse = null; });

  // touch deck: the stick appears where the thumb lands inside the pad zone
  padzone.addEventListener('pointerdown', e => {
    if (!active()) return;
    e.preventDefault();
    try { padzone.setPointerCapture(e.pointerId); } catch (err) {}
    const r = padzone.getBoundingClientRect(), m = 54;
    const ox = clamp(e.clientX, r.left + Math.min(m, r.width / 2), r.right - Math.min(m, r.width / 2));
    const oy = clamp(e.clientY, r.top + Math.min(m, r.height / 2), r.bottom - Math.min(m, r.height / 2));
    joy = { id: e.pointerId, ox, oy, x: e.clientX, y: e.clientY, src: 'pad' };
    padzone.classList.add('held');
    syncPad();
  });
  padzone.addEventListener('pointermove', e => { if (moveJoy(e)) syncPad(); });
  padzone.addEventListener('pointerup', endJoy);
  padzone.addEventListener('pointercancel', endJoy);
  function syncPad() {
    if (!joy || joy.src !== 'pad') return;
    const r = padzone.getBoundingClientRect();
    const bx = joy.ox - r.left, by = joy.oy - r.top;
    padBase.style.left = padKnob.style.left = bx + 'px';
    padBase.style.top = padKnob.style.top = by + 'px';
    const full = stickFull(), dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), k = d > full ? full / d : 1;
    padKnob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  }
  function resetPad() {
    padzone.classList.remove('held');
    padBase.style.left = padKnob.style.left = '50%';
    padBase.style.top = padKnob.style.top = '50%';
    padKnob.style.transform = '';
  }

  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; break; }
    if (!gp) { pad.x = pad.y = 0; pad.select = false; return; }
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
    if (Math.hypot(x, y) < 0.2) x = y = 0;
    if (b(14)) x = -1; if (b(15)) x = 1; if (b(12)) y = -1; if (b(13)) y = 1;
    pad.x = x; pad.y = y; pad.select = b(8);
    const a = b(0), back = b(1), dash = b(0) || b(1) || b(2) || b(5) || b(7), start = b(9);
    if (active()) {
      if (dash && !pad.dash) dashQueued = true;
      if (start && !pad.start) togglePause();
    } else if (menuOpen()) {
      // menus: stick / d-pad moves focus, A presses, B goes back
      const nd = y < -0.5 || x < -0.5 ? -1 : y > 0.5 || x > 0.5 ? 1 : 0;
      if (nd && nd !== pad.nav) { moveFocus(nd); pad.navHold = 0; }
      else if (nd && ++pad.navHold > 18) { moveFocus(nd); pad.navHold = 10; }
      pad.nav = nd;
      if (a && !pad.dash) {
        const f = document.activeElement;
        if (f && ov.contains(f) && f.tagName === 'BUTTON') f.click(); else moveFocus(1);
      }
      if (back && !pad.back) goBack();
      if (start && !pad.start) { if (state === 'paused') togglePause(); }
    } else if (state === 'result' && (a && !pad.dash || back && !pad.back)) {
      ov.classList.remove('peek');
    }
    pad.dash = dash; pad.back = back; pad.start = start;
  }

  function inputVec() {
    let x = pad.x, y = pad.y;
    if (keys.has('arrowleft') || keys.has('a')) x -= 1;
    if (keys.has('arrowright') || keys.has('d')) x += 1;
    if (keys.has('arrowup') || keys.has('w')) y -= 1;
    if (keys.has('arrowdown') || keys.has('s')) y += 1;
    if (joy) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), dead = 6, full = stickFull();
      if (d > dead) { const m = Math.min(1, (d - dead) / (full - dead)); x += dx / d * m; y += dy / d * m; }
    }
    if (!x && !y && !joy && save.settings.control === 'mouse' && mouse) {
      const dx = mouse.x - P.x, dy = mouse.y - P.y, d = Math.hypot(dx, dy);
      if (d > 5) { const m = Math.min(1, d / 70); x = dx / d * m; y = dy / d * m; }
    }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  }

  function drawArena() {
    const g = ctx.createRadialGradient(500, 430, 80, 500, 520, 780);
    g.addColorStop(0, C.cyan); g.addColorStop(1, C.deep);
    ctx.fillStyle = g;
    ctx.fillRect(-60, -60, W + 120, W + 120);
    if (storm && (state === 'play' || state === 'paused')) {
      ctx.fillStyle = `rgba(255,111,89,${0.05 + Math.sin(tick / 9) * 0.03})`;
      ctx.fillRect(0, 0, W, W);
    }
    if (freezeLeft > 0) { ctx.fillStyle = 'rgba(143,227,255,0.07)'; ctx.fillRect(0, 0, W, W); }
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, W);

    ctx.lineWidth = 1 / px;
    for (let i = 50; i < W; i += 50) {
      ctx.strokeStyle = i % 250 === 0 ? 'rgba(234,241,248,0.13)' : 'rgba(234,241,248,0.05)';
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, W); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(234,241,248,0.35)';
    ctx.strokeRect(0, 0, W, W);
    ctx.fillStyle = 'rgba(234,241,248,0.28)';
    ctx.font = `500 ${11 / px}px ${MONO}`;
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    for (let i = 250; i < W; i += 250) ctx.fillText(String(i), i + 4 / px, 14 / px);
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    const tag = state === 'title' ? 'ARENA 1000×1000 · 60 STEPS/s' : (mode === 'daily' ? 'DAILY ' + today() : 'ENDLESS') + ' · SEED ' + (hashStr(seed) % 100000);
    ctx.fillText(tag, W - 6 / px, W - 5 / px);
  }

  function drawEyes(x, y, dx, dy, col, r) {
    const l = Math.hypot(dx, dy);
    let ex = 0, ey = 0.35;
    if (l > 0.01) { ex = dx / l; ey = dy / l; }
    const off = r * 0.36, sp = r * 0.34, er = r * 0.17;
    ctx.fillStyle = col;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(x + ex * off - ey * sp * s, y + ey * off + ex * sp * s, er, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGhost(g, gi, opts) {
    const p = ghostAt(g, gi), q = ghostAt(g, gi + 3);
    const isKiller = killer === g && (state === 'dying' || state === 'result');
    const frozen = opts.live && freezeLeft > 0;
    const danger = opts.live && !opts.intangible && Math.hypot(p[0] - P.x, p[1] - P.y) < NEAR + 46;
    const age = loopN - g.n;
    ctx.globalAlpha = (opts.intangible ? 0.4 : 0.95 - Math.min(age, 10) * 0.035) * (opts.alpha || 1);
    if (p[2]) {
      ctx.strokeStyle = 'rgba(234,241,248,0.35)'; ctx.lineWidth = R * 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] - (q[0] - p[0]) * 1.5, p[1] - (q[1] - p[1]) * 1.5); ctx.stroke();
    }
    const stroke = isKiller || danger ? C.coral : frozen ? C.ice : storm && opts.live ? '#ffd2c9' : C.chalk;
    ctx.fillStyle = isKiller ? C.coral : frozen ? 'rgba(143,227,255,0.3)' : danger ? 'rgba(255,111,89,0.22)' : 'rgba(234,241,248,0.2)';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = danger ? 3.6 : 2.6;
    if (danger) ctx.globalAlpha = 1;
    if (opts.intangible) ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    drawEyes(p[0], p[1], q[0] - p[0], q[1] - p[1], isKiller ? C.deep : stroke, R);
    if (save.settings.hitbox && opts.live) {
      ctx.strokeStyle = C.coral; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], HIT / 2, 0, Math.PI * 2); ctx.stroke();
    }
    if (opts.label !== false) {
      ctx.fillStyle = isKiller || danger ? C.coral : C.dim;
      ctx.font = `600 ${fs(20)}px ${MONO}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('#' + g.n, p[0], p[1] - R - 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPreview(g, gi) {
    const sp = storm ? STORM_SPEED : 1;
    ctx.fillStyle = C.chalk;
    for (let k = 1; k <= 12; k++) {
      const p = ghostAt(g, Math.floor(gi + k * 3 * sp));
      ctx.globalAlpha = 0.4 * (1 - k / 13);
      ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPickupLabel(x, y, text, col) {
    ctx.fillStyle = col; ctx.font = `600 ${fs(18)}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(text, x, y + 24);
  }

  function pill(x, y, text, bg, fg, align) {
    ctx.font = `600 ${fs(20)}px ${MONO}`;
    const w = ctx.measureText(text).width + fs(20) * 1.1, h = fs(20) * 1.6;
    const left = align === 'right' ? x - w : x;
    ctx.fillStyle = bg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(left, y, w, h, h / 2); else ctx.rect(left, y, w, h);
    ctx.fill();
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, left + w / 2, y + h / 2 + 1);
  }

  function draw() {
    const s = px * dpr;
    let sx = 0, sy = 0;
    if (shake > 0.4) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    ctx.setTransform(s, 0, 0, s, sx * s, sy * s);
    drawArena();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (state === 'title') {
      for (const g of demo) { ctx.strokeStyle = 'rgba(234,241,248,0.08)'; ctx.lineWidth = 1.2 / px; ctx.stroke(g.lane); }
      for (const g of demo) drawGhost(g, attractT, { alpha: 0.5, label: false });
      drawFx();
      return;
    }

    const live = state === 'play' || (state === 'paused' && pausedFrom === 'play');
    const rewinding = state === 'rewind' || (state === 'paused' && pausedFrom === 'rewind');
    let gi = Math.floor(gtime);
    if (rewinding) {
      const p = Math.min(1, rewindT / REWIND), e = p * p * (3 - 2 * p);
      gi = Math.round(rewindFrom * (1 - e));
    }

    // lanes: each ghost's full route, so the danger zones can be read at a glance
    if (state === 'result') {
      ghosts.forEach((g, i) => {
        const a = clamp((revealT - i * 5) / 30, 0, 1);
        if (a <= 0) return;
        const t = ghosts.length > 1 ? i / (ghosts.length - 1) : 1;
        ctx.globalAlpha = a;
        ctx.strokeStyle = t > 0.66 ? skinOf(save.skin).color : t > 0.33 ? C.chalk : C.dim;
        ctx.lineWidth = 3; ctx.stroke(g.lane);
        ctx.globalAlpha = 1;
      });
    } else {
      for (const g of ghosts) {
        ctx.strokeStyle = 'rgba(234,241,248,0.045)'; ctx.lineWidth = R * 2; ctx.stroke(g.lane);
        ctx.strokeStyle = 'rgba(234,241,248,0.14)'; ctx.lineWidth = 1.2 / px; ctx.stroke(g.lane);
      }
    }

    const urgent = live && timeLeft <= 180;
    // coin with its countdown ring
    if (coin && (live || state === 'dying')) {
      const t = tick / 60, pulse = 1 + Math.sin(t * 6) * 0.08;
      const frac = clamp(timeLeft / LIMIT, 0, 1);
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(234,241,248,0.15)';
      ctx.beginPath(); ctx.arc(coin.x, coin.y, 36, 0, Math.PI * 2); ctx.stroke();
      if (!(urgent && Math.floor(tick / 8) % 2)) {
        ctx.strokeStyle = urgent ? C.coral : C.amber;
        ctx.beginPath(); ctx.arc(coin.x, coin.y, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
      }
      ctx.save();
      ctx.translate(coin.x, coin.y); ctx.rotate(t * 1.6); ctx.scale(pulse, pulse);
      ctx.fillStyle = C.amber;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(14, 0); ctx.lineTo(0, 18); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(5, -4); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    if (eraser && live) {
      const b = 1 + Math.sin(tick / 7) * 0.1;
      ctx.save(); ctx.translate(eraser.x, eraser.y); ctx.scale(b, b);
      ctx.fillStyle = C.coral;
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.deep; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.moveTo(6, -6); ctx.lineTo(-6, 6); ctx.stroke();
      ctx.restore();
      drawPickupLabel(eraser.x, eraser.y, 'ERASE', C.coral);
    }
    if (hourglass && live) {
      ctx.save(); ctx.translate(hourglass.x, hourglass.y); ctx.rotate(Math.sin(tick / 20) * 0.25);
      ctx.fillStyle = C.ice;
      ctx.beginPath(); ctx.moveTo(-13, -18); ctx.lineTo(13, -18); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-13, 18); ctx.lineTo(13, 18); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
      drawPickupLabel(hourglass.x, hourglass.y, 'FREEZE', C.ice);
    }

    // ghosts
    if (live && save.settings.preview && freezeLeft <= 0) for (const g of ghosts) drawPreview(g, gi);
    for (const g of ghosts) drawGhost(g, gi, { live, intangible: live && graceLeft > 0 });

    // mouse-follow target
    if (live && save.settings.control === 'mouse' && mouse && !joy) {
      ctx.strokeStyle = 'rgba(234,241,248,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); ctx.setLineDash([]);
    }

    // player
    const skin = skinOf(save.skin);
    if (state !== 'dying' && state !== 'result') {
      const at = rewinding ? nextStart : P;
      if (!rewinding) {
        for (let i = 0; i < P.trail.length; i += 2) {
          const a = i / P.trail.length;
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = skin.color;
          ctx.beginPath(); ctx.arc(P.trail[i], P.trail[i + 1], R * (0.35 + a * 0.5), 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (graceLeft > 0 && live) {
        ctx.strokeStyle = skin.color; ctx.lineWidth = 2; ctx.globalAlpha = graceLeft / GRACE;
        ctx.beginPath(); ctx.arc(P.x, P.y, R + 10 + (GRACE - graceLeft) * 0.6, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // dash gauge around the player: the ring refills, then a chevron shows the dash direction
      if (live) {
        if (P.cd > 0 && P.dash <= 0) {
          ctx.strokeStyle = 'rgba(234,241,248,0.18)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(P.x, P.y, R + 8, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = 'rgba(234,241,248,0.7)';
          ctx.beginPath(); ctx.arc(P.x, P.y, R + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - P.cd / DASH_CD)); ctx.stroke();
        } else if (P.dash <= 0) {
          const ax = P.x + P.dx * (R + 12), ay = P.y + P.dy * (R + 12), nx = -P.dy, ny = P.dx;
          ctx.fillStyle = skin.color; ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(ax + P.dx * 9, ay + P.dy * 9);
          ctx.lineTo(ax + nx * 7, ay + ny * 7);
          ctx.lineTo(ax - nx * 7, ay - ny * 7);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1;
        }
        if (readyPulse > 0) {
          ctx.strokeStyle = skin.color; ctx.lineWidth = 3; ctx.globalAlpha = readyPulse / 16;
          ctx.beginPath(); ctx.arc(P.x, P.y, R + 8 + (16 - readyPulse) * 1.6, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
      ctx.fillStyle = skin.color;
      ctx.beginPath(); ctx.arc(at.x, at.y, R, 0, Math.PI * 2); ctx.fill();
      if (P.dash > 0) {
        ctx.strokeStyle = C.chalk; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(at.x, at.y, R + 3, 0, Math.PI * 2); ctx.stroke();
      }
      drawEyes(at.x, at.y, P.vx, P.vy, C.deep, R);
      if (save.settings.hitbox && live) {
        ctx.strokeStyle = C.deep; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(P.x, P.y, HIT / 2, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (state === 'dying') {
      const k = dyingT / DYING;
      ctx.strokeStyle = C.coral; ctx.lineWidth = 4; ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + k * 140, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    drawFx();

    // in-arena HUD: time bar across the top edge, with the chain window marked
    if (live || rewinding || state === 'dying') {
      const frac = rewinding ? 1 : clamp(timeLeft / LIMIT, 0, 1), bh = 9;
      ctx.fillStyle = 'rgba(234,241,248,0.12)'; ctx.fillRect(0, 0, W, bh);
      ctx.fillStyle = urgent ? C.coral : C.amber; ctx.fillRect(0, 0, W * frac, bh);
      const cx = W * (1 - FAST_CLEAR / LIMIT);
      ctx.fillStyle = frame <= FAST_CLEAR && live ? C.chalk : 'rgba(234,241,248,0.35)';
      ctx.fillRect(cx - 2, 0, 4, bh + 8);
      const y = bh + 12;
      if (chain > 0) pill(14, y, 'CHAIN ' + chain + ' ×' + (1 + Math.min(chain, 8) * 0.25).toFixed(2), C.amber, C.deep);
      if (freezeLeft > 0 && live) pill(W - 14, y, 'FREEZE ' + (freezeLeft / 60).toFixed(1) + 's', C.ice, C.deep, 'right');
      else if (live) {
        ctx.fillStyle = urgent ? C.coral : 'rgba(234,241,248,0.6)'; ctx.font = `600 ${fs(20)}px ${MONO}`;
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText((Math.max(0, timeLeft) / 60).toFixed(1) + 's', W - 16, y + 4);
      }
    }

    // rewind overlay: tape-style scanlines
    if (rewinding) {
      ctx.fillStyle = 'rgba(234,241,248,0.05)';
      const off = (tick * 9) % 24;
      for (let y = -24 + off; y < W; y += 24) ctx.fillRect(0, y, W, 6);
      ctx.fillStyle = C.chalk; ctx.font = `400 ${fs(34)}px ${DISPLAY}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('◀◀ 巻き戻し', 30, W - 40);
    }

    // banner
    if (banner && (live || rewinding)) {
      const a = Math.min(1, banner.t / 18);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `400 ${banner.storm ? 58 : 64}px ${DISPLAY}`;
      ctx.lineWidth = 10; ctx.strokeStyle = C.deep; ctx.strokeText(banner.text, W / 2, 160);
      ctx.fillStyle = banner.storm ? C.coral : C.chalk; ctx.fillText(banner.text, W / 2, 160);
      ctx.font = `600 ${fs(24)}px ${MONO}`;
      ctx.lineWidth = 6; ctx.strokeText(banner.sub, W / 2, 220);
      ctx.fillStyle = C.amber; ctx.fillText(banner.sub, W / 2, 220);
      ctx.globalAlpha = 1;
    }
    // tutorial hint
    if (hint && hint.t > 0 && live) {
      ctx.globalAlpha = Math.min(1, hint.t / 30);
      ctx.font = `400 ${fs(26)}px ${DISPLAY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(hint.text).width + 40, h = fs(26) + 26;
      ctx.fillStyle = C.chalk;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(W / 2 - w / 2, W - 60 - h, w, h, 12); else ctx.rect(W / 2 - w / 2, W - 60 - h, w, h);
      ctx.fill();
      ctx.fillStyle = C.deep; ctx.fillText(hint.text, W / 2, W - 60 - h / 2);
      ctx.globalAlpha = 1;
    }
    // hold-to-retry progress
    if (retryHold > 0) {
      const w = 320, x = W / 2 - w / 2, y = W / 2 - 20;
      ctx.fillStyle = 'rgba(13,37,70,0.85)'; ctx.fillRect(x - 16, y - 46, w + 32, 84);
      ctx.fillStyle = C.chalk; ctx.font = `600 ${fs(22)}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('リトライ…', W / 2, y - 18);
      ctx.fillStyle = 'rgba(234,241,248,0.2)'; ctx.fillRect(x, y + 6, w, 10);
      ctx.fillStyle = C.amber; ctx.fillRect(x, y + 6, w * retryHold / RETRY_HOLD, 10);
    }

    if (flash > 0) { ctx.fillStyle = `rgba(255,248,230,${flash * 0.35})`; ctx.fillRect(-60, -60, W + 120, W + 120); }

    // floating joystick drawn on the arena when the drag started there
    if (joy && joy.src === 'board') {
      const r = board.getBoundingClientRect(), full = stickFull();
      const ox = (joy.ox - r.left) / px, oy = (joy.oy - r.top) / px;
      const kx = (joy.x - r.left) / px, ky = (joy.y - r.top) / px;
      ctx.strokeStyle = 'rgba(234,241,248,0.35)'; ctx.lineWidth = 2 / px;
      ctx.beginPath(); ctx.arc(ox, oy, full / px, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(234,241,248,0.3)';
      ctx.beginPath(); ctx.arc(kx, ky, 18 / px, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFx() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, (64 - p.t) / 20);
      ctx.font = `600 ${Math.round(fs(22) * p.size)}px ${MONO}`;
      ctx.lineWidth = 5; ctx.strokeStyle = C.deep; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  // ================= main loop =================
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(100, now - last); last = now;
    acc += dt * (slow > 0 ? 0.45 : 1);
    let n = 0;
    while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; if (slow > 0) slow--; }
    if (n === 6) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  applyVolumes();
  setPauseIcon();
  updateHud();
  showScreen('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
