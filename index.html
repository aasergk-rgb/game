        <div class="skill-list">${SKILLS.filter(k => k.kind === 'active').map(card).join('')}</div>
        <p class="section-label">パッシブスキル · 装備しているあいだ効果が続く</p>
        <div class="skill-list">${SKILLS.filter(k => k.kind === 'passive').map(card).join('')}</div>
        <p class="muted" style="font-size:.74rem;margin:14px 4px 0">スキルはレベルが上がると増えていく。パッシブの枠は Lv.${PASSIVE_SLOT_LV.join(' / ')} で開く。</p>`;
    },
    missions() {
      ensureMissions();
      const ms = save.missions, achWait = ACH.filter(achClaimable).length;
      const dailyWait = ms.list.filter(m => missionDone(m) && !m.claimed).length + (!ms.bonus && ms.list.every(m => m.claimed) ? 1 : 0) + (loginPending() ? 1 : 0);
      const seg = `<div class="segbar" role="group" aria-label="表示">
        <button type="button" data-act="misview" data-val="daily" aria-pressed="${misView === 'daily'}">デイリー${dailyWait ? `<span class="badge">${dailyWait}</span>` : ''}</button>
        <button type="button" data-act="misview" data-val="ach" aria-pressed="${misView === 'ach'}">実績${achWait ? `<span class="badge">${achWait}</span>` : ''}</button></div>`;
      if (misView === 'daily') {
        const rows = ms.list.map((m, i) => {
          const d = missionDef(m), done = missionDone(m);
          const act = m.claimed ? `<span class="claimed-mark">${I.check}受取済</span>` : done ? `<button class="btn3d small" type="button" data-act="claim-mis" data-i="${i}">受け取る</button>` : gemRw(m.reward);
          return `<div class="card mis${done ? ' done' : ''}${m.claimed ? ' claimed' : ''}"><span class="mi">${done ? I.check : I.target}</span><b>${d.text(m.n)}</b><span class="act">${done && !m.claimed ? gemRw(m.reward) : ''}${act}</span><span class="meta"><span class="xpbar"><i style="--p:${Math.min(100, Math.round(m.prog / m.n * 100))}%"></i></span>${fmt(Math.min(m.prog, m.n))}/${fmt(m.n)}</span></div>`;
        }).join('');
        const all = ms.list.every(m => m.claimed);
        const L = save.login, ld = loginPending() ? loginDay() : (L.total ? (L.total - 1) % 7 : -1);
        return `<h2>ミッション</h2>${seg}
          <div class="card mission-head"><span>今日のミッション</span><small>更新まで ${untilMidnight()}</small></div>
          <div class="ach-list">${rows}</div>
          <div class="card bonus${ms.bonus ? ' claimed' : ''}"><span class="mi">${I.gift}</span><span><b>3つすべてクリア</b><small>コンプリートボーナス</small></span>
            ${ms.bonus ? `<span class="claimed-mark">${I.check}受取済</span>` : all ? `<button class="btn3d small" type="button" data-act="claim-bonus">${gemRw(MISSION_BONUS)}</button>` : gemRw(MISSION_BONUS)}</div>
          <p class="section-label">ログインボーナス · 連続 ${L.streak} 日</p>
          <div class="card login-strip">${LOGIN.map((v, i) => `<span class="lg${i < ld || (i === ld && !loginPending()) ? ' got' : ''}${i === ld && loginPending() ? ' today' : ''}"><small>${i + 1}日目</small>${i === 6 ? skinIcon('sunrise') : '<span class="gem"></span>'}<b>${v}</b></span>`).join('')}</div>
          ${loginPending() ? '<button class="btn3d wide" type="button" data-act="login-claim">今日のログインボーナスを受け取る</button>' : ''}`;
      }
      const filters = [['all', 'すべて'], ['claim', '受け取り'], ['open', '未達成'], ['done', '達成済']];
      const order = a => achClaimable(a) ? 0 : !achDone(a) ? 1 : 2;
      const list = ACH.filter(a => achFilter === 'all' || (achFilter === 'claim' ? achClaimable(a) : achFilter === 'open' ? !achDone(a) : achDone(a)))
        .sort((a, b) => order(a) - order(b) || (order(a) === 1 ? (b.prog()[0] / b.prog()[1]) - (a.prog()[0] / a.prog()[1]) : 0) || a.tier - b.tier);
      const rows = list.map(a => {
        const done = achDone(a), [v, t] = a.prog(), p = done ? 1 : Math.min(1, v / t), [tl, tc] = TIERS[a.tier];
        const reward = `${gemRw(a.shards)}${a.skin ? `<span class="rw-skin">${skinIcon(a.skin)}${skinOf(a.skin).name}</span>` : ''}`;
        const act = achClaimable(a) ? `<button class="btn3d small" type="button" data-act="claim-ach" data-id="${a.id}">受け取る</button>` : done ? `<span class="claimed-mark">${I.check}受取済</span>` : '';
        return `<div class="card ach tappable${done ? ' done' : ''}${done && !achClaimable(a) ? ' claimed' : ''}" style="--tc:${tc}" data-act="ach-detail" data-id="${a.id}" role="button" tabindex="0">
          <span class="medal">${done ? I.trophy : I.lock}</span>
          <div class="ach-head"><b>${a.name}</b><span class="tier" title="${tl}">${'★'.repeat(a.tier)}<i>${'★'.repeat(5 - a.tier)}</i></span></div>
          <span class="ach-desc">${a.desc} · <em>${tl}</em></span>
          <span class="ach-foot"><span class="xpbar"><i style="--p:${Math.round(p * 100)}%"></i></span><small>${done ? '達成' : fmt(Math.min(v, t)) + '/' + fmt(t)}</small></span>
          <span class="ach-rw">${reward}${act}</span>
        </div>`;
      }).join('');
      const got = ACH.filter(achDone).length;
      return `<h2>ミッション</h2>${seg}
        <div class="card ach-sum"><b>${got}<small class="muted" style="font-size:.9rem"> / ${ACH.length}</small></b><span class="xpbar"><i style="--p:${Math.round(got / ACH.length * 100)}%"></i></span>${achWait ? `<span class="pill" style="background:var(--coral);color:#fff">受け取り ${achWait}</span>` : ''}</div>
        <div class="segbar small" role="group" aria-label="絞り込み">${filters.map(([v, l]) => `<button type="button" data-act="achfilter" data-val="${v}" aria-pressed="${achFilter === v}">${l}</button>`).join('')}</div>
        <div class="ach-list">${rows || '<p class="rank-empty">ここにはまだありません</p>'}</div>`;
    },
    records() {
      ensureDaily();
      const list = l => l.length
        ? l.map((r, i) => `<div class="rank-row"><span class="no">${i + 1}</span><b>${fmt(r.score)}</b><span>${r.loops}ループ</span><span>${r.date.slice(5).replace('-', '/')}</span></div>`).join('')
        : '<p class="rank-empty">まだ記録がありません</p>';
      const st = save.stats, mins = Math.floor(st.ms / 60000), secs = Math.floor(st.ms / 1000) % 60;
      return `<h2>記録</h2>
        <div class="best-row">
          <div class="card best-card"><small>エンドレス BEST</small><b>${fmt(save.best.endless)}</b></div>
          <div class="card best-card"><small>今日のデイリー</small><b>${fmt(save.daily.best)}</b></div>
        </div>
        <p class="section-label">エンドレス TOP 5</p>
        <div class="card rank-list">${list(save.top.endless)}</div>
        <p class="section-label">デイリー ${shortDate()} TOP 5</p>
        <div class="card rank-list">${list(save.top.daily)}</div>
        <p class="section-label">通算</p>
        <div class="totals">
          <div class="card"><small>プレイ</small><b>${fmt(st.plays)}</b></div>
          <div class="card"><small>ループ</small><b>${fmt(st.loops)}</b></div>
          <div class="card"><small>コイン</small><b>${fmt(st.coins)}</b></div>
          <div class="card"><small>ニアミス</small><b>${fmt(st.nears)}</b></div>
          <div class="card"><small>すり抜け</small><b>${fmt(st.phases)}</b></div>
          <div class="card"><small>時間</small><b>${mins}:${pad2(secs)}</b></div>
        </div>
        <button class="btn3d dark wide" type="button" data-act="share-best" style="margin-top:16px">${I.share}ベスト記録をシェア</button>
        <p class="section-label" style="text-align:center;font-weight:500">記録はこの端末のブラウザにだけ保存されます</p>`;
    },
  };

  // ================= modal sheets =================
  let modalKind = null, modalOpts = {}, shareText = '', lastResult = null;
  const closableByScrim = { settings: 1, howto: 1, pause: 1, level: 1, login: 1, ach: 1, share: 1 };
  let closeTimer = 0;
  const modalOpen = () => !modal.hidden && !modal.classList.contains('closing');
  const cardMode = () => matchMedia('(min-width: 700px) and (min-height: 560px)').matches;
  function resetSheetPos() {
    sheet.classList.remove('dragging', 'settle');
    sheet.style.transform = ''; scrim.style.opacity = '';
  }
  function openModal(kind, opts) {
    const swapping = modalOpen();
    clearTimeout(closeTimer);
    modal.classList.remove('closing');
    resetSheetPos();
    modalKind = kind; modalOpts = opts || {};
    sheet.innerHTML = MODALS[kind](modalOpts);
    sheet.className = 'sheet sheet-' + kind + (swapping ? ' swap' : '');
    modal.hidden = false;
    sheet.scrollTop = 0;
    if (kind !== 'result') sfx.open();
    AFTER[kind] && AFTER[kind](modalOpts);
    paintChars(sheet);
    const f = sheet.querySelector('[data-focus]');
    if (f) f.focus({ preventScroll: true });
  }
  // hide with the reverse of the opening motion; the sheet stays in the DOM until it has left
  function hideSheet() {
    if (modal.hidden || modal.classList.contains('closing')) return;
    sheet.classList.remove('dragging', 'settle');
    modal.classList.add('closing');
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => { modal.classList.remove('closing'); modal.hidden = true; resetSheetPos(); }, reduceMotion ? 0 : 270);
  }
  function closeModal() { modalKind = null; hideSheet(); }

  // swipe the sheet down by its top edge (the grey bar and title row) to dismiss it
  const dismissible = () => !!closableByScrim[modalKind];
  let drag = null;
  function dragStart(y, fromTop) {
    drag = { y0: y, t0: performance.now(), dy: 0, h: sheet.offsetHeight, live: fromTop };
    if (fromTop) sheet.classList.add('dragging');
  }
  function dragMove(y) {
    let dy = y - drag.y0;
    dy = dy < 0 ? dy * 0.15 : dismissible() ? dy : dy * 0.3;   // rubber-band when it cannot close
    drag.dy = dy;
    sheet.style.transform = `translateY(${dy}px)`;
    if (dismissible()) scrim.style.opacity = String(Math.max(0, 1 - dy / drag.h));
  }
  function dragEnd() {
    const d = drag; drag = null;
    if (!d || !d.live) return;
    sheet.classList.remove('dragging');
    const v = d.dy / Math.max(1, performance.now() - d.t0);
    if (dismissible() && (d.dy > d.h * 0.25 || (v > 0.5 && d.dy > 36))) { buzz(6); goBack(); return; }
    sheet.classList.add('settle');
    sheet.style.transform = ''; scrim.style.opacity = '';
    setTimeout(() => sheet.classList.remove('settle'), 300);
  }
  // touch: grab the top edge, or anywhere once the sheet is scrolled to the top and the finger moves down
  sheet.addEventListener('touchstart', e => {
    if (!modalOpen() || cardMode() || e.touches.length > 1) { drag = null; return; }
    if (e.target.closest('input, textarea, .carousel')) { drag = null; return; }
    const t = e.touches[0];
    dragStart(t.clientY, t.clientY - sheet.getBoundingClientRect().top < 80);
    drag.x0 = t.clientX; drag.top = sheet.scrollTop <= 0;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!drag) return;
    const t = e.touches[0], dy = t.clientY - drag.y0, dx = t.clientX - drag.x0;
    if (!drag.live) {
      if (Math.abs(dx) > Math.abs(dy) || dy < -4) { drag = null; return; }   // sideways or scrolling up: let the page handle it
      if (dy > 6 && drag.top && sheet.scrollTop <= 0) { drag.live = true; drag.y0 = t.clientY; drag.t0 = performance.now(); sheet.classList.add('dragging'); }
      else return;
    }
    e.preventDefault();
    dragMove(t.clientY);
  }, { passive: false });
  sheet.addEventListener('touchend', dragEnd);
  sheet.addEventListener('touchcancel', dragEnd);
  // mouse: drag by the top edge
  sheet.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || !modalOpen() || cardMode()) return;
    if (e.clientY - sheet.getBoundingClientRect().top > 76 || e.target.closest('button, input, .carousel')) return;
    dragStart(e.clientY, true); drag.id = e.pointerId;
    try { sheet.setPointerCapture(e.pointerId); } catch (err) {}
  });
  sheet.addEventListener('pointermove', e => { if (drag && drag.id === e.pointerId) dragMove(e.clientY); });
  sheet.addEventListener('pointerup', e => { if (drag && drag.id === e.pointerId) dragEnd(); });
  scrim.addEventListener('click', () => { if (closableByScrim[modalKind]) goBack(); });

  const sheetHead = (title, act) => `<div class="sheet-head"><h2>${title}</h2><button class="roundbtn" type="button" data-act="${act || 'close'}" aria-label="とじる">${I.close}</button></div>`;
  const P_SVG = (x, y, col) => `<circle cx="${x}" cy="${y}" r="16" fill="${col || '#ffb627'}"/><circle cx="${x - 5}" cy="${y - 2}" r="2.6" fill="#0d2546"/><circle cx="${x + 5}" cy="${y - 2}" r="2.6" fill="#0d2546"/>`;
  const G_SVG = (x, y, label) => `<circle cx="${x}" cy="${y}" r="16" fill="rgba(234,241,248,.15)" stroke="#eaf1f8" stroke-width="2.5"/><circle cx="${x - 5}" cy="${y - 2}" r="2.4" fill="#eaf1f8"/><circle cx="${x + 5}" cy="${y - 2}" r="2.4" fill="#eaf1f8"/>${label ? `<text x="${x}" y="${y - 22}" text-anchor="middle" font-family="monospace" font-size="11" fill="#9fb6d3">${label}</text>` : ''}`;
  const COIN_SVG = (x, y) => `<circle cx="${x}" cy="${y}" r="22" fill="none" stroke="#ffb627" stroke-width="3"/><path d="M${x} ${y - 12}l9 12-9 12-9-12z" fill="#ffb627"/>`;
  const SCENE = inner => `<svg viewBox="0 0 300 160" aria-hidden="true"><rect width="300" height="160" fill="#0d2546"/><path d="M0 40h300M0 80h300M0 120h300M60 0v160M120 0v160M180 0v160M240 0v160" stroke="rgba(234,241,248,.07)"/>${inner}</svg>`;
  function howtoSlides() {
    const touch = isTouch();
    return [
      ['コインを取ろう', 'ダイヤ形のコインを取ると<b>ループクリア</b>。制限時間は8秒。早く取るほど得点が増える。',
        SCENE(`<path d="M70 104 C 120 110, 170 70, 212 66" fill="none" stroke="#ffb627" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>${P_SVG(70, 104)}${COIN_SVG(232, 62)}`)],
      ['過去の自分が残像に', 'コインを取ると時間が巻き戻り、さっきの自分が<b>同じ道を往復しつづける</b>。触れたらアウト。',
        SCENE(`<path d="M40 128H150V48H262" fill="none" stroke="rgba(234,241,248,.1)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 128H150V48H262" fill="none" stroke="rgba(234,241,248,.35)" stroke-width="1.5" stroke-dasharray="4 5"/>${G_SVG(150, 92, '#1')}${P_SVG(78, 58)}<text x="78" y="32" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="11" fill="#ffb627">いまの自分</text>`)],
      ['ダッシュですり抜け', `ダッシュ中は残像に当たらない。使うと約1.4秒休み。${touch ? '右下の<b>DASH</b>で発動。' : '<b>Space</b>で発動。'}`,
        SCENE(`<path d="M86 66h70M70 80h86M86 94h70" stroke="#eaf1f8" stroke-width="3" stroke-linecap="round" opacity=".6"/>${G_SVG(170, 80, '#3')}${P_SVG(226, 80)}`)],
      ['寄り道は命取り', '寄り道すると残像の通り道が長くなる。<b>3秒以内</b>に取り続けると<b>CHAIN</b>で得点アップ。',
        SCENE(`<path d="M40 50L130 50" stroke="#4fd8a8" stroke-width="5" stroke-linecap="round"/><text x="85" y="34" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#4fd8a8">最短 ◎</text><path d="M170 50C200 140 210 10 240 110S280 40 270 60" fill="none" stroke="#ff6f59" stroke-width="5" stroke-linecap="round"/><text x="225" y="148" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#ff6f59">寄り道 ×</text><text x="85" y="110" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#ffb627">CHAIN ×2</text>`)],
      ['アイテムとSTORM', '<b>消しゴム</b>は一番長い残像を消す。<b>砂時計</b>は残像を2.5秒止める。<b>STORM</b>では残像が1.5倍速。',

  dashBtn.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if (active()) { dashQueued = true; dashBtn.classList.add('hit'); }
  });
  const unhit = () => dashBtn.classList.remove('hit');
  dashBtn.addEventListener('pointerup', unhit);
  dashBtn.addEventListener('pointercancel', unhit);
  dashBtn.addEventListener('click', e => { if (e.detail === 0 && active()) dashQueued = true; });
  skillBtn.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if (active()) { skillQueued = true; skillBtn.classList.add('hit'); }
  });
  const unhitSkill = () => skillBtn.classList.remove('hit');
  skillBtn.addEventListener('pointerup', unhitSkill);
  skillBtn.addEventListener('pointercancel', unhitSkill);
  skillBtn.addEventListener('click', e => { if (e.detail === 0 && active()) skillQueued = true; });
  pauseBtn.innerHTML = I.pause;
  pauseBtn.addEventListener('click', () => togglePause());

  // resuming counts down 3-2-1 so the player is not dropped straight back into danger
  const RESUME = 90;
  let resumeT = 0;
  function togglePause() {
    if (active()) {
      pausedFrom = state; state = 'paused'; endStick();
      bgmStop();
      openModal('pause');
    } else if (state === 'resuming') {
      state = 'paused';
      openModal('pause');
    } else if (state === 'paused') {
      state = 'resuming'; resumeT = RESUME; closeModal(); keys.clear();
      initAudio(); sfx.tick();
    }
  }

  let hudCache = '';
  function updateHud() {
    if (shownScore !== score) {
      const d = score - shownScore;
      shownScore += Math.abs(d) < 3 ? d : Math.round(d * 0.2);
    }
    const best = mode === 'daily' ? save.daily.best : save.best.endless;
    const key = [tut ? 't' + tut.step : '', loopN, shownScore, best].join('|');
    if (key === hudCache) return;
    hudCache = key;
    hud.loop.textContent = pad2(loopN);
    $('gLabel').textContent = tut ? 'TUTORIAL' : 'SCORE';
    if (tut) {
      hud.score.textContent = 'STEP ' + Math.min(tut.step, TUT_STEPS);
      hud.best.textContent = '全' + TUT_STEPS + 'ステップ';
      return;
    }
    hud.score.textContent = fmt(shownScore);
    hud.best.textContent = 'BEST ' + fmt(best);
  }
  // the SKILL button shows the equipped active skill; its ring fills one step per coin
  function skillBtnSetup() {
    const k = !tut && run && run.act;
    skillBtn.hidden = !k;
    if (k) { $('skillIc').innerHTML = k.ic; skillBtn.setAttribute('aria-label', 'スキル：' + k.name); }
    skCache = '';
  }
  let skCache = '';
  function syncSkillBtn() {
    if (skillBtn.hidden || !run || !run.act) return;
    const key = run.charge + '/' + run.act.charge;
    if (key === skCache) return;
    skCache = key;
    const full = run.charge >= run.act.charge;
    skillBtn.style.setProperty('--ready', run.charge / run.act.charge);
    skillBtn.classList.toggle('full', full);
    $('skillN').textContent = full ? 'READY' : key;
  }
  let cdCache = -1;
  function syncDashBtn() {
    syncSkillBtn();
    const v = Math.round((1 - P.cd / dashCd()) * 40) / 40;
    if (v !== cdCache) {
      cdCache = v;
      dashBtn.style.setProperty('--ready', v);
      dashBtn.classList.toggle('cool', v < 1);
    }
  }

  // ================= drawing =================
  function drawArena() {
    const g = ctx.createRadialGradient(500, 430, 80, 500, 520, 780);
    g.addColorStop(0, C.cyan); g.addColorStop(1, C.deep);
    ctx.fillStyle = g;
    ctx.fillRect(-60, -60, W + 120, W + 120);
    if (storm && (state === 'play' || state === 'paused')) {
      ctx.fillStyle = `rgba(255,111,89,${0.05 + Math.sin(tick / 9) * 0.03})`;
      ctx.fillRect(0, 0, W, W);
    }
    if (freezeLeft > 0) { ctx.fillStyle = 'rgba(143,227,255,0.07)'; ctx.fillRect(0, 0, W, W); }
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, W);
    ctx.lineWidth = 1 / px;
    for (let i = 50; i < W; i += 50) {
      ctx.strokeStyle = i % 250 === 0 ? 'rgba(234,241,248,0.13)' : 'rgba(234,241,248,0.05)';
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, W); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(234,241,248,0.25)';
    ctx.font = `500 ${10 / px}px ${MONO}`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(tut ? 'TUTORIAL' : (mode === 'daily' ? 'DAILY ' + today() : 'ENDLESS') + ' · SEED ' + (hashStr(seed) % 100000), W - 8 / px, W - 6 / px);
  }

  function drawEyes(x, y, dx, dy, col, r) {
    const l = Math.hypot(dx, dy);
    let ex = 0, ey = 0.35;
    if (l > 0.01) { ex = dx / l; ey = dy / l; }
    const off = r * 0.36, sp = r * 0.34, er = r * 0.17;
    ctx.fillStyle = col;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(x + ex * off - ey * sp * s, y + ey * off + ex * sp * s, er, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function starPath(g, x, y, r1, r2, n) {
    g.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r2 : r1; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath();
  }
  // draws a player skin centred on (x, y) with body radius r; o.dx/o.dy aim the eyes, o.t animates rainbow skins
  function drawSkin(g, x, y, r, sk, o) {
    o = o || {};
    const t = o.t || 0, c2 = sk.c2 || '#ffffff', TAU = Math.PI * 2;
    g.save();
    g.lineCap = 'round'; g.lineJoin = 'round';
    // accessories that sit behind the head
    if (sk.acc === 'ears') {
      for (const s of [-1, 1]) {
        g.fillStyle = sk.color;
        g.beginPath(); g.moveTo(x + s * r * 0.2, y - r * 0.86); g.lineTo(x + s * r * 0.92, y - r * 1.18); g.lineTo(x + s * r * 0.88, y - r * 0.32); g.closePath(); g.fill();
        g.fillStyle = sk.pat === 'stripes' ? c2 : '#ffb3c7';
        g.beginPath(); g.moveTo(x + s * r * 0.42, y - r * 0.8); g.lineTo(x + s * r * 0.82, y - r * 0.99); g.lineTo(x + s * r * 0.8, y - r * 0.55); g.closePath(); g.fill();
      }
    }
    if (sk.acc === 'horn') {
      g.fillStyle = c2;
      g.beginPath(); g.moveTo(x - r * 0.2, y - r * 0.82); g.lineTo(x + r * 0.05, y - r * 1.5); g.lineTo(x + r * 0.22, y - r * 0.8); g.closePath(); g.fill();
    }
    // body
    let fill = sk.color;
    if (sk.pat === 'rainbow') {
      const gr = g.createLinearGradient(x - r, y - r, x + r, y + r);
      for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, `hsl(${(i * 60 + t * 90) % 360}, 95%, 66%)`);
      fill = gr;
    } else if (sk.pat === 'gradient') {
      const gr = g.createLinearGradient(x, y - r, x, y + r); gr.addColorStop(0, sk.color); gr.addColorStop(1, c2); fill = gr;
    } else if (sk.pat === 'galaxy') {
      const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); gr.addColorStop(0, c2); gr.addColorStop(1, sk.color); fill = gr;
    }
    if (sk.pat === 'glow') { g.shadowColor = c2; g.shadowBlur = r * 0.9; }
    g.fillStyle = fill;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    g.shadowBlur = 0;
    // surface patterns, clipped to the body
    g.save();
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip();
    g.fillStyle = c2;
    if (sk.pat === 'stripes') { g.save(); g.translate(x, y); g.rotate(-0.6); for (let k = -3; k <= 3; k++) g.fillRect(k * r * 0.62 - r * 0.14, -r * 1.5, r * 0.28, r * 3); g.restore(); }
    else if (sk.pat === 'dots') for (const [a, b] of [[-0.55, -0.5], [0.15, -0.72], [0.62, -0.18], [-0.7, 0.3], [0.5, 0.62], [-0.12, 0.74]]) { g.beginPath(); g.arc(x + a * r, y + b * r, r * 0.13, 0, TAU); g.fill(); }
    else if (sk.pat === 'band') g.fillRect(x - r, y - r * 0.64, r * 2, r * 0.3);
    else if (sk.pat === 'face') { g.beginPath(); g.ellipse(x, y + r * 0.18, r * 0.66, r * 0.58, 0, 0, TAU); g.fill(); }
    else if (sk.pat === 'checker') { const q = r * 0.5; for (let i = -2; i < 2; i++) for (let j = -2; j < 2; j++) if ((i + j) & 1) g.fillRect(x + i * q, y + j * q, q, q); }
    else if (sk.pat === 'ring') { g.strokeStyle = c2; g.lineWidth = r * 0.13; g.beginPath(); g.arc(x, y, r * 0.8, 0, TAU); g.stroke(); }
    else if (sk.pat === 'galaxy') { g.fillStyle = '#ffffff'; for (const [a, b, z] of [[-0.5, -0.3, 0.05], [0.4, -0.5, 0.04], [0.62, 0.3, 0.06], [-0.3, 0.6, 0.04], [0.15, 0.62, 0.03], [-0.72, 0.1, 0.03], [0.05, -0.75, 0.035]]) { g.beginPath(); g.arc(x + a * r, y + b * r, r * z, 0, TAU); g.fill(); } }
    else if (sk.pat === 'star') { starPath(g, x + r * 0.5, y + r * 0.45, r * 0.3, r * 0.13, 5); g.fill(); }
    // light and shade give the body volume
    const hl = g.createRadialGradient(x - r * 0.35, y - r * 0.42, 0, x - r * 0.35, y - r * 0.42, r * 0.8);
    hl.addColorStop(0, 'rgba(255,255,255,0.45)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fillRect(x - r, y - r, r * 2, r * 2);
    const sh = g.createLinearGradient(0, y, 0, y + r);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.16)');
    g.fillStyle = sh; g.fillRect(x - r, y, r * 2, r);
    g.restore();
    // accessories in front
    if (sk.acc === 'leaf') {
      g.strokeStyle = '#3f8f3a'; g.lineWidth = r * 0.09;
      g.beginPath(); g.moveTo(x, y - r * 0.95); g.quadraticCurveTo(x + r * 0.05, y - r * 1.2, x + r * 0.12, y - r * 1.3); g.stroke();
      g.fillStyle = '#6fd36a';
      g.beginPath(); g.ellipse(x + r * 0.38, y - r * 1.3, r * 0.32, r * 0.15, -0.45, 0, TAU); g.fill();
    } else if (sk.acc === 'antenna') {
      g.strokeStyle = '#c7d3e6'; g.lineWidth = r * 0.08;
      g.beginPath(); g.moveTo(x + r * 0.2, y - r * 0.95); g.lineTo(x + r * 0.45, y - r * 1.45); g.stroke();
      g.fillStyle = c2; g.beginPath(); g.arc(x + r * 0.47, y - r * 1.5, r * 0.15, 0, TAU); g.fill();
    } else if (sk.acc === 'bow') {
      g.fillStyle = '#ff5c8a';
      const bx = x + r * 0.55, by = y - r * 0.78;
      g.beginPath(); g.moveTo(bx, by); g.lineTo(bx - r * 0.42, by - r * 0.26); g.lineTo(bx - r * 0.38, by + r * 0.24); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + r * 0.42, by - r * 0.26); g.lineTo(bx + r * 0.38, by + r * 0.24); g.closePath(); g.fill();
      g.fillStyle = '#ff9ec7'; g.beginPath(); g.arc(bx, by, r * 0.12, 0, TAU); g.fill();
    } else if (sk.acc === 'crown') {
      const y0 = y - r * 0.78, w = r * 0.5;
      g.fillStyle = '#ffd75e'; g.strokeStyle = '#b97d00'; g.lineWidth = r * 0.05;
      g.beginPath(); g.moveTo(x - w, y0); g.lineTo(x - w, y0 - r * 0.42); g.lineTo(x - w * 0.5, y0 - r * 0.2); g.lineTo(x, y0 - r * 0.55); g.lineTo(x + w * 0.5, y0 - r * 0.2); g.lineTo(x + w, y0 - r * 0.42); g.lineTo(x + w, y0); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#ff4f6d'; g.beginPath(); g.arc(x, y0 - r * 0.14, r * 0.08, 0, TAU); g.fill();
    } else if (sk.acc === 'halo') {
      g.strokeStyle = '#fff3a6'; g.lineWidth = r * 0.12; g.shadowColor = '#ffe66b'; g.shadowBlur = r * 0.5;
      g.beginPath(); g.ellipse(x, y - r * 1.22, r * 0.55, r * 0.16, 0, 0, TAU); g.stroke();
      g.shadowBlur = 0;
    } else if (sk.acc === 'hat') {
      g.fillStyle = '#3b2f7a';
      g.beginPath(); g.moveTo(x - r * 0.62, y - r * 0.66); g.lineTo(x + r * 0.62, y - r * 0.66); g.lineTo(x + r * 0.3, y - r * 1.75); g.closePath(); g.fill();
      g.beginPath(); g.ellipse(x, y - r * 0.68, r * 0.85, r * 0.17, 0, 0, TAU); g.fill();
      g.fillStyle = '#ffd75e'; starPath(g, x + r * 0.05, y - r * 1.05, r * 0.16, r * 0.07, 5); g.fill();
    }
    // eyes look where the player is heading
    // standing still, the eyes rest slightly below centre and look at the viewer
    const l = Math.hypot(o.dx || 0, o.dy || 0);
    let ex = 0, ey = 1, off = r * 0.08;
    if (l > 0.01) { ex = o.dx / l; ey = o.dy / l; off = r * 0.36; }
    const sp = r * 0.34, ec = sk.eye || '#0d2546';
    const at = s => [x + ex * off - ey * sp * s, y + ey * off + ex * sp * s];
    g.fillStyle = ec; g.strokeStyle = ec;
    if (sk.eyes === 'happy') {
      g.lineWidth = r * 0.11;
      for (const s of [-1, 1]) { const [qx, qy] = at(s); g.beginPath(); g.arc(qx, qy + r * 0.07, r * 0.13, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
    } else if (sk.eyes === 'sleepy') {
      g.lineWidth = r * 0.1;
      for (const s of [-1, 1]) { const [qx, qy] = at(s); g.beginPath(); g.moveTo(qx - r * 0.13, qy); g.lineTo(qx + r * 0.13, qy); g.stroke(); }
    } else if (sk.eyes === 'sparkle') {
      for (const s of [-1, 1]) {
        const [qx, qy] = at(s);
        g.fillStyle = ec; g.beginPath(); g.arc(qx, qy, r * 0.21, 0, TAU); g.fill();
        g.fillStyle = '#ffffff'; g.beginPath(); g.arc(qx - r * 0.07, qy - r * 0.08, r * 0.08, 0, TAU); g.fill();
      }
    } else if (sk.eyes === 'cool') {
      g.fillStyle = '#101a2c';
      for (const s of [-1, 1]) { const [qx, qy] = at(s); g.beginPath(); if (g.roundRect) g.roundRect(qx - r * 0.2, qy - r * 0.13, r * 0.4, r * 0.26, r * 0.08); else g.rect(qx - r * 0.2, qy - r * 0.13, r * 0.4, r * 0.26); g.fill(); }
      const [ax, ay] = at(-1), [bx, by] = at(1);
      g.strokeStyle = '#101a2c'; g.lineWidth = r * 0.07; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = r * 0.05;
      for (const s of [-1, 1]) { const [qx, qy] = at(s); g.beginPath(); g.moveTo(qx - r * 0.1, qy - r * 0.04); g.lineTo(qx - r * 0.02, qy - r * 0.08); g.stroke(); }
    } else {
      for (const s of [-1, 1]) { const [qx, qy] = at(s); g.beginPath(); g.arc(qx, qy, r * 0.17, 0, TAU); g.fill(); }
    }
    g.restore();
  }

  function drawGhost(g, gi, opts) {
    const p = ghostAt(g, gi), q = ghostAt(g, gi + 3);
    const isKiller = killer === g && (state === 'dying' || state === 'result');
    const frozen = opts.live && freezeLeft > 0;
    const danger = opts.live && !opts.intangible && Math.hypot(p[0] - P.x, p[1] - P.y) < NEAR + 46;
    const age = g.wall ? 2 : loopN - g.n;
    ctx.globalAlpha = (opts.intangible ? 0.4 : 0.95 - Math.min(age, 10) * 0.035) * (opts.alpha || 1);
    if (p[2]) {
      ctx.strokeStyle = 'rgba(234,241,248,0.35)'; ctx.lineWidth = R * 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0] - (q[0] - p[0]) * 1.5, p[1] - (q[1] - p[1]) * 1.5); ctx.stroke();
    }
    const stroke = isKiller || danger ? C.coral : frozen ? C.ice : storm && opts.live ? '#ffd2c9' : C.chalk;
    ctx.fillStyle = isKiller ? C.coral : frozen ? 'rgba(143,227,255,0.3)' : danger ? 'rgba(255,111,89,0.22)' : 'rgba(234,241,248,0.2)';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = danger ? 3.6 : 2.6;
    if (danger) ctx.globalAlpha = 1;
    if (opts.intangible) ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    drawEyes(p[0], p[1], q[0] - p[0], q[1] - p[1], isKiller ? C.deep : stroke, R);
    if (save.settings.hitbox && opts.live) {
      ctx.strokeStyle = C.coral; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p[0], p[1], HIT / 2, 0, Math.PI * 2); ctx.stroke();
    }
    if (!g.wall) {
      ctx.fillStyle = isKiller || danger ? C.coral : C.dim;
      ctx.font = `600 ${fs(20)}px ${MONO}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('#' + g.n, p[0], p[1] - R - 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPreview(g, gi) {
    const sp = storm ? STORM_SPEED : 1;
    ctx.fillStyle = C.chalk;
    for (let k = 1; k <= 12; k++) {
      const p = ghostAt(g, Math.floor(gi + k * 3 * sp));
      ctx.globalAlpha = 0.4 * (1 - k / 13);
      ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPickupLabel(x, y, text, col) {
    ctx.fillStyle = col; ctx.font = `600 ${fs(18)}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(text, x, y + 24);
  }

  function pill(x, y, text, bg, fg, align) {
    ctx.font = `600 ${fs(20)}px ${MONO}`;
    const w = ctx.measureText(text).width + fs(20) * 1.1, h = fs(20) * 1.6;
    const left = align === 'right' ? x - w : x;
    ctx.fillStyle = bg;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(left, y, w, h, h / 2); else ctx.rect(left, y, w, h);
    ctx.fill();
    ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, left + w / 2, y + h / 2 + 1);
  }

  function draw() {
    if (view !== 'game') return;
    const s = px * dpr;
    let sx = 0, sy = 0;
    if (shake > 0.4) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
    ctx.setTransform(s, 0, 0, s, sx * s, sy * s);
    drawArena();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    const held = state === 'paused' || state === 'resuming';
    const live = state === 'play' || (held && pausedFrom === 'play');
    const rewinding = state === 'rewind' || (held && pausedFrom === 'rewind');
    let gi = Math.floor(gtime);
    if (rewinding) {
      const p = Math.min(1, rewindT / REWIND), e = p * p * (3 - 2 * p);
      gi = Math.round(rewindFrom * (1 - e));
    }

    if (state === 'result') {
      ghosts.forEach((g, i) => {
        const a = clamp((revealT - i * 5) / 30, 0, 1);
        if (a <= 0) return;
        const t = ghosts.length > 1 ? i / (ghosts.length - 1) : 1;
        ctx.globalAlpha = a;
        ctx.strokeStyle = t > 0.66 ? skinOf(save.skin).color : t > 0.33 ? C.chalk : C.dim;
        ctx.lineWidth = 3; ctx.stroke(g.lane);
        ctx.globalAlpha = 1;
      });
    } else {
      for (const g of ghosts) {
        ctx.strokeStyle = 'rgba(234,241,248,0.045)'; ctx.lineWidth = R * 2; ctx.stroke(g.lane);
        ctx.strokeStyle = 'rgba(234,241,248,0.14)'; ctx.lineWidth = 1.2 / px; ctx.stroke(g.lane);
      }
    }

    const urgent = live && !tut && timeLeft <= 180;
    if (coin && (live || state === 'dying')) {
      const t = tick / 60, pulse = 1 + Math.sin(t * 6) * 0.08;
      const frac = tut ? 1 : clamp(timeLeft / limit(), 0, 1);
      if (tut) {   // a soft beacon so the target is obvious
        const k = (tick % 60) / 60;
        ctx.strokeStyle = `rgba(255,182,39,${0.6 * (1 - k)})`; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(coin.x, coin.y, 40 + k * 50, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(234,241,248,0.15)';
      ctx.beginPath(); ctx.arc(coin.x, coin.y, 36, 0, Math.PI * 2); ctx.stroke();
      if (!(urgent && Math.floor(tick / 8) % 2)) {
        ctx.strokeStyle = urgent ? C.coral : C.amber;
        ctx.beginPath(); ctx.arc(coin.x, coin.y, 36, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
      }
      ctx.save();
      ctx.translate(coin.x, coin.y); ctx.rotate(t * 1.6); ctx.scale(pulse, pulse);
      ctx.fillStyle = C.amber;
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(14, 0); ctx.lineTo(0, 18); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(5, -4); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (eraser && live) {
      const b = 1 + Math.sin(tick / 7) * 0.1;
      ctx.save(); ctx.translate(eraser.x, eraser.y); ctx.scale(b, b);
      ctx.fillStyle = C.coral;
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.deep; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.moveTo(6, -6); ctx.lineTo(-6, 6); ctx.stroke();
      ctx.restore();
      drawPickupLabel(eraser.x, eraser.y, 'ERASE', C.coral);
    }
    if (hourglass && live) {
      ctx.save(); ctx.translate(hourglass.x, hourglass.y); ctx.rotate(Math.sin(tick / 20) * 0.25);
      ctx.fillStyle = C.ice;
      ctx.beginPath(); ctx.moveTo(-13, -18); ctx.lineTo(13, -18); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-13, 18); ctx.lineTo(13, 18); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
      ctx.restore();
      drawPickupLabel(hourglass.x, hourglass.y, 'FREEZE', C.ice);
    }

    if (live && save.settings.preview && freezeLeft <= 0) for (const g of ghosts) if (!g.wall) drawPreview(g, gi);
    for (const g of ghosts) drawGhost(g, gi, { live, intangible: live && graceLeft > 0 });

    if (live && save.settings.control === 'mouse' && mouse && !joy && !isTouch()) {
      ctx.strokeStyle = 'rgba(234,241,248,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.moveTo(P.x, P.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); ctx.setLineDash([]);
    }

    const skin = skinOf(save.skin);
    if (state !== 'dying' && state !== 'result') {
      const at = rewinding ? nextStart : P;
      if (!rewinding) {
        for (let i = 0; i < P.trail.length; i += 2) {
          const a = i / P.trail.length;
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = skin.pat === 'rainbow' ? `hsl(${(tick * 3 + i * 12) % 360}, 95%, 66%)` : skin.color;
          ctx.beginPath(); ctx.arc(P.trail[i], P.trail[i + 1], R * (0.35 + a * 0.5), 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (graceLeft > 0 && live) {
        ctx.strokeStyle = skin.color; ctx.lineWidth = 2; ctx.globalAlpha = Math.min(1, graceLeft / GRACE);
        ctx.beginPath(); ctx.arc(P.x, P.y, R + 10 + Math.max(0, GRACE - graceLeft) * 0.6, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (live) {
        if (P.cd > 0 && P.dash <= 0) {
          ctx.strokeStyle = 'rgba(234,241,248,0.18)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(P.x, P.y, R + 8, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = 'rgba(234,241,248,0.7)';
          ctx.beginPath(); ctx.arc(P.x, P.y, R + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - P.cd / dashCd())); ctx.stroke();
        } else if (P.dash <= 0) {
          const ax = P.x + P.dx * (R + 12), ay = P.y + P.dy * (R + 12), nx = -P.dy, ny = P.dx;
          ctx.fillStyle = skin.color; ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(ax + P.dx * 9, ay + P.dy * 9); ctx.lineTo(ax + nx * 7, ay + ny * 7); ctx.lineTo(ax - nx * 7, ay - ny * 7);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1;
        }
        if (readyPulse > 0) {
          ctx.strokeStyle = skin.color; ctx.lineWidth = 3; ctx.globalAlpha = readyPulse / 16;
          ctx.beginPath(); ctx.arc(P.x, P.y, R + 8 + (16 - readyPulse) * 1.6, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
      drawSkin(ctx, at.x, at.y, R, skin, { dx: P.vx, dy: P.vy, t: tick / 60 });
      if (P.inv > 0 && live) {   // shield bubble; it flickers in its last half second
        if (P.inv > 30 || tick % 6 < 3) {
          ctx.strokeStyle = C.ice; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(143,227,255,0.14)';
          ctx.beginPath(); ctx.arc(at.x, at.y, R + 9 + Math.sin(tick / 5) * 1.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
      }
      if (P.dash > 0) {
        ctx.strokeStyle = C.chalk; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(at.x, at.y, R + 3, 0, Math.PI * 2); ctx.stroke();
      }
      if (save.settings.hitbox && live) {
        ctx.strokeStyle = C.deep; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(P.x, P.y, HIT / 2, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (state === 'dying') {
      const k = dyingT / DYING;
      ctx.strokeStyle = C.coral; ctx.lineWidth = 4; ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + k * 140, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    drawFx();

    // in-arena HUD: time bar across the top edge, with the chain window marked
    if (!tut && (live || rewinding || state === 'dying')) {
      const frac = rewinding ? 1 : clamp(timeLeft / limit(), 0, 1), bh = 10;
      ctx.fillStyle = 'rgba(234,241,248,0.12)'; ctx.fillRect(0, 0, W, bh);
      ctx.fillStyle = urgent ? C.coral : C.amber; ctx.fillRect(0, 0, W * frac, bh);
      const cx = W * (1 - fastClear() / limit());
      ctx.fillStyle = frame <= fastClear() && live ? C.chalk : 'rgba(234,241,248,0.35)';
      ctx.fillRect(cx - 2, 0, 4, bh + 8);
      const y = bh + 14;
      if (chain > 0) pill(16, y, 'CHAIN ' + chain + ' ×' + (1 + Math.min(chain, 8) * 0.25).toFixed(2), C.amber, C.deep);
      if (run && run.act && !isTouch() && (live || rewinding)) {
        const full = run.charge >= run.act.charge;
        pill(16, W - fs(20) * 1.6 - 16, run.act.name + (full ? ' READY · E' : ` ${run.charge}/${run.act.charge}`), full ? C.ice : 'rgba(5,16,34,0.6)', full ? C.deep : C.ice);
      }
      if (freezeLeft > 0 && live) pill(W - 16, y, 'FREEZE ' + (freezeLeft / 60).toFixed(1) + 's', C.ice, C.deep, 'right');
      else if (live) {
        ctx.fillStyle = urgent ? C.coral : 'rgba(234,241,248,0.6)'; ctx.font = `600 ${fs(20)}px ${MONO}`;
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText((Math.max(0, timeLeft) / 60).toFixed(1) + 's', W - 18, y + 4);
      }
    }

    if (rewinding) {
      ctx.fillStyle = 'rgba(234,241,248,0.05)';
      const off = (tick * 9) % 24;
      for (let yy = -24 + off; yy < W; yy += 24) ctx.fillRect(0, yy, W, 6);
      ctx.fillStyle = C.chalk; ctx.font = `400 ${fs(34)}px ${DISPLAY}`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('◀◀ 巻き戻し', 30, W - 40);
      if (tut && tut.step === 2) {
        ctx.font = `400 ${fs(26)}px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 8; ctx.strokeStyle = C.deep; ctx.strokeText('さっきの自分が残像になる…', W / 2, W / 2);
        ctx.fillStyle = C.chalk; ctx.fillText('さっきの自分が残像になる…', W / 2, W / 2);
      }
    }

    if (banner && (live || rewinding)) {
      const a = Math.min(1, banner.t / 18), sc = 1 + Math.max(0, banner.t - 66) / 14 * 0.3;
      ctx.save();
      ctx.globalAlpha = a; ctx.translate(W / 2, 170); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `400 ${banner.storm ? 62 : 70}px ${DISPLAY}`;
      ctx.lineWidth = 12; ctx.strokeStyle = C.deep; ctx.strokeText(banner.text, 0, 0);
      ctx.fillStyle = banner.storm ? C.coral : C.chalk; ctx.fillText(banner.text, 0, 0);
      ctx.font = `600 ${fs(24)}px ${MONO}`;
      ctx.lineWidth = 7; ctx.strokeText(banner.sub, 0, 62);
      ctx.fillStyle = C.amber; ctx.fillText(banner.sub, 0, 62);
      ctx.restore();
    }
    if (hint && hint.t > 0 && live) {
      ctx.globalAlpha = Math.min(1, hint.t / 30);
      ctx.font = `400 ${fs(26)}px ${DISPLAY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(hint.text).width + 44, h = fs(26) + 28;
      ctx.fillStyle = C.chalk;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(W / 2 - w / 2, W - 60 - h, w, h, h / 2); else ctx.rect(W / 2 - w / 2, W - 60 - h, w, h);
      ctx.fill();
      ctx.fillStyle = C.deep; ctx.fillText(hint.text, W / 2, W - 60 - h / 2);
      ctx.globalAlpha = 1;
    }
    if (retryHold > 0) {
      const w = 320, x = W / 2 - w / 2, y = W / 2 - 20;
      ctx.fillStyle = 'rgba(13,37,70,0.85)'; ctx.fillRect(x - 16, y - 46, w + 32, 84);
      ctx.fillStyle = C.chalk; ctx.font = `600 ${fs(22)}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('リトライ…', W / 2, y - 18);
      ctx.fillStyle = 'rgba(234,241,248,0.2)'; ctx.fillRect(x, y + 6, w, 10);
      ctx.fillStyle = C.amber; ctx.fillRect(x, y + 6, w * retryHold / RETRY_HOLD, 10);
    }
    if (flash > 0) { ctx.fillStyle = `rgba(255,248,230,${flash * 0.35})`; ctx.fillRect(-60, -60, W + 120, W + 120); }
    if (state === 'resuming') {
      const n = Math.ceil(resumeT / 30), k = (resumeT % 30) / 30;
      ctx.fillStyle = 'rgba(8,26,51,0.35)'; ctx.fillRect(0, 0, W, W);
      ctx.save(); ctx.translate(W / 2, W / 2); ctx.scale(1 + k * 0.35, 1 + k * 0.35);
      ctx.globalAlpha = 0.4 + (1 - k) * 0.6;
      ctx.font = `400 220px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 18; ctx.strokeStyle = C.deep; ctx.strokeText(String(n), 0, 10);
      ctx.fillStyle = C.amber; ctx.fillText(String(n), 0, 10);
      ctx.restore();
    }
  }

  function drawFx() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, (64 - p.t) / 20);
      ctx.font = `600 ${Math.round(fs(22) * p.size)}px ${MONO}`;
      ctx.lineWidth = 5; ctx.strokeStyle = C.deep; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  // ================= main loop =================
  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(100, now - last); last = now;
    acc += dt * (slow > 0 ? 0.45 : 1);
    let n = 0;
    while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; if (slow > 0) slow--; }
    if (n === 6) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  checkAch(true);
  renderProfile();
  showView('boot');
  paintChars(vBoot);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
